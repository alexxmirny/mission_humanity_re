# WEB2: owns three Pages documents and website-assets/*.webp; never wiki/update files.
# Keep BRANCH publishing; this is not actions/deploy-pages or a replacement site artifact.
# Always execute reviewed DEFAULT-BRANCH source, never workflow_run artifacts or tag code.
name: website

on:
  push:
    branches: [main, master]
    paths:
      - src/website/**
      - .github/workflows/website.yml
      - tools/gen_update_manifest.py
      - src/launcher/src/update.rs
  workflow_run:
    workflows: [release, launcher-release, promote, bridge-resign]
    types: [completed]
  release:
    types: [published, edited, deleted, unpublished]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    # A failed release workflow may already have published its GitHub release.
    if: vars.MH_PAGES_BRANCH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_BRANCH: ${{ vars.MH_PAGES_BRANCH }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: run focused website unit tests
        run: python -m unittest discover -s src/website -p test_build.py -v
      - name: read current Pages branch and generate owned files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PAGES_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/pages"
          test -f "$RUNNER_TEMP/pages/.nojekyll"
          test -f "$RUNNER_TEMP/pages/wiki/index.html"
          python src/website/build.py --repo "$GITHUB_REPOSITORY" \
            --pages "$RUNNER_TEMP/pages" --out "$RUNNER_TEMP/website"
      - name: commit only website documents and image assets
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html downloads.html site.css; do
            cp "$RUNNER_TEMP/website/$f" "$RUNNER_TEMP/pages/$f"
          done
          mkdir -p "$RUNNER_TEMP/pages/website-assets"
          cp "$RUNNER_TEMP/website/website-assets/"*.webp "$RUNNER_TEMP/pages/website-assets/"
          cd "$RUNNER_TEMP/pages"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html downloads.html site.css website-assets
          # Fail closed if staging ever broadens; wiki, channels, bridge and .nojekyll are not ours.
          while IFS= read -r path; do
            case "$path" in index.html|downloads.html|site.css|website-assets/*.webp) ;; *) echo "unexpected staged path: $path"; exit 1 ;; esac
          done < <(git diff --cached --name-only)
          if ! git diff --cached --quiet; then
            git commit -q -m "refresh project website (run ${GITHUB_RUN_ID})"
            pushed=0
            for i in 1 2 3 4 5; do
              if git push -q origin "HEAD:$PAGES_BRANCH"; then pushed=1; break; fi
              echo "Pages publisher raced (try $i); preserving its changes by rebasing"
              git pull -q --rebase origin "$PAGES_BRANCH"
            done
            [ "$pushed" = 1 ] || { echo 'website push failed'; exit 1; }
          fi
      - name: request branch build and verify the served website bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
          url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)"
          # A later manifest/wiki commit may be the newest build. Compare our served bytes,
          # not builds/latest.commit == our SHA, which would incorrectly fail in that race.
          while IFS= read -r f; do
            mkdir -p "$RUNNER_TEMP/served/$(dirname "$f")"
            ok=0
            for i in $(seq 1 30); do
              curl -fsS -H 'Cache-Control: no-cache' "${url%/}/$f?run=${GITHUB_RUN_ID}" \
                -o "$RUNNER_TEMP/served/$f" \
                && cmp -s "$RUNNER_TEMP/served/$f" "$RUNNER_TEMP/website/$f" \
                && { ok=1; break; }
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "served website $f differs from generated bytes"; exit 1; }
          done < <(cd "$RUNNER_TEMP/website" && find . -type f -printf '%P\n' | sort)
          echo 'Served website matches the generated static snapshot.'
