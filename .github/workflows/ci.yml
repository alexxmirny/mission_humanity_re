# CI -- the offline gate, on a runner with no game and no rig.
#
# THIS WORKFLOW TARGETS THE PUBLIC TREE. On the private repo some checks only pass because the
# private research layers (notes/, tracker/, tasks/, .claude/) and a local Ghidra export directory
# (tmp/) exist; `lint_repo.py --ci` is what makes the lint portable, and it names every row it holds
# back rather than dropping it silently. Read its CI_SKIPS table for the list and the reason behind
# each entry -- four classes, measured on a materialized publish-set tree: private research layers,
# a gitignored Ghidra export, a retail game copy + the publish ledger's own subject, and a drift
# gate whose comparison document the cut withholds. Everything else runs here exactly as it runs on
# the dev box -- the live counts are the runner's own `total/run/skipped` line and the table's own
# length, not this comment (numbers here go stale; two already did).
#
# THIS WORKFLOW ALSO RUNS ON THE PRIVATE REPO -- dispatched by hand there too, against a private
# remote -- so `--ci` is a statement about the RUNNER (no game, no rig, no Ghidra export), never about
# which tree was checked out. A row needing different behaviour on the two trees detects the tree
# instead: the publish-ledger rows ask the ledger's own `_public_tree_marker` and run
# `check_publishable --public` here and the private arms there (fork F5M).
#
# WHAT A GREEN RUN DOES NOT PROVE. The rig half of the gate is bring-your-own-game (fork ruling Q10):
# the UI capture suite, the two-peer determinism run, the in-memory patch parity oracle and anything
# else that boots the retail executable cannot run here and are not pretended to. src/mh_dll/README.md
# "The gate" is the full article; this is its offline subset.
#
# THREE JOBS, TWO OF THEM INDEPENDENT (re-cut 2026-09-18). The first cut was build -> gate in
# series, on the theory that a compile break should fail fast; MEASURED over five runs, the sln
# build is ~14 minutes on this runner (not the ~3 the theory assumed), and `gate` then rebuilt the
# same sln (14) + selftests (10) + replay (1.5) + lint (3.5) = 29-30 minutes against a 30-minute
# timeout, so the whole run was ~44 minutes and any slow runner cancelled the gate. Now:
#   * `build`     -- the sln build, the artifact roll-call, the libref replay and lint --ci. Lint
#                    needs the Release tree (check_module_bind, scan_libmh_vas, the libmh std
#                    contract and the inmem parity rows all read the built DLLs), so it lives with
#                    the build instead of downloading ~200 MB of it. ~20 minutes.
#   * `selftests` -- run_selftests.py, which BUILDS ITS OWN two trees (Release_asan + a plain
#                    selftest tree via build_selftest.bat) and never reads the sln's Release, so it
#                    shares nothing with `build` and starts at t=0. ~12 minutes.
#   * `proto_linux` -- unchanged, ~1 minute.
# Wall ~20 minutes, and no job is near its timeout. The runner-minutes are the same as before
# (two Windows jobs either way); what changed is that they overlap.

name: ci

# MANUAL ONLY (user ruling 2026-09-16): a run on every push is not needed. Trigger it from the
# Actions tab (or `gh workflow run ci.yml --ref <branch>`) when a branch is worth the ~20 minutes wall (two Windows jobs in parallel).
#
# THE `selftests` INPUT (2026-09-22, a quota ruling). Windows minutes bill at 2x and the two selftest
# halves are two thirds of this workflow's Windows spend, so they can be held back for a run that only
# needs the compile + lint answer. Three things make that safe rather than a hole:
#   * IT IS A PER-RUN INPUT, NOT A REPOSITORY VARIABLE OR AN ENV VAR. A sticky setting is invisible at
#     dispatch time and would silently turn every later run into a weaker one that still reports
#     green; an input is chosen per run, recorded in the run's own header, and defaults to ON.
#   * THE RUN LABELS ITSELF. When the halves are held back the build job writes it into the run
#     summary, so a green tick whose selftests did not run says so on its own page.
#   * THE RELEASE PATH CANNOT TAKE IT. release.yml does NOT call this workflow -- it carries its own
#     copy of the gate (`run_selftests.py --pass asan` / `--pass plain` + `lint_repo.py --ci`) against
#     the stamped tag, so an rc or a release is unaffected by anything chosen here.
# What this does NOT cover: `run_selftests.py` is also the pinned PRE-COMMIT gate on the dev box, and
# that rule is untouched. Holding the halves back here trades a re-run of something already run
# locally for minutes; it does not license committing without it.
on:
  workflow_dispatch:
    inputs:
      selftests:
        description: "Run the two selftest halves (ASan + plain). Off = build + lint only, ~2/3 fewer Windows minutes."
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The repo tree is formatted against the ruff and clang-format pinned/derived below. 3.11 is what
  # tools/requirements.txt's pins were taken from.
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: build (Release|x86) + libref replay + lint --ci
    # PINNED, NOT windows-latest. `windows-latest` AND `windows-2025` both resolve to the VS 2026
    # image since 2026-09 (measured: two red runs, `Image: windows-2025-vs2026`), and the gate FAILS
    # there: VS 2026 dropped the x86-host VC/Tools/Llvm/bin layout and bundles LLVM 20, while the
    # tree is formatted against clang-format 19.1.x (VS 2022 17.14, the dev box's BuildTools).
    # windows-2022 carries VS 2022 Enterprise 17.14 + VC.Llvm.Clang 17.14 -- the same formatter --
    # so the lint verdict here is the dev box's verdict. The vswhere `-version` range below is the
    # second guard: it names VS 2022 explicitly, so if this label migrates too the step fails with
    # "no VS 2022" rather than silently picking a newer toolset. Bump both deliberately, with a
    # clang-format --version check, never via `latest`.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: locate the Visual Studio install
        shell: pwsh
        run: |
          # MH_VS_INSTALL_ROOT is the ONE per-machine override this repo needs (fork F5C measured it);
          # everything else in tools/machine_config.py resolves from its committed defaults or from
          # __file__. On a self-hosted runner whose VS lives somewhere else, set MH_VS_INSTALL_ROOT in
          # the job env and delete this step -- that is the whole portability story.
          #
          # DERIVE, NEVER PASTE: a wrong MSBuild path fails SILENTLY the moment the command is piped
          # (two builds "succeeded" having never run).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { throw "vswhere found no VS 2022 (17.x) install carrying the x86/x64 VC tools" }
          "MH_VS_INSTALL_ROOT=$root" >> $env:GITHUB_ENV
          "MSBUILD=$root\MSBuild\Current\Bin\MSBuild.exe" >> $env:GITHUB_ENV
          Write-Host "VS root: $root"
          # MH_CLANG_FORMAT: machine_config DERIVES this from the VS root, so it is normally already
          # right. It is set explicitly here only to FAIL LOUDLY if the VS install carries no
          # clang-format -- substituting some other clang-format would be worse than failing, because
          # the formatting verdict is version-dependent and a different binary re-formats a tree that
          # is correct. If this throws, install the "C++ Clang tools for Windows" component (or point
          # MH_CLANG_FORMAT at the exact version the tree is formatted against).
          $cf = "$root\VC\Tools\Llvm\bin\clang-format.exe"
          if (-not (Test-Path $cf)) { throw "no clang-format at $cf -- install the VS 'C++ Clang tools for Windows' component; do NOT substitute another build" }
          "MH_CLANG_FORMAT=$cf" >> $env:GITHUB_ENV
          & $cf --version

      - name: build
        shell: pwsh
        run: |
          # The recipe from src/mh_dll/README.md step 1, verbatim in its flags. `/nodeReuse:false` IS
          # PART OF IT: with node reuse on, MSBuild's workers outlive the build holding the stdout
          # handle, and any caller that captures output waits forever for an EOF that never arrives.
          & "$env:MSBUILD" "$env:GITHUB_WORKSPACE\src\mh_dll\mh.sln" `
            /t:Build /p:Configuration=Release /p:Platform=x86 /m /nodeReuse:false /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "msbuild exit $LASTEXITCODE" }

      - name: every build artifact, by name
        shell: pwsh
        run: |
          # One msbuild produces all three configurations, and a single green build line is exactly
          # what would hide one artifact that silently stopped being produced (run_gate.py says the
          # same thing in the same words). Configurations: (1)+(2) mh.dll/mh_net.dll/mh_net_udp.dll/
          # mh_harness.dll [+libmh.dll], (3) Release\standalone\.
          #
          # The COUNT is gone from the step's name (it said "seven" while the list held eight, and
          # mp:T1 made it nine): this list grows with the module set, and a number in a heading is a
          # number nobody re-counts. The list below is the only place worth reading.
          $rel = "$env:GITHUB_WORKSPACE\src\mh_dll\Release"
          $want = @(
            "mh.dll", "mh_net.dll", "mh_net_udp.dll", "mh_harness.dll", "libmh.dll",
            "standalone\libmh.dll", "standalone\libref_host.exe",
            "net_selftest.exe", "libmh_selftest.exe"
          )
          $missing = @()
          foreach ($a in $want) {
            $p = Join-Path $rel $a
            if (Test-Path $p) { "{0,-28} {1,10} B" -f $a, (Get-Item $p).Length | Write-Host }
            else { $missing += $a }
          }
          if ($missing) { throw "BUILD PRODUCED NO $($missing -join ', ')" }

      - name: environment check (build tier gated, analysis/game/rig expected-absent)
        shell: pwsh
        run: python tools/bootstrap.py --ci

      - name: configuration (3) -- the standalone replay
        shell: pwsh
        # Replays the committed step-0 fixtures against Release\standalone\libmh.dll through
        # libref_host.exe. No game, no rig. It REFUSES with exit 2 and a named reason if the fixture
        # root is absent (fork F5C), so a withheld-fixtures answer to Q5 surfaces as a named refusal
        # rather than a traceback.
        run: python tools/replay_libref.py

      - name: lint (the public subset)
        shell: pwsh
        run: python tools/lint_repo.py --ci

      - name: say what this run did NOT cover
        if: ${{ always() }}
        shell: pwsh
        # A weakened run has to label itself on its own page, or the next reader takes the green tick
        # at face value -- the same reason lint_repo --ci names every row it holds back instead of
        # dropping it silently.
        run: |
          if ("${{ inputs.selftests }}" -eq "false") {
            $msg = ":warning: **Selftests were HELD BACK for this run** (``selftests: false``). " +
                   "This run proves the sln compiles, every artifact is produced, the standalone " +
                   "replay passes and ``lint_repo --ci`` is green. It proves NOTHING about " +
                   "``run_selftests.py`` -- neither the ASan half nor the plain half ran. Release " +
                   "and rc tags are unaffected: release.yml carries its own copy of the gate."
          } else {
            $msg = ":white_check_mark: Full offline gate: build + artifacts + standalone replay + " +
                   "lint --ci, and both selftest halves."
          }
          $msg | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host $msg

  # TWO PARALLEL HALVES, not one job: on the 2-core hosted runner the ASan build alone measured
  # 936 s on the first tagged run (v0.1.0-rc1, 2026-09-18) and the serial gate was cancelled at its
  # 30-minute budget with the plain build still compiling. Each half is its own tree and its own
  # pass (run_selftests.py --pass); together they are exactly the local gate.
  selftests-asan:
    name: selftests (ASan half)
    if: ${{ inputs.selftests }}
    runs-on: windows-2022  # same pin as `build`, same reason
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: locate the Visual Studio install
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { throw "vswhere found no VS 2022 (17.x) install carrying the x86/x64 VC tools" }
          "MH_VS_INSTALL_ROOT=$root" >> $env:GITHUB_ENV
          Write-Host "VS root: $root"

      - name: selftests (ASan half)
        shell: pwsh
        # THE GATE, not a bare `net_selftest.exe <suite>` run. A bare suite's "0 failures" is not
        # evidence the run did not silently corrupt heap memory; ASan turns that into a deterministic
        # stack trace on run #1. The project's pinned selftest-gate rule, in a machine.
        run: python tools/run_selftests.py --pass asan

  selftests-plain:
    name: selftests (plain half)
    if: ${{ inputs.selftests }}
    runs-on: windows-2022  # same pin as `build`, same reason
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: locate the Visual Studio install
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { throw "vswhere found no VS 2022 (17.x) install carrying the x86/x64 VC tools" }
          "MH_VS_INSTALL_ROOT=$root" >> $env:GITHUB_ENV
          Write-Host "VS root: $root"

      - name: selftests (plain half)
        shell: pwsh
        # THE GATE, not a bare `net_selftest.exe <suite>` run. A bare suite's "0 failures" is not
        # evidence the run did not silently corrupt heap memory; ASan turns that into a deterministic
        # stack trace on run #1. The project's pinned selftest-gate rule, in a machine.
        run: python tools/run_selftests.py --pass plain

  # dist DS1. THE ONLY LINUX-BUILDABLE CODE IN THE TREE, and until this job existed that claim was
  # UNVERIFIED -- src/mh_net_proto ships a CMakeLists and a README that both promise a gcc build, and
  # nothing had ever run one. It matters because the library exists PRECISELY to be linked by two
  # toolchains: MSVC inside the injected 32-bit DLL (via mh_net_proto.vcxproj, which the `build` job
  # above covers) and gcc/clang inside the headless relay. A header that only MSVC accepts turns the
  # portability claim into a comment.
  #
  # INDEPENDENT OF `build` AND `gate` ON PURPOSE (no `needs:`): it shares no artifact with them and
  # a Windows compile break should not hide a portability break, nor the reverse. ~1 minute.
  #
  # PINNED, NOT ubuntu-latest -- the same rule the two windows jobs above state at length, and for
  # the same reason: `latest` moved under this repo once already. Bump deliberately.
  #
  # WHAT IT DOES NOT PROVE: nothing here links a relay, because there is no relay yet (dist R1). It
  # proves the sources COMPILE under gcc with -Wall -Wextra and that the CTest round-trip/rejection
  # suite passes there. The portability contract the CMakeLists guards (no <windows.h>, no socket
  # headers) is asserted by the sources themselves; this is the job that would notice it breaking.
  proto_linux:
    name: mh_net_proto (gcc + ctest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: toolchain versions (so a red run says WHICH compiler)
        run: |
          cmake --version
          gcc --version
          ctest --version

      - name: configure + build
        run: |
          cmake -S src/mh_net_proto -B build/mh_net_proto \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build/mh_net_proto --parallel

      - name: ctest
        # --output-on-failure, because a bare "1 test failed" from a round-trip suite says nothing
        # about WHICH field stopped surviving the trip.
        run: ctest --test-dir build/mh_net_proto --output-on-failure
