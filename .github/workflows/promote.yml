# PROMOTE -- copy the `latest` launcher and/or game manifest to the `stable` channel.
#
# WHAT IT DOES. A manual run (workflow_dispatch, input `kind` = game | launcher | both) fetches the
# SERVED channels/latest/<kind>.json from Pages, verifies it against the key compiled into the
# launcher (update.rs PUBLIC_KEY), and re-signs the SAME artifact as channel `stable` with a fresh
# issued_at: `gen_update_manifest.py --promote ... --to stable` asserts that only `channel` and
# `issued_at` differ (sha256, size, url, version, min_launcher, relay all carried over) -- no rebuild,
# no new bytes. Then it commits channels/stable/<kind>.json (+ .minisig) to the Pages branch and
# reads it back, the same logic as release.yml's publish-pages.
#
# `both` promotes the launcher FIRST and checks the game against the just-promoted stable launcher:
# the min_launcher guard (--channel-launcher) refuses a stable game whose min_launcher is newer than
# the stable launcher, so a stable player is never offered a game their launcher cannot run. `game`
# alone checks against the stable launcher already served.
#
# THE SECRET stays in the first job (contents: read); only the second job can write the Pages
# branch. Nothing here builds, tags or touches a Release.
#
# Run it from the default branch (the tool and update.rs PUBLIC_KEY are read from the checkout).

name: promote

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to promote from latest to stable"
        type: choice
        options:
          - game
          - launcher
          - both
        default: both

permissions:
  contents: read

jobs:
  promote:
    name: re-sign latest as stable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ vars.MH_UPDATE_BASE_URL }}
      KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: fetch the served latest files
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${BASE}" ] || { echo "MH_UPDATE_BASE_URL repository variable is unset -- nothing to promote from"; exit 1; }
          base="${BASE%/}"
          mkdir -p served/latest served/stable
          kinds=()
          case "$KIND" in both) kinds=(launcher game) ;; *) kinds=("$KIND") ;; esac
          for k in "${kinds[@]}"; do
            for f in "$k.json" "$k.json.minisig"; do
              curl -fsS -H 'Cache-Control: no-cache' "$base/channels/latest/$f?run=${GITHUB_RUN_ID}" -o "served/latest/$f"
            done
            python tools/gen_update_manifest.py --verify "served/latest/$k.json"
          done
          # `game` alone: the stable launcher is the guard, and it must already be served.
          if [ "$KIND" = game ]; then
            for f in launcher.json launcher.json.minisig; do
              curl -fsS -H 'Cache-Control: no-cache' "$base/channels/stable/$f?run=${GITHUB_RUN_ID}" -o "served/stable/$f" \
                || { echo "no stable launcher is served yet -- promote the launcher first (kind: both or launcher)"; exit 1; }
            done
          fi

      - name: re-sign as stable
        shell: bash
        env:
          MH_LAUNCHER_MINISIGN_KEY: ${{ secrets.MH_LAUNCHER_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          [ -n "${MH_LAUNCHER_MINISIGN_KEY}" ] || { echo "MH_LAUNCHER_MINISIGN_KEY repository secret is unset -- refusing to sign"; exit 1; }
          key="${RUNNER_TEMP}/launcher_minisign.key"
          printf '%s\n' "${MH_LAUNCHER_MINISIGN_KEY}" > "$key"
          out=pages/channels/stable
          if [ "$KIND" = launcher ] || [ "$KIND" = both ]; then
            python tools/gen_update_manifest.py --promote served/latest/launcher.json --to stable \
              --secret-key "$key" --out "$out"
            guard="$out/launcher.json"
          else
            guard="served/stable/launcher.json"
          fi
          if [ "$KIND" = game ] || [ "$KIND" = both ]; then
            python tools/gen_update_manifest.py --promote served/latest/game.json --to stable \
              --secret-key "$key" --out "$out" --channel-launcher "$guard"
          fi
          rm -f "$key"
          for f in "$out"/*.json; do python tools/gen_update_manifest.py --verify "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: promoted-${{ github.run_id }}
          path: pages/channels/stable/
          if-no-files-found: error
          retention-days: 14

  publish-pages:
    name: publish channels/stable to the Pages branch
    needs: promote
    # Gated on MH_PAGES_BRANCH like release.yml's publish-pages; unset = skipped (grey).
    if: vars.MH_PAGES_BRANCH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    env:
      PAGES_BRANCH: ${{ vars.MH_PAGES_BRANCH }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: promoted-${{ github.run_id }}
          path: new

      - name: commit to the Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PAGES_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          mkdir -p site/channels/stable
          cp new/* site/channels/stable/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/stable
          if git diff --cached --quiet; then
            echo "channels/stable on $PAGES_BRANCH is already this"
          else
            git commit -q -m "promote ${{ inputs.kind }} latest -> stable (run ${GITHUB_RUN_ID})"
            pushed=0
            for i in 1 2 3 4 5; do
              if git push -q origin "HEAD:$PAGES_BRANCH"; then pushed=1; break; fi
              echo "push raced another Pages publisher (try $i) -- rebasing"
              git pull -q --rebase origin "$PAGES_BRANCH"
            done
            [ "$pushed" = 1 ] || { echo "could not push to $PAGES_BRANCH after 5 tries"; exit 1; }
          fi
          echo "PUSHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: build Pages and read the served files back
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
          url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)"
          for i in $(seq 1 60); do
            read -r status commit < <(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              --jq '"\(.status) \(.commit)"')
            if [ "$commit" = "$PUSHED_SHA" ] && [ "$status" = "built" ]; then break; fi
            if [ "$commit" = "$PUSHED_SHA" ] && [ "$status" = "errored" ]; then
              echo "Pages build of $PUSHED_SHA errored"; exit 1
            fi
            sleep 10
          done
          for path in new/*; do
            f="$(basename "$path")"
            ok=0
            for i in $(seq 1 30); do
              curl -fsS -H 'Cache-Control: no-cache' "${url%/}/channels/stable/$f?run=${GITHUB_RUN_ID}" -o "served_$f" \
                && cmp -s "served_$f" "$path" && { ok=1; break; }
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "served $f != the signed one after 5 min: ${url%/}/channels/stable/$f"; exit 1; }
            echo "served channels/stable/$f is byte-identical to the signed one"
          done
