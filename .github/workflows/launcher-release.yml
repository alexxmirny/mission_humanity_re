# LAUNCHER RELEASE -- build the per-user launcher with a static CRT, publish it as its own GitHub
# Release, and publish the signed channels/latest/launcher.json that launchers read.
#
# WHAT IT DOES. A pushed tag `launcher-vMAJOR.MINOR.PATCH[-rcN]` builds `mh_launcher` for
# `x86_64-pc-windows-msvc` with `RUSTFLAGS=-C target-feature=+crt-static` (dist LA1 finding #2: the
# default build imports VCRUNTIME140.dll, which a per-user installer with no admin rights and no
# bundled redistributable cannot rely on being present) and `MH_UPDATE_BASE_URL` baked in via
# `option_env!` (the Pages base URL -- see src/launcher/src/update.rs `DEFAULT_BASE_URL`), runs
# `cargo fmt --check` / `cargo clippy -D warnings` / `cargo test`, verifies the static-CRT claim
# against the built binary's own import table, checks the exe reports the tag's version, and -- on a
# tag push only -- creates the tag's GitHub Release carrying `mh_launcher.exe` (unversioned since
# v0.1.1: the file keeps one name so a player's folder never holds two; the version is inside,
# `--verify-binary`). A `workflow_dispatch` run does everything except publish.
#
# SCHEMA 2 / TAG SPLIT (RL8, v0.2.0; user decision 2026-10-08). Before v0.2.0 one `v*` tag built
# both halves and release.yml signed ONE manifest.json that this workflow's exe was polled into. Now
# the launcher and the game are separate signed files per channel and separate tags:
#
#   launcher-v*  -> THIS file: the exe + channels/latest/launcher.json (+ .minisig)
#   v*           -> release.yml: the game zips + channels/latest/game.json
#   promote.yml  -> copies a latest file to channels/stable/ (re-signed, same artifacts)
#
# A joint release is two tags, LAUNCHER FIRST: release.yml's min_launcher guard refuses a game
# whose min_launcher is newer than the launcher currently served. A `launcher-v*` tag does not match
# release.yml's `v*` filter (a glob anchors at the start), so the two never fire on one push.
#
# FOUR JOBS, and the split is the permission boundary: `build-and-test` (contents: read) compiles
# and tests; `publish` (contents: write) only creates the Release; `sign` (contents: read, but the
# only job that sees MH_LAUNCHER_MINISIGN_KEY) builds and signs launcher.json; `publish-pages`
# (contents + pages: write) commits it to the Pages branch and reads it back. There is no
# cross-workflow polling any more -- nothing here waits for release.yml.
#
# NO THIRD-PARTY RELEASE ACTION: `gh` is preinstalled on the runner and `GH_TOKEN` is the job's own
# token, so the steps that can write run code from the runner image and from this repository only.
#
# THE TAG IS ANNOTATED and its MESSAGE IS THE RELEASE NOTES, exactly as release.yml requires.

name: launcher-release

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Pages base URL manifest.json is published to (release.yml's new `publish-pages` job). A
  # REPOSITORY VARIABLE, not a literal here, for the same reason update.rs's own comment gives: this
  # tree carries no publisher identity (lint_machine_paths), so the one place the Pages URL is
  # spelled out is GitHub's own repository settings, not a tracked file. Read at BUILD time via
  # `option_env!("MH_UPDATE_BASE_URL")` -- see src/launcher/src/update.rs.
  MH_UPDATE_BASE_URL: ${{ vars.MH_UPDATE_BASE_URL }}

  # ---- dist RP1: the report collector, baked the same way and for the same reason -------------
  # Four values, read by `option_env!` in src/launcher/src/upload.rs. A build given NONE of them
  # still builds and still works -- it can assemble a report zip and cannot send one, which is what
  # a local `cargo build` should do; the Report view says so instead of offering a button.
  #
  # WHY EACH IS HERE RATHER THAN IN THE TREE, and why they are not one value:
  #   * MH_REPORT_URL       the collector's base URL. A repository VARIABLE, not a secret: it is an
  #                         address, and this tree may not carry one (lint_machine_paths).
  #   * MH_REPORT_TOKEN     the WRITE-ONLY report token (a repository SECRET). It can submit a
  #                         report and nothing else -- it cannot list, read or delete one -- which
  #                         is what makes baking it into a public binary acceptable, in the
  #                         Sentry-DSN sense plan decision D13 names. Rotating it is a new secret
  #                         plus a new launcher release.
  #   * MH_REPORT_CA_PEM    the collector's LOCAL ROOT CA certificate, PEM. There is no domain yet,
  #                         so Caddy serves `tls internal` and no public CA vouches for it; the
  #                         launcher therefore trusts exactly this one root and nothing else. It
  #                         must be the ROOT, not the leaf: Caddy re-issues the leaf every ~12h and
  #                         the intermediate every 7 days, each with a fresh key (measured on the
  #                         live edge, 2026-09-18), while the root is good for ten years. Export it
  #                         on the VPS with:
  #                           docker exec mh-caddy cat /data/caddy/pki/authorities/local/root.crt
  #                         A repository variable -- a public certificate is not a secret. Newlines
  #                         survive either shape: upload.rs restores a value flattened to `\n`.
  #   * MH_REPORT_SPKI_PIN  SHA-256 of that root's SubjectPublicKeyInfo, hex -- the REVIEWED
  #                         constant. upload.rs hashes the baked certificate and refuses to open a
  #                         socket unless the two agree, so a mis-fetched or silently re-keyed CA
  #                         fails closed rather than being trusted. Compute it with:
  #                           openssl x509 -in root.crt -pubkey -noout \
  #                             | openssl pkey -pubin -outform der | openssl dgst -sha256
  #
  # NOT gated by a "must be set on a tag" step the way MH_UPDATE_BASE_URL is below: an update source
  # is load-bearing for every player, while a launcher that cannot upload still builds the report
  # and says where it is. Set these when released builds are meant to reach the collector.
  MH_REPORT_URL: ${{ vars.MH_REPORT_URL }}
  MH_REPORT_TOKEN: ${{ secrets.MH_REPORT_TOKEN }}
  MH_REPORT_CA_PEM: ${{ vars.MH_REPORT_CA_PEM }}
  MH_REPORT_SPKI_PIN: ${{ vars.MH_REPORT_SPKI_PIN }}

jobs:
  build-and-test:
    name: build (release, static CRT) + fmt + clippy + test
    # x86_64-pc-windows-msvc is the launcher's only target (dist LA1: a 64-bit process launches the
    # 32-bit game; there is no reason to build an i686 launcher). windows-2022, matching release.yml
    # and ci.yml's pin, so the MSVC linker this links against is the one the rest of the gate is
    # measured on -- Rust's toolchain does not care which VS year is installed the way clang-format
    # does, but there is no reason to diverge the runner image for one job.
    runs-on: windows-2022
    # 35, not 20: the first real run (2026-09-18) finished every step at 19.6 minutes and the
    # budget then cancelled the rust-cache save, so the next run would have paid the cold build again.
    timeout-minutes: 35
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      exe_name: ${{ steps.stamp.outputs.exe_name }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      # `@stable` + the two components, the same shape images.yml uses. The first tagged run
      # (v0.1.0-rc1, 2026-09-18) proved the earlier `@master` form wrong: on the `master` branch
      # the action REQUIRES a `toolchain:` input ("'toolchain' is a required input") and reads
      # nothing from rust-toolchain.toml itself. The toolchain file still governs: rustup honours
      # it on every cargo invocation inside this tree, and it names the same stable channel, so
      # the dev box and this job resolve to one answer (dist plan decision D20). The components
      # are repeated here because the action installs them, not rustup-on-first-use.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the lockfile + the toolchain, scoped to this crate's own target dir so a change to
      # src/relay's dependencies cannot invalidate the launcher's cache (Swatinem/rust-cache reads
      # workspaces natively; `workspaces: src/launcher -> target` pins the cache to this member).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/launcher -> target"

      - name: derive the version and the shipped file name
        id: stamp
        shell: pwsh
        run: |
          # THE ONE PLACE THE LAUNCHER'S OWN VERSION IS DECIDED (the tag minus `launcher-v`), mirroring release.yml's `stamp` step
          # for the game: the workspace Cargo.toml pins version = "0.0.0" (dist LA2's own comment: "the
          # launcher's real version will be the one the release manifest advertises"), so a tag push is
          # what actually names a release, never a source-controlled number.
          $ref = "${{ github.ref }}"
          if ($ref.StartsWith("refs/tags/")) {
            $tag = $ref.Substring("refs/tags/".Length)
            $version = $tag -replace '^launcher-v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "tag '$tag' is not launcher-vMAJOR.MINOR.PATCH[-suffix]; see this file's header"
            }
          } else {
            $tag = ""
            $version = "0.0.0-dev"
          }
          "tag=$tag"                                  >> $env:GITHUB_OUTPUT
          "version=$version"                           >> $env:GITHUB_OUTPUT
          "exe_name=mh_launcher.exe"                   >> $env:GITHUB_OUTPUT
          Write-Host "tag='$tag' version=$version"

      - name: a tag release needs MH_UPDATE_BASE_URL, or the shipped exe has no update source
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        shell: pwsh
        run: |
          # NOT a build failure the compiler would catch: option_env!() with no value compiles to an
          # EMPTY string, and update::check() then refuses every run with "NO UPDATE SOURCE" -- a
          # launcher that quietly never checks for updates. A workflow_dispatch dry run is exempt
          # (it publishes nothing and exists to prove the build itself, per this file's own header).
          if ("${{ env.MH_UPDATE_BASE_URL }}" -eq "") {
            throw "MH_UPDATE_BASE_URL repository variable is unset -- a tagged launcher build with " +
                  "no update source is a release nobody can update. Set it (Settings -> Secrets and " +
                  "variables -> Actions -> Variables) to the Pages base URL, e.g. " +
                  "https://<owner>.github.io/<repo>, then re-run."
          }

      - name: cargo fmt --check
        shell: pwsh
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        shell: pwsh
        # --workspace, matching tools/lint_rust.py exactly (the same command lint_repo.py runs) --
        # this also lints src/relay, which is deliberate: one Rust lint definition, not two that can
        # drift. --all-targets so the mh_exit_probe fixture bin and the #[cfg(test)] modules are
        # covered too.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build (release, static CRT)
        shell: pwsh
        env:
          # dist LA1 finding #2. On the MSVC target this statically links the CRT (the /MT
          # equivalent) instead of the default dynamic one, so the shipped exe imports no
          # VCRUNTIME140.dll and no api-ms-win-crt-*.dll -- a per-user install with no admin rights
          # cannot lean on the VC++ Redistributable being present, and this project ships none.
          RUSTFLAGS: "-C target-feature=+crt-static"
          # THE VERSION STAMP (src/launcher/src/version.rs): the tag, stripped of its `v`, read by
          # option_env! at compile time. v0.1.0-rc2 shipped an exe that answered `mh_launcher 0.0.0
          # ok` because nothing set this; the step after the import-table check now refuses that.
          MH_LAUNCHER_VERSION: ${{ steps.stamp.outputs.version }}
        run: cargo build --release -p mh_launcher --target x86_64-pc-windows-msvc --bin mh_launcher
        # NOT --bin mh_exit_probe: that fixture is for the acceptance run (dist LA1), never a
        # release asset, and building it under the same static-CRT RUSTFLAGS costs a few seconds for
        # nothing this workflow reads.

      - name: cargo test
        shell: pwsh
        # DEV PROFILE, DELIBERATELY -- neither --release nor a RUSTFLAGS override: the unit tests
        # (dist LA2's update:: module in particular, which signs and verifies fixtures against the
        # compiled-in PUBLIC_KEY) do not need the static CRT or the release job's `lto = true` /
        # `codegen-units = 1` profile (measured locally: a dev-profile test compile is ~11s against
        # several minutes for the release profile this crate's [profile.release] configures), and
        # neither property is anything the test suite asserts.
        run: cargo test -p mh_launcher --bin mh_launcher

      - name: the static CRT claim, checked against the binary's own import table
        shell: pwsh
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r tools/requirements.txt
          $exe = "target\x86_64-pc-windows-msvc\release\mh_launcher.exe"
          # A TEMP .py FILE, NOT `python -c` WITH AN INLINE HERE-STRING: PowerShell's `@"..."@`
          # preserves this step's own YAML/script indentation verbatim, and Python raises
          # `IndentationError: unexpected indent` the moment its FIRST top-level line is not at
          # column 0 -- a trap easy to reintroduce if this check is ever inlined again.
          $checkPy = @'
          import lief, sys

          exe = sys.argv[1]
          b = lief.parse(exe)
          if b is None:
              sys.exit("lief could not parse %r as a PE" % exe)
          imports = sorted(i.name for i in b.imports)
          print("imported DLLs:", imports)
          bad = [n for n in imports if n.upper().startswith(("VCRUNTIME", "MSVCP", "API-MS-WIN-CRT"))]
          if bad:
              sys.exit(
                  "STATIC CRT CLAIM FAILED -- still imports %r (RUSTFLAGS did not take, or a "
                  "dependency pulled in the dynamic CRT some other way)" % bad
              )
          print("static CRT confirmed: no VCRUNTIME*/MSVCP*/api-ms-win-crt-* import")
          '@
          # dedent(): the here-string above is indented to match this step's own YAML block, which
          # would trip the SAME column-0 rule if written straight to disk.
          $dedented = ($checkPy -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          Set-Content -Path tmp_crt_check.py -Value $dedented -Encoding utf8
          python tmp_crt_check.py $exe
          if ($LASTEXITCODE -ne 0) { throw "the static-CRT check failed (see above)" }
          Remove-Item tmp_crt_check.py -Force

      - name: the shipped exe reports the tag's version (the self-update comparison depends on it)
        shell: pwsh
        run: |
          $want = "${{ steps.stamp.outputs.version }}"
          # NOT `$said = & exe`: the launcher is a GUI-subsystem exe, PowerShell does not wait for one
          # and closes the pipe under it (the first run of this step: 'failed printing to stdout: The
          # pipe is being closed'). Start-Process -Wait with a redirected stdout is how the launcher's
          # own health gate reads a candidate (update.rs health_gate: a piped Command, waited on).
          $proc = Start-Process -FilePath target\x86_64-pc-windows-msvc\release\mh_launcher.exe -ArgumentList '--verify-binary' `
            -Wait -NoNewWindow -PassThru -RedirectStandardOutput verify.txt
          $said = (Get-Content verify.txt -Raw).Trim()
          if ($proc.ExitCode -ne 0) { throw "--verify-binary exit $($proc.ExitCode): $said" }
          Write-Host "exe says: $said"
          if ($said -ne "mh_launcher $want ok") {
            throw "the built exe reports '$said', not 'mh_launcher $want ok' -- the MH_LAUNCHER_VERSION " +
                  "stamp did not reach the build (src/launcher/src/version.rs). Refusing to ship an exe " +
                  "whose self-update comparison can never settle."
          }

      - name: rename to the shipped file name and stage it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\mh_launcher.exe" "dist\${{ steps.stamp.outputs.exe_name }}"
          (Get-Item "dist\${{ steps.stamp.outputs.exe_name }}").Length | ForEach-Object { Write-Host "dist\${{ steps.stamp.outputs.exe_name }}: $_ B" }

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ steps.stamp.outputs.version }}
          path: dist/${{ steps.stamp.outputs.exe_name }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: create the launcher's GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # THE ONLY GITHUB-RELEASE WRITE SCOPE IN THIS FILE, on the job that does nothing but call `gh`.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The release BODY is the annotated tag's message, so this job needs the tag OBJECT.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: launcher-${{ needs.build-and-test.outputs.version }}
          path: dist

      - name: create the Release with the exe
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          exe="dist/${{ needs.build-and-test.outputs.exe_name }}"
          test -f "$exe" || { echo "no $exe in the downloaded artifact"; exit 1; }
          git fetch --tags --force --quiet
          # LIGHTWEIGHT TAGS ARE REFUSED (release.yml explains why `cat-file -t` is the reliable test).
          type="$(git cat-file -t "$tag")"
          if [ "$type" != "tag" ]; then
            echo "$tag is a LIGHTWEIGHT tag ($type). The release body is the annotated tag's message: re-cut it with 'git tag -a $tag -m ...'"
            exit 1
          fi
          git tag -l --format='%(contents)' "$tag" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "$tag has an EMPTY annotated message, and the message IS the release notes."
            exit 1
          fi
          pre=()
          ver="${tag#launcher-v}"
          case "$ver" in *-*) pre=(--prerelease) ;; esac   # a `-` after the version = prerelease
          gh release create "$tag" "$exe" --title "$tag" --notes-file release-notes.md --verify-tag "${pre[@]}"
          echo "published $exe to $tag"

  sign:
    name: build and sign channels/latest/launcher.json
    needs: [build-and-test, publish]
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    # ITS OWN JOB, ubuntu and pure Python: the only job here that sees the signing secret, with
    # contents: read -- it can sign and upload an artifact and nothing else.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: launcher-${{ needs.build-and-test.outputs.version }}
          path: dist

      - name: build, sign and verify launcher.json
        shell: bash
        env:
          MH_LAUNCHER_MINISIGN_KEY: ${{ secrets.MH_LAUNCHER_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MH_LAUNCHER_MINISIGN_KEY}" ]; then
            echo "MH_LAUNCHER_MINISIGN_KEY repository secret is unset -- refusing to publish an unsigned manifest (see release.yml / docs/release.md section 6)"
            exit 1
          fi
          key="${RUNNER_TEMP}/launcher_minisign.key"
          printf '%s\n' "${MH_LAUNCHER_MINISIGN_KEY}" > "$key"
          tag="${GITHUB_REF_NAME}"
          version="${{ needs.build-and-test.outputs.version }}"
          exe="dist/${{ needs.build-and-test.outputs.exe_name }}"
          python tools/gen_update_manifest.py \
            --kind launcher --channel latest \
            --version "$version" \
            --launcher-exe "$exe" \
            --launcher-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${{ needs.build-and-test.outputs.exe_name }}" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            --secret-key "$key" \
            --out pages/channels/latest
          rm -f "$key"
          # the key players trust (update.rs PUBLIC_KEY), not the one that happened to sign
          python tools/gen_update_manifest.py --verify pages/channels/latest/launcher.json
          cat pages/channels/latest/launcher.json

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-manifest-${{ needs.build-and-test.outputs.version }}
          path: pages/channels/latest/
          if-no-files-found: error
          retention-days: 14

  publish-pages:
    name: publish channels/latest/launcher.json to the Pages branch
    needs: [build-and-test, sign]
    # Same arrangement as release.yml's publish-pages (branch mode, gated on MH_PAGES_BRANCH, assets
    # first and the manifest last -- `publish` has already created the Release the file names). The
    # branch is shared with release.yml, promote.yml and bridge-resign.yml; they write different
    # files, so the push rebases and retries.
    if: startsWith(github.ref, 'refs/tags/launcher-v') && vars.MH_PAGES_BRANCH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    env:
      PAGES_BRANCH: ${{ vars.MH_PAGES_BRANCH }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-manifest-${{ needs.build-and-test.outputs.version }}
          path: new

      - name: commit the manifest to the Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PAGES_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          mkdir -p site/channels/latest
          cp new/launcher.json new/launcher.json.minisig site/channels/latest/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels/latest/launcher.json channels/latest/launcher.json.minisig
          if git diff --cached --quiet; then
            echo "launcher.json on $PAGES_BRANCH is already this release's -- nothing to commit"
          else
            git commit -q -m "launcher latest ${{ needs.build-and-test.outputs.version }} (${GITHUB_REF_NAME})"
            pushed=0
            for i in 1 2 3 4 5; do
              if git push -q origin "HEAD:$PAGES_BRANCH"; then pushed=1; break; fi
              echo "push raced another Pages publisher (try $i) -- rebasing"
              git pull -q --rebase origin "$PAGES_BRANCH"
            done
            [ "$pushed" = 1 ] || { echo "could not push to $PAGES_BRANCH after 5 tries"; exit 1; }
          fi
          echo "PUSHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: build Pages and read the served manifest back
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
          url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)"
          for i in $(seq 1 60); do
            read -r status commit < <(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              --jq '"\(.status) \(.commit)"')
            if [ "$commit" = "$PUSHED_SHA" ] && [ "$status" = "built" ]; then break; fi
            if [ "$commit" = "$PUSHED_SHA" ] && [ "$status" = "errored" ]; then
              echo "Pages build of $PUSHED_SHA errored"; exit 1
            fi
            sleep 10
          done
          for f in launcher.json launcher.json.minisig; do
            ok=0
            for i in $(seq 1 30); do
              curl -fsS -H 'Cache-Control: no-cache' "${url%/}/channels/latest/$f?run=${GITHUB_RUN_ID}" -o "served_$f" \
                && cmp -s "served_$f" "new/$f" && { ok=1; break; }
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "served $f != the signed one after 5 min: ${url%/}/channels/latest/$f"; exit 1; }
            echo "served channels/latest/$f is byte-identical to the signed one"
          done
