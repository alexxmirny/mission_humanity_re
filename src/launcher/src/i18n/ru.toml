"setting.net.improved_movement.hint" = "Юниты выбирают более прямые пути (короче обходят скалы и камни, лучше проходят в проходы), каждый юнит группы получает своё место в точке назначения, а застрявшие за своими юниты быстрее ищут обход. Юнит, посланный атаковать здание, больше не застревает, упираясь в препятствие по пути. Солдат теперь можно присоединить к отряду (Shift+правый щелчок), пока он атакует. Исправлено и несколько других ошибок передвижения. Выкл. = оригинальное передвижение. Меняет игру для всех: действует выбор хоста."
"setting.net.group_movement" = "Движение группой"
