"setting.ui.minimap_plus" = "Minimap extras"
"setting.ui.minimap_plus.hint" = "At the minimap's widest zoom the original hides resource markers, cuts the corners off with a round mask and omits the view box. On = resources, full corners and the view box at every zoom. Off = the original. Applied at the next start."
"setting.ui.bigmap" = "Big map (hold a key)"
"setting.ui.bigmap.hint" = "Hold the key to see the whole map over the game view, with your camera marked on it. A left click on it moves the camera there."
"setting.ui.bigmap_center" = "Centred on"
"setting.ui.bigmap_center.opt.camera" = "The camera"
"setting.ui.bigmap_center.opt.start" = "My landing spot"
"setting.ui.bigmap_center.opt.map" = "The middle of the map"
"setting.ui.bigmap_key" = "Key"
"setting.ui.bigmap_orders" = "Right click gives orders"
"setting.ui.bigmap_orders.hint" = "A right click on the big map gives the selected units the same order a right click on the side minimap does: move, attack, enter a building. While you are placing a building it only cancels the placement. Off = the right click on the big map does nothing."
"setting.lang.pack" = "Language — launcher and game"
"setting.lang.pack.hint" = "Only languages built for this game folder are selectable."
"setting.net.relay" = "Relay address"
"setting.net.force_relay" = "Always use relay"
"setting.net.force_relay.hint" = "Try this if direct connection fails."
"setting.hud.net_indicator" = "Network indicator in match"
"setting.hud.net_indicator_key" = "Network indicator key"
"setting.net.port" = "Host port"
"setting.net.port.hint" = "The port the game listens on when you host (1024–65535)."
"setting.net.turret_reload_realtime_fix" = "Turret reload follows real time"
"setting.net.turret_reload_realtime_fix.hint" = "Turrets reload at the same speed whatever the game speed. Off = the original, uneven reload."
"setting.net.turret_fire_rate_mult" = "Turret fire rate multiplier"
"setting.net.turret_fire_rate_mult.hint" = "How many times faster turrets reload. 2.0 is the default; allowed 0.1–10. Needs the real-time reload above."
"setting.net.turret_clip_fix" = "Turrets run out of ammo"
"setting.net.turret_clip_fix.hint" = "Turrets use their weapon's magazine and then take the long reload. Off = turrets never run dry (original)."
"setting.net.turret_fire_poll_fix" = "Turrets fire as soon as reloaded"
"setting.net.turret_fire_poll_fix.hint" = "A ready, aimed turret shoots the moment its reload ends. Off = the original small delay; turrets fire a bit slower."
"setting.net.mother_free_build" = "Build without a mothership"
"setting.net.mother_free_build.hint" = "You can place buildings with no landed mothership, and a power plant powers the base when none has landed. Off = the original: buildings need a landed mothership. Changes the game for everyone: the host's choice applies."
"setting.net.mother_free_build_ai" = "Computer players too"
"setting.net.mother_free_build_ai.hint" = "Only with Build without a mothership on: computer players may also build and power plants without a mothership. Off = they still need one."
"setting.caps.raise" = "Raised limits"
"setting.caps.raise.hint" = "Raises the game's size limits: up to 500 units and 500 buildings per player (originally 100 each); turrets, mines, laboratories, storages and production slots up to 127 each; up to 4000 shots in flight. Changes the game for everyone: the host's choice applies, and a game that cannot raise the limits leaves a match that uses them. A save made with this on can only be loaded with it on. Off = the original limits."
"setting.net.lockstep_max_ms" = "Max command delay (ms)"
"setting.net.lockstep_max_ms.hint" = "The longest the game may delay your orders to keep a multiplayer match in step on a slow or unstable connection. The game raises the delay only as much as the connection needs, so a higher limit costs nothing on a good link; pick 600-1000 ms if the match keeps stalling on a bad one. Default 400. Takes effect for everyone: the host's choice applies."
"setting.net.lockstep_max_ms.opt.400" = "400"
"setting.net.lockstep_max_ms.opt.600" = "600"
"setting.net.lockstep_max_ms.opt.800" = "800"
"setting.net.lockstep_max_ms.opt.1000" = "1000"
"setting.net.improved_movement" ="Improved unit movement"
"setting.net.improved_movement.hint" = "Units take more direct routes (shorter ways around cliffs and rocks, better use of gaps), each unit of a group gets its own spot at the destination, and units stuck behind friends reroute sooner. A unit ordered to attack a building no longer gets stuck walking into an obstacle on the way. Soldiers can now be merged into a squad (Shift+right-click) while it is attacking. Several other movement bugs are fixed. Off = the original movement. Changes the game for everyone: the host's choice applies."
"setting.net.group_movement" = "Group movement"
"setting.net.group_movement.hint" = "Units you order to move together keep to the speed of the slowest one, so a mixed group stays together and arrives together. Off = the original: each unit moves at its own speed. Changes the game for everyone: the host's choice applies."
"setting.net.improved_combat" = "Improved combat"
"setting.net.improved_combat.hint" = "Units attacking a large building measure their weapon range to its nearest edge instead of its centre, so they no longer walk up close to big buildings before firing. Off = the original. Changes the game for everyone: the host's choice applies."
"setting.net.project_gate_fix" = "Tech tree fixes"
"setting.net.project_gate_fix.hint" = "Campaign only. Conquered planets keep offering the research you have unlocked, and buildings or research you have already earned (for example the spaceport, once its planets are cleared) are offered as soon as you load a save or return to a visited planet, for you and the computer players. Off = the original game."
"setting.net.sp_sim_step_ms" = "Fixed simulation step (ms)"
"setting.net.sp_sim_step_ms.hint" = "A fixed simulation step makes a single-player game play out the same at any frame rate. 20 = 20 ms (default), 5–200 allowed. 0 = the original: one variable step per frame. Does not affect multiplayer."
"setting.log.level" = "Log level"
"setting.log.level.hint" = "Debug turns on order recording, extra traces and the in-game overlay. Logs get larger."
"setting.log.level.opt.quiet" = "Quiet"
"setting.log.level.opt.normal" = "Normal"
"setting.log.level.opt.debug" = "Debug"
"setting.desync.state_record" = "Record game state"
"setting.desync.state_record.hint" = "Large files, for bug reports: about 5.6 MB per minute of play, saved with the match logs."
