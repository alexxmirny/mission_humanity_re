# Launcher strings, English (dist RL16). This file is the REFERENCE: every key used anywhere must
# exist here, and every other language file may only contain keys that exist here (tests in
# src/i18n.rs enforce both). A key missing from another language falls back to this text.
#
# Flat table, quoted dotted keys. {name} is a placeholder filled by i18n::trf.
#   setting.<label>             a settings row's label     (<label> is the schema row's "label")
#   setting.<label>.hint        optional hint under the row
#   setting.<label>.opt.<value> one option of an enum / int row
#   subtab.<id>                 a Settings sub-tab
# Adding a setting = a registry row + these keys; no launcher code.

