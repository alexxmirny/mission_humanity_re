; =================================================================================================
; mh_net.ini -- REFERENCE / DEFAULT configuration for the injected mh.dll (EN build /eng/mh.exe).
;
; This file documents EVERY key the DLL reads from mh_net.ini, with its real default (taken from the
; source, not from memory). It is a REFERENCE: copy it next to mh.focus.exe and uncomment what you
; need. Every value shown is the DLL's own default unless marked otherwise, so an all-commented copy
; behaves exactly like no file at all.
;
; THE INI IS OPTIONAL (ship build, 2026-07-25). The DLL arms with no mh_net.ini present at all and
; ships tuned defaults: multiplayer is the product, not a debug mode, so a plain install is a working
; HOST and a working CLIENT with zero configuration -- the role comes from what you click in the menu
; (Create vs Join), and a joiner types the host address in-game. This file only OVERRIDES. Set
; [net] enable=0 for the explicit off switch.
;
;   * A key you don't set takes the default listed here.
;   * A SECTION you omit entirely disables that feature (this is the ship-safe rule -- see [debug]).
;   * ONE FILE SINCE FORK F2G. The determinism harness used to live in a separate mh_harness.ini
;     and to arm off THAT FILE'S MERE EXISTENCE; its [harness] block is now the last section
;     here, armed by `enable=1` and off when absent. A leftover mh_harness.ini beside the exe is
;     REFUSED (the run terminates, naming the file in mh_config_refused.log) rather than ignored:
;     a file that used to arm an instrument and now arms nothing is the quiet-wrong answer the
;     merge exists to remove. The same refusal covers the sections the fork RETIRED --
;     [promote], [promote_skip], [state_handler_skip], [rebind] (F2E) and [pacing], [test],
;     [probe] (F2G: fps_cap moved into [video], lane into [uitest], the cell-grid probe is gone).
;   * A STRING-VALUED KEY STILL CARRIES NO SAME-LINE COMMENT (user ruling 2026-09-20; the read side
;     durably fixed TL-HARN4, 2026-09-21). Win32 returns everything after the `=` as the value, so
;     `probe_text=   ; empty = off` used to draw the comment on every frame and
;     `relay=HOST:PORT   ; UDP only...` used to dial the comment -- that was the ORIGINAL trap. Since
;     TL-HARN4, almost every GetPrivateProfileStringA site in src/mh_dll reads through the shared
;     `mh::config::read_ini_string` helper (config/ini_read.h), which strips a trailing `;comment`
;     (and the whitespace before it) from the value it returns -- so a same-line comment on one of
;     those keys is trimmed, not dialled or drawn, in a HAND-WRITTEN copy of this file too, not just
;     here. This file still writes the comment on the line ABOVE the key anyway, for three reasons:
;     (1) tools/lint_ini_string_keys.py still fails the tree on any same-line comment on a derived
;     string key, so it keeps failing until this file's OWN style catches up, not because reads are
;     still unsafe; (2) two sites remain genuinely unfixed and a same-line comment there still corrupts
;     the value -- `[net] role` (mh_common/run_context.cpp, outside this fix's scope) and `[trace]
;     funcs` (net_diag.cpp, deliberately NOT routed: `;` is one of that key's own valid separators,
;     so stripping "first `;` onward" would silently truncate a real list rather than clean a
;     comment off it); (3) one written convention for every string key is simpler to follow than a
;     per-key judgment call about which ones happen to be safe today. Integer keys
;     (GetPrivateProfileIntA: atoi stops at the `;`) keep theirs -- unchanged, always safe.
;   * A SECOND block with the same name is DEAD TEXT. GetPrivateProfile* reads only the first
;     section of a given name and only the first occurrence of a key inside it, so keys go in
;     ONE block each. With every section now in one file this is the easiest mistake to make
;     here, and it is silent: the file looks right and the key is unreachable.
;
; Regenerate the key list after adding an ini option:
;     grep -rhoE 'GetPrivateProfile(Int|String)A\("[a-z]+", *"[a-zA-Z_0-9]+"' src/mh_dll/mh/
; Docs: src/mh_dll/README.md · the UI-input notes
; =================================================================================================


; -------------------------------------------------------------------------------------------------
; [config] -- WHICH IMPLEMENTATION RUNS. One key, and everything else derives from it (fork plan D11).
;
; This is the first key to read and the only one most installs will ever need to think about. It sets
; the DEFAULT that every "is this body ours" switch falls back to -- the promotion installs and the
; per-row rebind gate below -- so it is a configuration, not a knob.
;
;   brokered   (default) the reimplemented spine serves the domains it owns. What ships today.
;   original             the game's own bodies run: every promotion default is 0 and no rebind row
;                        is armed. mh.dll stays a shim, a patch host and the net restoration. This
;                        is the supported rollback, and it is TESTED -- not merely available.
;
; `standalone` is NOT selectable here: it is a property of the BUILD (MH_LIBMH_BUILD, libmh + a host
; with no game binary), and a hosted process claiming it would be describing a layout it does not
; have. An unrecognised value is REFUSED -- mh_config_refused.log names it and the process
; terminates (since F2E; the old fall-back-to-brokered-and-announce behaviour is gone).
;
; A NON-DEFAULT MODE ANNOUNCES ITSELF: `; [config] mode=original -- the ORIGINAL engine runs ...`.
; The brokered configuration prints nothing, deliberately -- the arm-log line sequence is a standing
; refactor gate, so the ship log must not grow a line that says what the absence of one already did.
; -------------------------------------------------------------------------------------------------
[config]
; brokered | original. NO TRAILING COMMENT HERE, by this file's convention (see the top-of-file
; note): this key's reader is a strict string compare, and a trailing comment used to BE the value
; and get the whole run refused (the F5F doc proof). TL-HARN4 (2026-09-21) fixed the read side --
; this key now goes through mh::config::read_ini_string, which trims a trailing `;comment` -- but
; the line stays bare here regardless, both for the lint and for one convention across every key.
mode=brokered


; -------------------------------------------------------------------------------------------------
; [net] -- transport, lockstep pacing, and the retail-overlay defangs.
;
; IMPORTANT: several other features (frame capture, the UI-script interpreter, the debug overlay) all
; piggyback the present hook that this section installs. A TRIMMED [net] block silently disarms them
; -- the menu still renders and nothing errors, you just never get a frame or an overlay. Keep the
; whole block.
; -------------------------------------------------------------------------------------------------
[net]
; TWO AXES, AND THEY ARE NOT THE SAME QUESTION (fork F3B demoted the first, F3F added the second).
;   module  -- is there a network transport in this build AT ALL?
;   enable  -- this run declines to use the transport it HAS.
;
; THE TRANSPORT IS A SEPARATE FILE SINCE FORK F4B: mh_net_udp.dll (or mh_net.dll -- `transport`
; below picks which), next to mh.dll, loaded at startup.
; DELETING IT IS A SUPPORTED CONFIGURATION and needs no key -- the game boots, the menu renders, the
; NETWORK GAME button still arms and the browser explains itself. `mh_net.log` names the outcome in
; its first line either way (BOUND / NOT BOUND / NOT ATTEMPTED). See docs/dll-split.md.
; auto | none. auto (default) = load the transport file from beside mh.dll, and degrade loudly if
; it is not there. none = do not even attempt the load: behave as though there is no network module, so
; the lobby/lockstep seams, the five control-frame handler binds and the seven bootstrap protocol
; stubs are not installed, the desync detector arms but never samples, and the MP browser carries
; a standing "No network module" line instead of an unexplained empty list. The NETWORK GAME
; button still arms and the menu keeps one shape (ruling Q2). A MISSPELLING IS REFUSED, not
; defaulted -- this key exists to be believed. NO TRAILING COMMENT ON THIS LINE, by convention:
; this key's reader is a strict string compare, and a trailing comment used to BE the value and get
; the whole run refused (the F5F doc proof). TL-HARN4 (2026-09-21) fixed the read side (routed
; through mh::config::read_ini_string, which trims a trailing `;comment`), but the line stays bare.
; `none` and a MISSING transport file arm identically; they differ only in which sentence the log's
; first line carries, because one is a decision and the other is a fact about the installation.
module=auto
enable=1                  ; 0 = skip the NINE net steps (the transport seams, the prologue guard,
                          ;     hold_start and the handler binds). Since fork F3B this is NOT an off
                          ;     switch for the DLL: the core arm -- promotions, tombstones, the
                          ;     in-memory patcher, hostapi/statebind/hostevt, the instruments and the
                          ;     non-net ini sections -- runs either way. The seams arm by default even
                          ;     with no ini file at all, so this is the transport's off switch.

; LINK SECURITY IS NOT CONFIGURED HERE. The transport authenticates + encrypts against the pre-shared
; key in mh_key.txt next to the exe (generated on first run; the host shares it with its players).
; There is no ini key for it on purpose: the ini is optional, and a secret that must be copied
; between machines is easier to send and replace as its own one-line file. See the internet-play notes.
;   mh_key.txt = 64 hex chars  -> authenticated + encrypted (default)
;   mh_key.txt = the word open -> no auth, no encryption (LAN/old builds; logged as a warning)
;   MH_KEY_FILE=<path> env var -> read the key from somewhere else

; --- WHICH transport (tracker mp:T1) ---------------------------------------------------------------
; A THIRD AXIS beside `module` and `enable`, and a different question from both: `module` asks whether
; this build has a transport at all, `enable` is the off switch for one it has, and this asks WHICH
; implementation of the same 23-export module contract answers.
;   udp  mh_net_udp.dll -- one UDP socket per process, the authenticated packet format in
;        docs/mp-wire-udp.md, a connect token minted by the host, and step inputs sent redundantly so
;        an ordinary loss is repaired with no retransmit and no added round trip. THE SHIPPING
;        DEFAULT since 2026-09-20 (user ruling): it is the transport the relay needs, the one the
;        launcher configures, and the one the determinism gate boots its peers with. An absent key
;        and an absent ini both mean udp.
;   tcp  mh_net.dll -- the TCP client-server star, the original restoration and the reference the
;        UDP transport was measured against. Direct dial only: it has no relay, so a host's TCP 6501
;        must be reachable (forwarded) by every joiner.
; EVERY PEER IN A MATCH MUST AGREE: the two speak different wire formats, so a tcp client cannot join
; a udp host and the join simply times out (the log says so). A MISSPELLING IS REFUSED, not defaulted
; -- a run asking for tcp and silently getting udp would report a transport it never used in every log
; line an operator reads. NO TRAILING COMMENT ON THIS LINE, by convention: a same-line comment used
; to become part of the value and get the whole run refused. TL-HARN4 (2026-09-21) fixed the read
; side (mh::config::read_ini_string trims a trailing `;comment`), but the line stays bare.
transport=udp
; udp_redundancy=3        ; UDP only: how many recent stream segments every datagram repeats. 1..4,
                          ;     default 3. Each datagram then carries the newest segment plus the two
                          ;     before it, so losing one datagram costs nothing at all and losing
                          ;     three in a row costs one round trip (the acknowledgement-driven
                          ;     retransmit repairs it). Raising it buys resilience with bandwidth;
                          ;     the ceiling is 4 because four 255-byte entries plus the packet header
                          ;     and tag already fill the 1200-byte datagram.
; bulk_selftest_mb=0      ; UDP only, MEASUREMENT ONLY, and 0 (off) in every shipped run. Non-zero
                          ;     makes the HOST push that many mebibytes of a synthetic blob across
                          ;     channel C -- the bulk reliable chunk transfer -- once a peer's desync
                          ;     sample reports the sim step below. It exists to answer one question
                          ;     on the rig: does a transfer in progress delay lockstep traffic on
                          ;     channel A? Run a determinism campaign with it and one without, and
                          ;     compare mp_analyze's frame-gap p95. The transfer is rate-limited to
                          ;     8 pieces per 20 ms tick (~440 KB/s), which is what makes the answer
                          ;     "no" rather than "it depends"; the blob is GENERATED from its offset,
                          ;     so the knob allocates nothing. SET IT ON BOTH PEERS: the sender needs
                          ;     it to start, and the receiver needs it to verify and discard instead
                          ;     of waiting for an application -- the module's 23 exports have no bulk
                          ;     row (mp:T2 leaves the ABI untouched), so nothing in mh.exe can drain
                          ;     the lane. Watch `net: udp bulk chunk lane depth ...` in mh_net.log.
; bulk_selftest_step=100  ; UDP only: the sim step the transfer above starts at. Default 100.
; UDP only: the RELAY this peer uses -- THE DIRECTORY TO BROWSE (mp:R7a).
;     A host with this set registers its lobby on the relay; a joining player
;     reaches it by BROWSING the relay's directory, so neither needs a port
;     forwarded and neither learns the other's address. The relay is
;     `mh_relay` (src/relay); it needs the SAME mh_key.txt the players hold,
;     because the peer-to-relay link is authenticated with a key derived from
;     it. If this is set and the relay cannot be reached WHEN A RELAYED DIAL
;     is made, the transport REFUSES to start (a peer that believes it is
;     relayed and is not would sit in a lobby nobody can reach). NO TRAILING
;     COMMENT on the real line is needed -- since mp:R7a the reader trims one
;     at the first `;` and says so in mh_net.log, but keep the real line clean.
;     WHAT USES THE RELAY, AND WHAT DOES NOT (mp:R7a). With this set you have
;     BOTH a relayed path and a direct one, chosen per connection:
;       * The FIRST browser (NETWORK GAME -> your name -> "Refresh list") is
;         the relay DIRECTORY: it lists every game registered on the relay
;         (real name, map, players) and Join goes THROUGH the relay (mp:R7).
;       * "Internet server" + a typed Server address is a GENUINE DIRECT DIAL
;         to that address -- the relay is NOT contacted for it. Use it to
;         reach a friend by IP even with a relay configured (that friend's
;         host port must be reachable/forwarded, as any direct connection).
;     A relayed match starts relayed by design and then tries to go DIRECT in
;     the background (mp:R3) -- see force_relay below. Before mp:R7a this key
;     forced EVERY connection through the relay; now it means only "the
;     directory I browse", and direct-by-IP is direct again.
; relay=HOST:PORT
; relay_room=6501         ; RETIRED at mp:R1e -- READ AND IGNORED, with a line in mh_net.log saying
                          ;     so. It used to pick which host in the relay a client asked for, and
                          ;     defaulted to `port` above. mp:R2 made the LOBBY mint the room: a
                          ;     client re-dials the room of the game it picked out of the browser,
                          ;     and since mp:R6 a host's room is a RANDOM code minted for each
                          ;     lobby (never `port`: on a shared relay everyone's port is 6501, so
                          ;     two hosts at once used to collide with "another host already holds
                          ;     this room code"). Two peers whose `port` disagrees find each other
                          ;     anyway. What was left was a silent override -- a stale value here
                          ;     out-voting the lobby the player just clicked, diagnosable only as
                          ;     `no_host` in a log nobody re-reads. Delete the key; nothing needs
                          ;     it. The room a host got is in mh_net.log: `net: udp relay -- host
                          ;     room <n>`.
; force_relay=0           ; UDP + relay only: PIN the relayed path and never go direct. Default 0.
                          ;     What it turns off: from mp:R3 a relayed match keeps trying, in the
                          ;     background, to replace the relay hop with a direct peer-to-peer one
                          ;     (UDP hole punching). The two peers swap the addresses they might be
                          ;     reachable at THROUGH the relay, probe them all at once, and switch
                          ;     the moment a probe and its echo both land -- and switch back to the
                          ;     relay within ~3 s if that path stops answering. You never wait for it:
                          ;     the game is already running relayed while it happens, and if it
                          ;     never succeeds nothing changes.
                          ;     Set it to 1 for one of two reasons. (1) To PROVE a relay carries a
                          ;     whole match -- a test run that silently went direct proves nothing
                          ;     about the relay. (2) Because the direct path is genuinely WORSE for
                          ;     you: two good paths into a datacentre can beat one bad path between
                          ;     two home connections, and if the game got choppy a few seconds in,
                          ;     this is the knob. mh_net.log names the path per peer and logs every
                          ;     switch, so you can tell which case you are in before changing it.
                          ;     Setting it on ONE peer keeps the PAIR relayed: a peer that publishes
                          ;     no addresses gives the other nothing to probe. It does still answer
                          ;     a probe if one arrives, so the other side is never left diagnosing a
                          ;     network that appears to drop them.

; --- transport -----------------------------------------------------------------------------------
; peer to connect to (client) / bind address (host). 0.0.0.0 = bind all. A menu joiner's typed
; in-game address WINS over this (U1c), so a no-ini install joins whatever the player types.
; (String value -- no trailing comment, by convention; TL-HARN4 (2026-09-21) now trims one before
; it would become part of the address.)
host=127.0.0.1
port=6501                 ; the star transport's port. Same NUMBER for both transports, but tcp/6501
                          ;     and udp/6501 are different ports as far as the OS and a firewall are
                          ;     concerned -- a port-forward or firewall rule made for one does not
                          ;     cover the other.
peers=1                   ; expected connections: host = clients to await, client = 1 (the host).
host_assign=0             ; 1 = the HOST assigns each joiner its player id over the wire (WELCOME)
                          ;     instead of trusting the client's declared player_id. Required for the
                          ;     hand-clicked N-player lobby path.
log=1                     ; write mh_net.log (the arm banner + DIAG lines). 1 = on (default).
bootstrap=1               ; install the MP bootstrap: synthesised discovery + no-op connect stubs so
                          ;     the retail lobby works without the original matchmaking.

; --- the map download (mp:X2) ----------------------------------------------------------------------
; A map is a file, and two installs can hold different bytes under one name -- a name is not an
; identity. So the lobby advertises the SHA-256 of the host's map file (truncated to eight bytes)
; beside its name; a joiner that does not hold those bytes fetches them over the same bulk channel the
; world snapshot uses, BEFORE the host can Start, and the host's Start button is held (with a lobby
; line naming the peer) until every joiner reports the right content.
;
; A download NEVER overwrites your own map, and never shows up in your map list. It is stored as
; `<name>.<16 hex>.<ext>` in a `mh_dl\` folder beside the game executable -- NOT in Maps and not
; under it, because the map picker lists sub-folders of Maps as browsable entries -- and the load
; resolves by CONTENT, so your own `Cold War.mpm` is still there, byte for byte,
; after a match played on somebody else's. Stock maps that come out of the resource packs are not
; advertised or transferred at all -- every install of the same build has identical bytes for those.
map_transfer=1            ; 1 = on (default). 0 = the pre-X2 behaviour: peers trust their own copy of
                          ;     whatever the map is called, and a mismatch is a step-1 desync with
                          ;     nothing in any log to name the cause. There is no good reason to set
                          ;     it, and it exists so the mechanism's absence is reproducible.

; UI-HARNESS ONLY, and it is not commented out by accident -- it does not belong in a played
; configuration. It stages the CLIENT-side starting condition each acceptance test needs and the
; wire cannot be asked to produce on cue. It is ignored on a host and it announces itself in
; mh_net.log. See tools/test_ui.py's map_absent / map_conflict scenarios.
;
; It stages a DECISION, not a file: NOTHING is moved, copied or deleted. The first version moved the
; map aside and that was wrong -- a local rig lane's `Maps` is a symlink to the one shared game
; image (tools/make_lane.py), so "make it absent for me" took the map away from the host too. What
; the knob changes is what this client REPORTS holding and whether its resolver considers the
; base-name file at all; the download, the content-addressed write and the redirect then all really
; happen, and the player's own file is untouched by construction.
; client: report holding NOTHING for the advertised map.
;map_test_pretend=none
; client: report a fixed hash that is not the host's, i.e. the
;     same-name-different-content case, decided rather than staged.
;map_test_pretend=other
; client (mp:X2d): hold the first advert from the connected host until this client's JOIN has gone
;     out, plus N ms -- the relay-join race the R6 re-send makes possible, staged on cue. 0 = off.
;map_test_advert_hold_ms=250

; --- link liveness (R-live) ------------------------------------------------------------------------
; TCP cannot tell an idle connection from a dead one, so the transport makes its own traffic and times
; out on the absence of the peer's. Leave these alone unless you are debugging: a frozen peer (TTD/cdb)
; looks dead after 10 s -- set rx_timeout_ms=-1 on BOTH peers for those sessions.
;ping_ms=1000             ; send a keepalive frame on each idle connection this often. -1 = never.
;rx_timeout_ms=10000      ; drop a connection with NO inbound bytes for this long. -1 = never.

; --- force-entry (launch verbs only) ---------------------------------------------------------------
; Read by launch.cpp to shove a peer straight into a match, bypassing menu -> lobby -> Start. OMIT
; these for a normal/UI-driven run: their presence is what selects the force-entry path.
;mp_players=2             ; total players in the forced match.
;player_id=               ; own slot: 0 = host, 1..N-1 = clients. Default: host 0, client 1.
; map name for the forced match. Default: the DLL's built-in MP map.
;mp_map=

; --- lockstep pacing -------------------------------------------------------------------------------
; The four pacing knobs below SHIP TUNED. Before 2026-07-25 they all defaulted to "off / leave the
; game's value" and the good values lived only in tools/mp_run.py's generated ini -- so the test rig
; ran a tuned build and a player ran an untuned one. Setting lockstep_step_ms EXPLICITLY (to any
; value, including 100) is read as an operator PIN and turns the adaptive controller off.
; pin the lockstep LOOKAHEAD, in ms == input latency. Default 100 (unset),
;     chosen for INTERNET play; the adaptive controller then tunes it down
;     toward the ~20 ms floor on a fast link. Parsed as a STRING via atof,
;     so fractional ms works ("100.25"). Setting it here disables adaptive.
;lockstep_step_ms=100
lockstep_adaptive=1       ; 1 = auto-tune the lookahead from measured pacing (see the block below).
                          ;     Defaults to 0 when lockstep_step_ms is set explicitly.
                          ;     SHAPE, so a log that looks odd can be read against it: it GROWS fast
                          ;     (adds the missing margin, may decide 500 ms into a window) and gives
                          ;     back slowly (full 2 s window, and only once comfortable windows have
                          ;     banked up). It declines to decide ANYTHING for the first 1.5 s after a
                          ;     peer measurement exists -- a joining client is genuinely starved until
                          ;     the host advertises, and acting on that would saddle it with a high
                          ;     lookahead for the rest of the match. A shrink gives back HALF the
                          ;     measured surplus, never more than 40% of the value in one window; the
                          ;     `; [adaptive]` lines in mh_net.log carry the error term behind every
                          ;     move (`tail95` = the peer's margin, `slack` = our own horizon the
                          ;     match never used, `owd` = the link delay that slack is corrected by
                          ;     before either arm reads it -- mp:P10, because an advertisement still
                          ;     in flight is not idle horizon, and without that correction the two
                          ;     peers push each other to opposite ends of the band). It will NOT grow
                          ;     past its peer: once our own lookahead exceeds the peer's, the pair's
                          ;     shortfall is on the peer's side and more of ours cannot help anyone.
                          ;     The START value is also left at 100 on measurement (mp:P11): the
                          ;     settled band is a property of the link, so a 300 ms start only buys a
                          ;     transient and charges 300 ms of input latency for it.
                          ;     None of this is configurable and none of it affects
                          ;     the simulation -- the lookahead is a per-peer LOCAL decision.
lockstep_min_ms=30        ; adaptive floor. The EFFECTIVE floor is max(this, 3 x sim_step_ms) -- 60 ms
                          ;     at the shipping 20 ms sim step. Lowering this key alone will NOT go
                          ;     below 3 sub-steps: a peer needs that much horizon to run concurrently,
                          ;     and at ~2 sub-steps a client FROZE mid-match (the MP latency notes).
lockstep_max_ms=400       ; adaptive ceiling (input-latency budget on a bad link). Raised 200->400
                          ;     after the U35 field test (2026-09-01, 3 peers via a ~200 ms relay):
                          ;     at 200 the controller saddles the ceiling and the delay-icon storm is
                          ;     62-85 icons/1k frames; at 400 it settles 270-370 ms and the storm
                          ;     falls ~12x. On LAN the controller settles ~100 and never nears this.
                          ;     RE-MEASURED AND LEFT AT 400 (mp:P11, 2026-09-22), against the
                          ;     specific question "raise it to 1000?". U35's saddling was the mp:P10
                          ;     RATCHET, not a link that wanted 400: with P10 in, the highest
                          ;     lookahead across nine post-fix peer samples (clean LAN and a 205 ms
                          ;     shim, starts of 100 and 300) is 235 ms -- 59% of this ceiling -- and
                          ;     the two arms run with this key AT 1000 peaked at 217 and 213. So
                          ;     raising it changes nothing on any link measured, while this value is
                          ;     the only bound on a runaway grow and the host pays any of it as
                          ;     command latency (CMD = local lookahead + one sub-step). Raise it only
                          ;     on a measurement of a link that genuinely wants more.
; auto-nudge the lookahead OFF the 10 ms clock grid by this epsilon. Round
;     targets (10/20/100) phase-lock with the centisecond clock and eat an
;     extra quantum most steps -- see the MP latency notes.
lockstep_step_eps_ms=0.01
; SIM sub-step interval, ms (string/atof). Default 20 = 50 Hz: far finer
;     than the stock 100 ms/10 Hz (smooth unit motion), half the sim work of
;     10 ms/100 Hz, and still an exact multiple of the 10 ms clock quantum.
;     This CHANGES THE SIM -- every peer must run the same value (they do,
;     it is a DLL default). 0 = leave the game's 100 ms.
sim_step_ms=20
horizon_heartbeat_ms=50   ; re-advertise our horizon every N ms even when idle. 0 = off. Keeps a
                          ;     peer's render hitch from starving the other peer's sim.
eager_advertise=1         ; 1 = advertise + commit the post-step horizon from the present hook rather
                          ;     than waiting for the next frame's time_tick. Closes the ~1-frame
                          ;     per-step forfeit (0.74x -> ~1.0x on a fast link) with no lookahead
                          ;     change. Determinism-safe: pacing only. MUST re-pass the region-hash
                          ;     oracle if you change it.
rx_spin=0                 ; ms to busy-poll the net pump when horizon-starved, instead of returning to
                          ;     the frame loop and losing a whole frame. 0 = off.
game_speed_pct=0          ; override the sim speed multiplier, percent. 0 = leave alone.
rig_fixed_step_loop=0     ; RIG ONLY, never ship on. Forces sim_tick's MODE-3 fixed-timestep
;                           catch-up loop in SINGLE-PLAYER, so the SP oracle integrates at
;                           SIM_STEP_INTERVAL like MP instead of one variable step per frame.
;                           Needs [promote] sim_tick=1 to have any effect (the original body
;                           still branches on the mode); the seam log reports both.
;                           WHY: in stock mode 2 the step SIZE scales with game_speed, so a fast
;                           run is a different integration -- 1x vs 10x diverges on nearly every
;                           hashed region from step 1. With this on, 1x and 10x are IDENTICAL on
;                           all 52 non-excluded regions over 2500 steps (measured 2026-08-01),
;                           so a fast run's golden is comparable with a 1x run's.
;                           It does NOT make runs faster: ~76-105 sim steps/s in every shape
;                           tried, i.e. the SIM STEP is the cost, not the frame. Tune throughput
;                           with sim_step_ms (bigger sub-step = fewer steps = coarser).
hold_start=0              ; 1 = hold at the start barrier (debugging the go-live handoff).

; --- clocks ----------------------------------------------------------------------------------------
hires_clock=1             ; 1 = timeBeginPeriod(1), raising the OS timer resolution.
qpc_clock=1               ; 1 = drive the game clock from QueryPerformanceCounter instead of the
                          ;     15 ms tick. Both are pacing-only and determinism-neutral. Shipped ON:
                          ;     the finer quantum is what recovers the per-step clamp discard.

; --- retail overlay defangs ------------------------------------------------------------------------
; The retail "SYNCHRONIZING" / "player not responding" overlays block the frame pump and can wedge a
; peer. These suppress them. See p3-defang.
defang_overlay=0          ; 1 = NOP the mode-8 resync barrier frame (defang_xui). THE SHIP IS 0: with 1
                          ;     the barrier's wait-screen frame never runs, so RESYNC_IN_PROGRESS latches
                          ;     after the first force_resync and every later one is a silent no-op --
                          ;     which hid the field's barrier storm on the UI rig for two months (mp:P9).
;defang_xui=              ; per-site: the extend_ui_enter call. DEFAULTS TO defang_overlay -- leave it
                          ;     unset to inherit; setting it explicitly overrides that inheritance.
; defang_tt_wait / defang_tt_sync / defang_dismiss were RETIRED by C8-e (a scope decision -- all
; three were default-off inside llm_strat_time_tick and resync_trigger_gate supersedes them as the
; root-cause fix). They are listed here only so nobody re-adds them: the DLL now REFUSES an ini that
; sets one, by name. Do not copy them into a real ini. Archive: the retired-patch log.
; overlay_gate went the same way in substance -- it is still parsed and nothing reads it.
icon_count=1              ; 1 = count the de-sync corner icon into mh_lockstep.log's icon_calls /
                          ;     icon_shown columns. Diagnostic only, and live on BOTH implementations
                          ;     since MP U20 (the original's call site via the counting thunk, our
                          ;     promoted body via set_icon_counters) -- so a 0 in those columns now
                          ;     means no icons rather than nobody counting.
desync_icon_gate=0        ; 1 = show the de-sync corner icon ONLY on genuine sustained silence
                          ;     (SYNC_RETRY_COUNTDOWN < 0x38), not on the routine at-horizon waiting
                          ;     that is the steady state at a tight lookahead (MP U20). Default OFF =
                          ;     stock. REIMPL-ONLY: there is no byte patch, so this does nothing
                          ;     unless [promote] lockstep is on -- the run log says which it got.
                          ;     Before reaching for it, check `lockstep_max_ms`: the measured cause of
                          ;     the storm is the adaptive controller saddling its 200 ms ceiling on a
                          ;     link that needs more, and probing downward every couple of seconds.
resync_wait_fix=1         ; 1 = fix the resync-wait garbage-spin that caused a permanent MP hang (a
                          ;     do{}while over an UNINITIALISED stack delay). Default ON -- turning it
                          ;     off restores the known hang.
resync_trigger_gate=1     ; 1 = gate the resync trigger (default on).
resync_count_init=1       ; 1 = recompute ACTIVE_PLAYER_COUNT once at match start (mp:P9 ROOT fix).
                          ;     Retail never does: the count stays 0 until the first player removal,
                          ;     so the leader's resync threshold (count*100) is 0 and the FIRST
                          ;     stall-nag of every episode fires the 2 s mode-8 barrier -- the ~2 s
                          ;     freeze storm of the 2026-09-20 field logs. With it, a 2-player match
                          ;     starts at threshold 200. Leader-local scratch only; determinism-neutral.
                          ;     Default ON; 0 reproduces the stock start (the resync_storm_repro row).
resync_trigger_reset=0    ; 1 = reset the resync trigger state.
resync_order_horizon=1    ; 1 = schedule the resync-begin synthetic order at the lockstep horizon
                          ;     instead of the stock hardcoded exec_time 2.0, so it lands on the SAME
                          ;     step on every peer (MP D14). Default ON -- off reproduces the stock
                          ;     bug, in which order_queue disagrees for ~30 steps once per match.

; --- peer departure --------------------------------------------------------------------------------
graceful_drop=1           ; 1 = on transport death, broadcast an immediate in-order player-remove so
                          ;     survivors keep playing instead of stalling ~60 counts (U17). Default ON.
graceful_leave=1          ; 1 = also broadcast a self-removal on a clean Menu->Quit. Default ON since
                          ;     U19. It is NOT covered by graceful_drop above, which the old default
                          ;     assumed: a player who quits to the main menu leaves the process (and
                          ;     its socket) alive, so nothing dies for graceful_drop to catch.
                          ;     Measured: OFF leaves the survivor in the SYNCHRONIZING spinner for
                          ;     ~57 s until the retail silence timeout; ON ends its match 187 ms
                          ;     after the quitter's broadcast, at the same game clock on both peers.
graceful_leave_park=1     ; mp:U19b. 1 = before that self-removal the quitter FREEZES its advertised
                          ;     horizon, waits (inside the quit, bounded below) until every survivor
                          ;     has parked on it, and stamps the removal record with that horizon.
                          ;     Without the stamp the record carries a slot nothing ever writes (the
                          ;     10 s sentinel), the retail receiver reads the mismatch as a
                          ;     divergence and ENDS EVERY SURVIVOR'S MATCH -- invisible with two
                          ;     players (that match ends anyway), fatal with three. Without the wait
                          ;     the survivors apply the roster flip at different sim clocks (the D5
                          ;     lesson). 0 = stamp only, no wait.
graceful_leave_park_ms=1500 ; the wait's safety valve, ms; past it the removal goes out unparked
                          ;     and the `; U19b graceful-leave:` line says VALVE-UNPARKED.
sync_gameover=1           ; 1 = leave lockstep when the game-over dialog opens, so the loser sees its
                          ;     result immediately.
data_timeout_ms=15000     ; mp:GS2. Drop a peer whose lockstep horizon has not moved (no DATA, whether
                          ;     or not its link is still answering keepalives) for this many ms; runs
                          ;     the same removal graceful_drop above uses. <= 0 disables. This is the
                          ;     BACKSTOP graceful_drop/graceful_leave above cannot reach: those fire on
                          ;     a transport DEATH or a clean quit, but a peer whose SIM freezes while
                          ;     its transport stays up (the field's 2026-09-20 freezes, since_rx 22-35 s
                          ;     with no exit) trips neither. 15000 is deliberately BELOW the low end of
                          ;     those freezes, so it actually resolves them, and ABOVE the link
                          ;     watchdog's own 10 s keepalive interval, so an ordinary keepalive-cadence
                          ;     hiccup never trips it. A quick Windows focus loss (alt-tab) pauses this
                          ;     peer's own game clock and reads the same as a freeze from the other
                          ;     peer's side -- not special-cased (an eventually-dropped backgrounded
                          ;     peer is ordinary MP behaviour); a map download or the in-match pause
                          ;     hotkey do not starve this (the former runs before lockstep, the latter
                          ;     is refused outright in a live match).
diplo_echo_nop=1          ; mp:U39. 1 (default) = the in-match ESC -> Diplomacy dialog's Apply no
                          ;     longer writes Players[you].relation[them] on THIS peer ahead of the
                          ;     replicated 0xf4 order (22 bytes NOPed at 0x004c8070): every peer's cell
                          ;     changes at the order's commit and nowhere else, so the hashed `players`
                          ;     region cannot differ for the 4 lockstep steps in between (measured
                          ;     2026-09-21). Cost: a dialog reopened INSIDE that window shows the old
                          ;     value and re-issues the same order (idempotent). 0 = retail behaviour,
                          ;     the u39_diplomacy_echo reproduction arm.
cancel_task_order=1       ; mp:D28. 1 (default) = in a lockstep match the building dialog's "cancel
                          ;     repair/task/upgrade -> Yes" issues the equivalent BUILDING ORDER (every
                          ;     peer closes the task out at the commit) instead of retail's local call,
                          ;     which changed hashed cells on the clicking peer only -- a permanent
                          ;     desync. Single player keeps the local call. 0 = retail behaviour, the
                          ;     d28_canceltask_local reproduction arm.

; --- logging ---------------------------------------------------------------------------------------
; Ship default is VERBOSE: a player reporting "it froze" should already have the evidence on disk.
; Everything lands in the per-SESSION folder logs\<UTC>Z_<mid8>_<slot>_<role>\ (never the game
; directory), and BOTH unbounded streams now rotate: mh_net.log at log_max_mb below and
; mh_temporal.log at [trace] temporal_max_mb.
log_max_mb=64             ; rotate mh_net.log -> mh_net.prev.log at this size (mp:SES2). One generation
                          ;     is kept, so the channel costs at most 2x this on disk however long a
                          ;     session runs -- what a post-mortem needs is the TAIL, not a .1/.2/.N
                          ;     ladder whose bound nobody can state. 0 = UNCAPPED (an operator asking
                          ;     for a complete long-run trace at their own risk). The cap is measured
                          ;     from the FILE, not from a per-writer counter, because five writers in
                          ;     three images append here (mh.dll's seam_log, mh_net.dll's logf,
                          ;     mp_menu.cpp, libmh_bind.cpp, module_bind.cpp). Enforced by seam_log,
                          ;     which is where a lockstep_log=1 session's volume comes from.
lockstep_log=1            ; 1 = per-frame mh_lockstep.log (wall/clock/committed/peer ms, stall, tx/rx...).
sp_clock_log=0            ; 1 = log every strategic frame even in single-player (no lockstep to gate on).
frametime_log=1           ; 1 = per-PRESENT mh_frametime.log (QPC us + game mode) -- what the player FEELS.
log_gamemode=0            ; 1 = log every _G_LLM_GAME_MODE write (uses debug registers).


; -------------------------------------------------------------------------------------------------
; [capture] -- rendered-frame capture. F12 always grabs one frame when the
; present hook is installed; these add automatic grabs. Output: capture_NNN.bmp in the run log dir
; (convert with tools/bmp_to_png.py).
; -------------------------------------------------------------------------------------------------
[capture]
frames=0                  ; auto-grab the first N presented frames. 0 = off.
every=0                   ; grab 1 frame every K presented. 0 = off. Hard-capped at 60 files.


; -------------------------------------------------------------------------------------------------
; [uitest] -- the UI automation harness (the UI-input notes). Injects synthetic events into the game's
; OWN mouse ring, so the game's real hit-test/activation runs.
;
; TRAP: a `script=` left here AUTO-REPLAYS that walk on the next manual launch instead of letting you
; play. Remove the key (not just enable=0) when you want to use the game by hand.
; -------------------------------------------------------------------------------------------------
[uitest]
enable=0                  ; 1 = arm the interpreter / auto-click.
; UI-script file (relative to the exe dir), e.g. mp_menu_walk.txt.
;script=
; single-target auto-click: widget label to click.
;click_label=
click_value=-1            ; single-target auto-click by sprite-menu value (-1 = unset). Sprite menus
                          ;     have NO text label -- target them by value (NETWORK GAME = 110).
settle_frames=2           ; require the target present this many consecutive frames before clicking
                          ;     (panels slide in; a click mid-slide misses).
dump_screens=0            ; 1 = log the active widget list on every screen change (script-authoring aid).
timeout_frames=1500       ; per-step watchdog: a WAIT that never comes true aborts the script.
lane=0                    ; PARALLEL LANES. N>0 rewrites the single-instance mutex name in place,
                          ;     "MHMutex" -> "MHMutNN", so N game copies in N folders can run at
                          ;     once (same length, so nothing else moves). 0 = the shipped name,
                          ;     i.e. a normal install is bit-identical in behaviour. Moved here
                          ;     from its own [test] section at fork F2G; [test] is refused now.


; -------------------------------------------------------------------------------------------------
; [debug] -- the in-game debug overlay.
;
; SHIP-SAFE RULE: no [debug] section => nothing installs at all. Deleting this block is the off switch;
; overlay=0 merely starts it hidden but still bindable to the toggle key.
;
; Layout is DATA: a page is an ordered list of named value PROVIDERS. An unknown item name renders "?"
; on screen rather than vanishing silently, so a typo is visible.
; -------------------------------------------------------------------------------------------------
[debug]
overlay=0                 ; 1 = visible at startup; 0 = installed but hidden (toggle key still works).
; x,y[,w,h] relative to `anchor`. w/h omitted = size to the text.
rect=8,8
; tl | tr | bl | br -- which corner `rect` is measured from. Survives a resolution change
; (width/height are re-read every frame). String value -- no trailing comment, by convention
; (TL-HARN4, 2026-09-21, now trims one).
anchor=tl
; text colour, RRGGBB hex (converted to RGB565).
color=ffffff
box=1                     ; 1 = darken the backing rect for legibility over bright terrain.
; whitelist of _G_LLM_GAME_MODE values; EMPTY = draw in every mode.
;     1 boot · 2 strategic · 3 menu · 4 paged list · 5 pause · 6 tactical
;     · 7 intro · 8 wait screen.   e.g. modes=2,6 = in-game only.
; (An empty value must stay EMPTY, by convention -- TL-HARN4 (2026-09-21) now trims a trailing
; comment before it would BE the value.)
modes=

; Hotkeys. Rebindable BECAUSE we cannot know what is free: the game's command-key table is unmapped,
; and our GetAsyncKeyState path is independent of the game's input ring, so a collision DOUBLE-FIRES
; rather than overriding. Hence Ctrl+Alt defaults, not bare F-keys (F10 = the in-game menu, F12 =
; capture, F7/F8 = ui_drive). Accepts "Ctrl+Alt+D", "Alt+F9", "VK_F10", "0x79", or "none".
toggle_key=Ctrl+Alt+D
next_page_key=Ctrl+Alt+PgDn
prev_page_key=Ctrl+Alt+PgUp

; Pages. With NO `pages=` key the DLL ships a built-in "DBG" page (mode/session/res/fps/clock), so
; `[debug] overlay=1` alone is already useful.
;   page.<name>.title = heading line (default: the page name)
;   page.<name>.modes = per-page mode gate (empty = inherit the global `modes=`)
;   page.<name>.items = comma-separated provider names
pages=hud,net,perf,sim

page.hud.title=HUD
page.hud.items=fps,perf.avg,perf.max,mode,session,net.clock

page.net.title=LOCKSTEP
page.net.items=net.player,net.peers,net.tx_rx,net.since_rx,net.clock,net.committed,net.lag,net.peer_ms,net.step_ms,net.srtt,net.loss,net.late,net.stall,net.flags,net.sync

page.perf.title=PERF
page.perf.items=fps,perf.ms,perf.avg,perf.min,perf.max,perf.hitches,frames

page.sim.title=SIM
page.sim.items=sim.rng,sim.power,sim.orders,sim.cursor,net.player

; --- provider reference ----------------------------------------------------------------------------
; general : mode      _G_LLM_GAME_MODE (see the modes= list above)
;           session   _G_LLM_GAME_SESSION_MODE (3 = lockstep)
;           res       framebuffer WxH
;           fps       presents/sec over a ~500 ms window
;           frames    presents since install (liveness proof)
;           clock     game clock, s.mmm
; perf    : perf.ms   last present-to-present frame time (QPC), ms with one decimal
;           perf.avg / perf.min / perf.max   over a 120-frame rolling window. A healthy avg beside a
;                     large max means STUTTER, not a low frame rate.
;           perf.hitches   frames over 50 ms since install
; net     : net.player     our own network player id
;           net.peers      connected peers + transport up/down
;           net.tx_rx      packets sent/received
;           net.since_rx   ms since the last packet arrived -- separates a FREEZE (rx stopped) from a
;                          STALL (rx fine, horizon stuck)
;           net.clock / net.total / net.horizon / net.committed   lockstep time values, ms
;           net.lag        committed - clock; <= 0 means horizon-starved (waiting on a peer)
;           net.peer_ms    peer0/peer1 horizons
;           net.step_ms    lockstep lookahead
;           net.srtt       mp:T3 -- peer 0's smoothed round trip +/- its RFC 6298 deviation, ms.
;                          `n/a` (not 0) when the bound transport cannot measure a round trip at
;                          all: the TCP module has no ping/echo channel, so `transport=tcp` always
;                          reads n/a here and `transport=udp` fills in after the first echo.
;           net.loss       mp:T3 -- peer 0's packet loss over a 256-packet sequence window, in PER
;                          MILLE (so 0.3% reads as `3 pm` instead of rounding away). UDP only, for
;                          the same reason, and loss is not a meaningful quantity over TCP anyway:
;                          a retransmitted stream shows a drop as added delay, never as a hole.
;           net.late       mp:T3 -- arrival lateness p50/tail95/tail99 in ms, plus the peer the tail
;                          came from and the sample count: how much MARGIN a peer's horizon left
;                          before the deadline the sim needed it by (positive = margin, negative =
;                          the sim waited). This is what the adaptive controller steers on, and
;                          unlike the two above it works over BOTH transports -- it is measured from
;                          the lockstep's own peer horizons, not from the wire.
;           net.stall / net.pcount / net.flags   stall count, player count, status flags (0x80 = awaiting-drop)
;           net.sync       grace / sync-wait / retry-countdown triple
;           (MP only -- all read zeros in single-player.)
; sim     : sim.rng    strategic PRNG words. A cross-peer DIFFERENCE IS NOT A DESYNC: this channel is
;                      proven not to feed game state and the determinism harness excludes it.
;           sim.power  local player's last-step power generated/consumed. (POWER is the generated
;                      resource; ENERGY is the HP-like stat -- different concepts.) Value still
;                      unverified-nonzero.
;           sim.orders order pipeline depths: queue / staging / pending
;           sim.cursor screen-space cursor px

; Development knobs (folded in from a second [debug] header 2026-09-21: GetPrivateProfileInt reads
; only the FIRST section of a name, so a key under a duplicate header is dead -- dead-ends G266).
; crash_after_ms   dist:LA4. N > 0 starts a thread that takes a deliberate access violation N ms
;                  after mh.dll attaches, to exercise the crash marker -> launcher minidump -> report
;                  path. Default 0: no thread is created and the knob costs nothing. The same fault
;                  also exercises dist:LA5's `.ctx32` sidecar + the launcher's synthesised minidump
;                  Exception stream -- no separate knob; the handler always writes one.
crash_after_ms=0


; -------------------------------------------------------------------------------------------------
; [trace] -- observe-only instrumentation (net_diag.cpp).
; -------------------------------------------------------------------------------------------------
[trace]
; comma-separated function VAs to hook and count -> mh_trace.log. Installed
;     LAST so an already-hooked entry is skipped, never double-hooked.
;funcs=
temporal=0                ; 1 = per-event temporal trace -> mh_temporal.log. Ship default OFF
                          ;     (mp:SES5, 2026-09-21; was ON): this is a PROFILING instrument, not
                          ;     player-report evidence -- no player-report question has ever needed
                          ;     it, and it measured 125 MB of a 43-minute match, rotated, with the
                          ;     tail overwriting exactly the window a report would need. The rig/lane
                          ;     inis (tools/ui_test.py, tools/mp_run.py) set this back to 1
                          ;     explicitly -- UI-REC/determinism/pacing work still wants it. When it
                          ;     IS on: the staging buffer is drained + recycled on every present, so
                          ;     run LENGTH is not a limit (only a >60k-event burst BETWEEN two
                          ;     presents drops events, and that is logged as a WARNING line).
temporal_sp=0             ; 1 = also record OUTSIDE SESSION_MODE 3. temporal_capture was gated to the
;                           live lockstep sim, so in single-player it armed, logged success, wrote its
;                           header and emitted NOTHING -- an empty trace and a quiet one looked the
;                           same, and the one instrument built for step-timing questions was unusable
;                           on the SP oracle. Default 0 so no archived run changes.
;                           In SP only 4 of the 8 event ids can fire (PRESENT/TIMETICK/SIMTICK/SIMSTEP);
;                           the rest need [trace] funcs= or are lockstep-only, so a 0 there is 'not
;                           applicable'. com_ms/loc_ms are lockstep horizons and sit idle.
;                           VOLUME: SP lanes hit several thousand strategic fps => ~400 KB/s. Set
;                           temporal_max_mb explicitly for a long run or it rotates to the tail.
temporal_max_mb=64        ; rotate mh_temporal.log -> mh_temporal.prev.log at this size. The trace
                          ;     writes ~40 KB/s, so an uncapped multi-hour session would be >100 MB/h;
                          ;     rotation bounds it at 2x this and keeps the TAIL (what happened just
                          ;     before the freeze). 0 = uncapped.


; -------------------------------------------------------------------------------------------------
; [menu] -- one-off diagnostic.
; -------------------------------------------------------------------------------------------------
[menu]
; scan memory for this marker string (used to locate the in-game IP buffer).
;findstr=


; -------------------------------------------------------------------------------------------------
; [video] -- display-mode selection (video.cpp; D13).
;
; The game already supports three render resolutions, already exposes the choice as a widget in the
; in-game options menu, and already persists it in setup.dat. What it does NOT offer is a way to pick
; the mode from outside the game -- setup.dat's settings block is LZW-compressed, so a test rig or a
; shipped mod cannot edit the preference directly. This block fills exactly that gap: it pre-sets the
; persisted value just before the main-menu loader reads it, which leaves the game in the same state
; as "the user picked this mode in options last run". The options widget still edits it and it still
; round-trips to setup.dat.
;
; NOTE the mode is a PERSISTED preference, so a run with no [video] block inherits whatever the
; machine last saved -- our test rigs were found sitting at mode 2. Pin it explicitly in anything
; whose output depends on resolution (the res_hud UI test does).
;
; MENUS ARE ALWAYS 640x480 and are unaffected by this setting: gameplay applies the mode, every menu
; and dialog drops back to mode 0 and restores on the way out. That is the game's own design.
; -------------------------------------------------------------------------------------------------
[video]
fps_cap=0                 ; >0 = bound the frame loop to N fps by sleeping in the present path.
                          ;     ONLY ARMS WITH no_present=1 below: a visible run paces through
                          ;     the DirectDraw blit instead, and the cap says so and does not
                          ;     install. That coupling is why the key lives here -- it was its
                          ;     own [pacing] section until fork F2G, which split one decision
                          ;     across two headers. Coarse (Sleep granularity). Used by the UI
                          ;     suite on multi-peer lanes, whose pace is set by the peer or the
                          ;     lockstep clock, so unbounded fps there is spin, not speed.
dpi_aware=1               ; 1 = declare the process DPI-aware at startup (per-monitor v2 where
                          ;     available, else system), replacing the HIGHDPIAWARE compatibility
                          ;     shim. The shim is keyed by absolute exe PATH, so it silently stops
                          ;     applying when the game is moved/renamed/installed elsewhere; doing it
                          ;     in-process travels with the build. Set 0 to go back to relying on the
                          ;     shim. See the Windows-compat notes.
;size_mode=-1             ; -1 (or absent) = leave the game's persisted preference alone; nothing installs.
                          ;     0 = 640x480, 1 = 800x576, 2 = 1024x768.
                          ;     Mode 1 renders 576 rows, not 600: llm_gfx_set_window_resolution sets the
                          ;     DirectDraw mode to 800x600 but snaps the render height down to a multiple
                          ;     of the 32px tile. Out-of-range values are ignored (logged, nothing armed).
                          ;     Arming + the applied mode are logged to mh_video.log, NOT mh_net.log, so
                          ;     the diffed seam arm-log sequence is unchanged.
;width=                   ; NON-STOCK resolution. Give BOTH width and height; the pair takes over mode 2
;height=                  ;     (so size_mode is forced to 2 and the game's own options widget / F7 /
                          ;     "1024X768" console command all select it). Modes 0 and 1 keep their stock
                          ;     meaning. Requirements, each logged and refused individually:
                          ;       - width a multiple of 32, and NOT a stock width (640/800/1024)
                          ;       - at least 640x480; height is snapped DOWN to a multiple of 32 (the
                          ;         tile height) exactly as stock mode 1 renders 800x576 for a 600 ask
                          ;       - (width/32) * (height/32) <= 4096 tiles
                          ;       - an AVAILABLE display mode on this machine (EnumDisplaySettings,
                          ;         matched on WxH) unless unverified=1
                          ;     Arming relocates five per-tile arrays out of their fixed .bss slots
                          ;     (stock ceiling ~1024 tiles, which 1024x768 nearly fills) into one
                          ;     VirtualAlloc'd block, by rewriting all 47 refsites; it refuses to
                          ;     half-patch. It also NOPs the four boot cursor stores -- the same inflated
                          ;     WindowWidth/Height that size the boot buffers otherwise seed CURSOR_Y=H/2,
                          ;     which llm_gfx_set_window_resolution does NOT clamp and hittest_begin then
                          ;     reads out of bounds (break-even: height > 960).
                          ;     Verified in-game up to 1600x1024.
                          ;     The bottom status bar's EXTENSION is per-mode artwork (icon 0x42+mode),
                          ;     too narrow above 1024x768 -- the DLL synthesizes a wider bitmap on the
                          ;     first blit (the blit takes w/h from the icon header), so the strip spans
                          ;     the viewport at any width. See D13.
;unverified=0             ; 1 = arm even if the size is not an available display mode. What decides
                          ;     whether a custom mode works is exactly that -- availability -- not height,
                          ;     width, tile count or pixel count (measured 10/10; 1920x1440 works,
                          ;     1792x1344 does not). On an unavailable size dgVoodoo raises its own
                          ;     "unsupported mode" modal and exits, so expect that rather than a crash:
                          ;     the DLL's re-entrancy guard stops the modal's message loop from pumping
                          ;     a WM_PAINT into a game frame over released surfaces. Verified end-to-end
                          ;     at 1280x1024, 1600x1024, 1920x1440 and native 2560x1440 (3600 tiles).
                          ;     NOTE the 32px height snap can itself turn a supported request into an
                          ;     unsupported one (1600x1200 -> 1184, 1920x1080 -> 1056).
;picker=0                 ; 1 = replace the options-menu "Screen size" control's stock 3 entries with a
                          ;     real list. The control is already generic -- its range is a `count` field
                          ;     and its labels a relocatable pointer table -- so this is two guarded dword
                          ;     writes plus a hook that maps index >= 2 onto the mode-2 machinery. Entries
                          ;     0/1 stay the engine-native 640x480 / 800x576, so every stock code path
                          ;     (the ~10 drop-to-mode-0 sites, F5/F6/F7, the reverse-snap, setup.dat) is
                          ;     untouched. The chosen index persists like any other preference.
                          ;     Boot buffers are sized for the LARGEST entry, so any pick fits.
; explicit list, "WxH,WxH,..."; overrides enumeration. Without it the list comes
;     from EnumDisplaySettings, which is PER-MACHINE -- fine for a player, wrong
;     for anything reproducible, since index N then names a different size on a
;     different box (the dev box enumerates 12 modes, the test VM 11, in a
;     different order). Pin the list for tests. Entries are still filtered by
;     the same rules as width/height above.
;     CAVEAT: with the picker armed you can persist an index > 2 into setup.dat.
;     Run the game later WITHOUT the picker and the stock engine cannot
;     interpret it and falls back to 640x480 -- harmless, but surprising. (It
;     bit the UI suite: a picker run left index 4 on a rig and the next
;     unpinned in-game baseline rendered 640x480 instead of 1024x768.)
;modes=

; -------------------------------------------------------------------------------------------------
; [ui] -- input/UI behaviour fixes that are not tied to a harness.
; -------------------------------------------------------------------------------------------------
[ui]
key_repeat_fix=1          ; U24. 1 = each keystroke typed into a menu/lobby text field (player name,
                          ;     direct IP, chat) is dispatched EXACTLY ONCE. The modal key pump
                          ;     llm_boot_intro_tick publishes a dequeued key into a global pair that
                          ;     the game never clears, and it is a 150 ms fixed-step catch-up
                          ;     accumulator: while it is behind the menu clock it reports one event
                          ;     per 150 ms of lag and the edit field re-dispatches the SAME character
                          ;     for each ("1" -> "1111111111111"). Chars per keypress =
                          ;     (MENU_NOW_MS - STEP_NEXT_MS)/150 + 1, so it reproduces on a machine
                          ;     whose menu frames lag and not on one that keeps up -- it is pacing,
                          ;     not the keyboard, not DirectInput, not the OS repeat settings.
                          ;     0 = OBSERVE-ONLY: the fix is off but bursts are still logged, which
                          ;     is how a machine that reproduces can A/B it. Either way every burst
                          ;     goes to mh_input.log (its own file, so the mh_net.log arm-line
                          ;     sequence the refactor gate diffs is unchanged). See
                          ;     src/mh_dll/mh/include/mh_keyrepeat_export.h.

; -------------------------------------------------------------------------------------------------
; [hud] -- mp:L1: the PLAYER-VISIBLE connection indicator, drawn during a network match.
;
; Not the debug overlay. The `[debug]` section above is a developer instrument: it ships OFF, paints
; with the DLL's own blitter and font, and shows eighteen readouts. This ships ON, paints with the
; GAME's own font through the game's own text path, and shows three numbers plus one message --
; per-peer ping, a stability bar, command latency, and the NAME of the peer a stall is waiting for.
;
; It draws ONLY in a live lockstep match (session mode 3, transport started, >= 1 peer), so a
; single-player game never sees it. It is render-only and reads nothing the sim depends on.
; -------------------------------------------------------------------------------------------------
[hud]
net_indicator=1           ; L1. 1 = draw the indicator during a network match. ON by default: a
                          ;     connection readout nobody switches on is a readout nobody has when
                          ;     the connection goes wrong, and the mode it appears in cannot be
                          ;     entered by accident. 0 = never draw and never log.
; L1d: LEAVE UNSET for the default. Unset, the position is computed by
;     GEOMETRY every drawn frame -- right-aligned in the map viewport's
;     top-right corner (WindowWidth/WindowHeight minus the right side
;     panel, i.e. G_WIN_W), clear of BOTH the in-game chat/alert line retail
;     draws at the frame's top-left (rows ~8..24) and the right HUD panel --
;     and it is then correct at any resolution, not just the one it was
;     tuned on. SET this key (as here, "x,y" in pixels, top-left corner) to
;     override the geometry and pin an exact position instead; 8,44 was the
;     STOPGAP this replaced (below the chat line at the frame's own
;     top-left) and still works as an explicit choice if you want it back.
;net_indicator_xy=8,44
net_indicator_font=0      ; game font slot. 0 = FONTY08, the small in-game HUD face; 1-6 are the
                          ;     menu faces. Out of range falls back to 0.
; RGB565, hex. ffff = white.
net_indicator_color=ffff
net_indicator_key=Ctrl+Alt+N
                          ; show/hide toggle, or `none` for no hotkey. Grammar is deliberately small:
                          ;     [Ctrl+][Alt+][Shift+] then one letter, digit or F1-F12. HIDING DOES
                          ;     NOT STOP THE MEASUREMENT -- the log lines keep coming, so a player who
                          ;     turned the display off still has the evidence in a bug report.
net_indicator_log=1       ; 1 = write `; [netind]` lines to mh_net.log: one sample per peer per 2 s
                          ;     (srtt/ipdv/loss/bar + the command-latency terms), one line per stall
                          ;     episode naming the peer, and one line the first time the indicator is
                          ;     really on a drawn frame. They are emitted IN A MATCH, i.e. after the
                          ;     arm window the arm-order gate diffs. tools/check_net_indicator.py
                          ;     reads them; 0 = draw silently.
                          ;
                          ;     WHAT THE BAR MEANS, since it is the one element that is not a number:
                          ;     [####] steady / [###.] slightly uneven / [##..] noticeably uneven /
                          ;     [#...] bursty / [....] nothing measured this link. It is derived from
                          ;     IPDV (delay variation) and LOSS, NOT from the ping, on purpose: a
                          ;     high but STEADY delay plays far better than a lower one that varies,
                          ;     so a link can have a calm ping and still feel bad. A 200 ms path with
                          ;     no jitter and no loss is a FULL bar and a large CMD number, and that
                          ;     is the correct reading of it.

; -------------------------------------------------------------------------------------------------
; [fonts] -- mp:F2: the glyph-table bounds guard, and a render probe for testing it.
; -------------------------------------------------------------------------------------------------
[fonts]
glyph_guard=1             ; F2. 1 = substitute a box for a code unit the current font has no glyph
                          ;     for, instead of whatever the raw lookup would have produced.
                          ;     llm_gfx_font_layout_text does glyph_ptr[charmap[code_unit]] with
                          ;     neither index checked, and the two charmaps are NOT the same size:
                          ;     the menu fonts' (slots 1-6) is the full 65536 entries, but the HUD
                          ;     font's (slot 0, FONTY08) is 257, so a code unit >= 257 drawn in that
                          ;     font reads past the array and uses the integer it finds as a glyph
                          ;     index. THE BOUNDS CLAMP IS UNCONDITIONAL AND THIS KEY DOES NOT TURN
                          ;     IT OFF -- an A/B switch that re-enables a wild pointer read is not an
                          ;     observation mode. 0 disables only the SUBSTITUTION, so an unmapped
                          ;     code unit renders retail's blank cell again (which is also how the
                          ;     game draws a space: U+0020 is in no FONTLAY, and glyph index 0 is a
                          ;     blank one-em scratch buffer). Substitute order: U+FFFD (the box that
                          ;     `python src/formats/fnt.py merge` adds), then U+00A4, then '?'.
                          ;     See src/mh_dll/mh/include/mh_fontguard_export.h.
; TEST AFFORDANCE, empty = off. Draws this string once per present through
;     the game's OWN text path (llm_gfx_draw_text_blend_clipped), which is
;     the only way to get an arbitrary UTF-16 code point onto a frame: the
;     typed path folds through ToAscii/CP_ACP (mp:F3) and setup.dat is
;     byte-transparent, so both can only deliver 8-bit values. WRITE
;     NON-ASCII AS \u4E00 ESCAPES, not raw UTF-8 -- tools/ui_test.py
;     re-emits an --extra-ini fragment through Python's default text
;     encoding and a literal non-ANSI character raises there, before the
;     game starts. \\u is not special; \u is unescaped by the seam.
;     (String value -- an empty value must stay EMPTY. Until 2026-09-20 this comment sat on the
;     key's own line, and a STOCK ini drew the comment text on every present, because Win32
;     returned it as the value. The reader now trims a trailing `;` comment and says so in
;     mh_net.log, and tools/lint_ini_string_keys.py fails any string key carrying one.)
probe_text=
; where to draw it, in pixels.
probe_xy=16,16
probe_font=4              ; font slot: 0=FONTY08, 1/2=PFMENU0, 3=PFMENU1, 4=PFMENU2, 5=PFMENU3,
                          ;     6=PFMENU4. 4 is the menu face the UI scenario uses.
; packed RGB565, hex.
probe_color=ffff

; -------------------------------------------------------------------------------------------------
; [pause] -- D19: a hotkey for the orphaned big-map screen (game mode 5).
; -------------------------------------------------------------------------------------------------
[pause]
key=0x0f                  ; PC set-1 scancode that enters mode 5 from the live strategic view.
                          ;     Default 0x0f = Tab. 0 = unbound (the game behaves exactly as it
                          ;     shipped). mh.exe contains a COMPLETE mode-5 screen -- the strategic
                          ;     view rendered without llm_strat_sim_tick, frozen, panning wrapped
                          ;     cylindrically mod general.big_width/height -- that nothing in the
                          ;     retail binary ever selects (no store of 5 into _G_LLM_GAME_MODE
                          ;     exists in EN or RU; the game-mode notes "Mode 5"). Its EXIT already
                          ;     works, so this supplies only the missing entry.
                          ;     The bound key is REMOVED from the game's key ring, so it cannot also
                          ;     fire a stock hotkey; press any key / mouse button to come back.
                          ;     Two hard gates: only from GAME_MODE 2, and never in a lockstep match
                          ;     (freezing the sim would stall the peer). See
                          ;     src/mh_dll/mh/include/mh_pause_export.h.

; -------------------------------------------------------------------------------------------------
; [desync] -- D21: RUNTIME desync detection. Detect and REPORT; never remediate.
;
; The state hash has always been an OFFLINE oracle: each peer logs per-step hashes and
; tools/mp_analyze.py joins two peers' logs afterwards. Nothing compared them while the match ran,
; so on 2026-08-29 an internet game that was desynced from STEP 1 played for eight minutes with
; neither peer saying a word. This exchanges the state-only hash between peers, keyed by sim step,
; and says so when they disagree. It does NOT end the match, force a resync, or change any sim
; behaviour: the existing resync path re-aligns the HORIZON and cannot transfer state, so it cannot
; repair a diverged sim, and a false positive that kills a healthy game is worse than the bug.
; -------------------------------------------------------------------------------------------------
[desync]
enabled=1                 ; 1 = exchange and compare (the ship default -- "log + notify" is only true
                          ;     of a detector that runs). 0 = nothing installs and nothing is sent.
every=50                  ; sample cadence, in SIM STEPS. CHOSEN FROM A MEASUREMENT, not a guess: the
                          ;     `; [desync] COST PROBE` line in mh_net.log times one walk of the
                          ;     56-region, 2.79 MB manifest at arm time, and the two rig peers read
                          ;     4.34 ms and 5.42 ms. So every=1 would spend ~25% of a 20 ms sim step;
                          ;     50 costs ~98 us amortised (~0.5%) with one ~4.9 ms spike per second.
                          ;     DETECTION LATENCY is at most `every` steps (~1 s) plus one link RTT.
                          ;     A run with the determinism harness armed pays NOTHING extra -- the
                          ;     harness already hashes every step for mh_harness.log and this reuses
                          ;     that value, which is also why the two numbers are identical.
action=0                  ; 0 = log + one on-screen notice, and NOTHING else. This is all D21
                          ;     delivers. A non-zero value is read, REPORTED as unimplemented, and
                          ;     ignored -- halting or aborting to the menu changes what the game
                          ;     does, so it has to go through the reimpl_fixes / migrated_fix_knobs
                          ;     discipline rather than ride a diagnostic key.
verbose=0                 ; 1 = also log every AGREEING comparison. Off by default: a clean 20-minute
                          ;     match would write ~1200 lines saying nothing happened. The periodic
                          ;     `; [desync] STATUS:` rollup is what proves a clean run was looked at.
snapshot=1                ; 1 = a detected mismatch ARMS this peer, and it then dumps the FULL region
                          ;     set (each region's VERDICT byte stream -- the exact preimage of the
                          ;     compared hashes) to mh_desync_snap_<step>.bin on an ABSOLUTE step
                          ;     grid of 8 x `every` (400 steps at the defaults). The grid is what
                          ;     makes the files diffable ACROSS peers: two peers notice at different
                          ;     moments, so anything scheduled relative to "when I noticed" lands on
                          ;     two different instants and names nothing. The diff then gives the
                          ;     diverging OFFSETS, which the hashes never can (D25: a hash says
                          ;     WHICH region, never WHERE). ~2.7 MB per dump; written only after a
                          ;     desync was detected, so a clean match writes nothing.
                          ;     Diff with tools/mp_desync_snap_diff.py.
snapshot_max=3            ; how many dumps one match may write before it stops (per peer).

; -------------------------------------------------------------------------------------------------
; [patch] -- apply an mhpatch manifest to the LOADED image instead of to the exe on disk.
;
; DEFAULT OFF. The fork's supplementary ruling (the fork plan) moves the src/patcher manifests
; in-DLL: they compile into mh.dll and apply at DllMain, with VirtualAlloc replacing the appended
; section cave, so the distribution becomes a stock retail exe. F1E was the one-manifest spike;
; since fork F4C-GATE the compile list is DERIVED from each manifest's own `class` field (ruling Q7)
; and mh.dll carries the three EN caphike/relocate manifests -- the limit raises, which are the
; things that cannot simply be reimplemented. The manifests whose behaviour already ships as DLL
; code (no_cd, run_without_focus and their siblings) are class `reimplemented` and do NOT compile in.
;
; INDEPENDENT OF `[net] enable` since fork F3B/F3G: the applier arms from MH_Core_Arm (after the
; promotion registry, before every byte patch and detour -- G68), so a static patch is not a
; networking question and `enable=0` no longer makes `inmem=1` silently inert. The rig fragment that
; turns it on for a booting lane is tools/uiscripts/ini/inmem_patch.ini, which also records what the
; armed run costs the arm log.
;
; IT INTERACTS WITH `[config] mode`, AND THAT IS MEASURED RATHER THAN A CAVEAT (fork F4C-GATE): the
; caphike/relocate family patches bodies this build PROMOTES, so under the default `brokered`
; configuration the C1 interlock REFUSES the manifest by name -- correctly, since those bytes never
; execute. `[config] mode=original` is where a compiled-in manifest actually applies today.
; docs/inmem-patching.md has the numbers and the open question that follows from them.
; -------------------------------------------------------------------------------------------------
[patch]
inmem=0                   ; 1 = apply the manifest named below to this process's image. The applier
                          ;     is all-or-nothing: a site whose expected original bytes have moved
                          ;     (an exe that already carries the static patch, or another build), a
                          ;     site inside a body this run PROMOTED, or a cave that cannot be
                          ;     placed, leaves the image untouched and says which.
; WHICH compiled-in manifest. They are ALTERNATIVES, not a batch -- each bakes its cave at the
; image's next-free VA and their site sets nest -- so there is no default: with this empty and
; more than one compiled in, the applier refuses and LISTS them in mh_net.log.
;     Today: grand_all_caphike_storagecap_EN (the full 7,770-site limit raise),
;     projectile_pool_caphike_EN (the projectile pool alone), projectile_pool_relocate_EN (that
;     pool moved at unchanged size -- a behavioural no-op, and the parity gate's subject).
; (String value; an empty value must stay EMPTY, by convention -- TL-HARN4 (2026-09-21) now trims a
; same-line comment before it would BE the value.)
manifest=
; path for the parity dump: every extent the applier wrote, READ BACK from the live image.
; tools/check_inmem_patch_parity.py compares it against mhpatch.py's file from the same manifest.
dump=
dump_exit=0               ; 1 = terminate right after the dump. The headless parity run: the only
                          ;     thing that process was started for is the state of its own image
                          ;     one instruction after the apply.


; -------------------------------------------------------------------------------------------------
; [input] -- mouse conditioning for an INTERACTIVE run (the VM-input notes, seams/ui_drive.cpp).
;
; ITS OWN SECTION, DELIBERATELY, and fork F2G re-ratified that (ruling Q5) while merging everything
; else. These keys apply to a run where [uitest] is OFF: a human (or a recording session) driving the
; game inside a hypervisor, whose absolute pointer the DirectInput path turns into unplayable
; ballistic garbage. Folding them into [uitest] would couple them to the automation flag and make
; them unreachable in the one case they exist for. All three default to 0 = touch nothing, so no
; existing run moves.
; -------------------------------------------------------------------------------------------------
[input]
mouse_absolute=0          ; 1 = drop the DirectInput mouse device so the wndproc tap falls through to
                          ;     its ABSOLUTE client-coordinate arm. For a VM/hypervisor guest, whose
                          ;     synthesised relative counts trip the DI path's 2x ballistic boost and
                          ;     slam the cursor into the clamp. Reproduces on stock retail.
                          ;     Automated runs leave this 0: they inject into the event ring directly
                          ;     and never touch either path.
mouse_div=0               ; DirectInput attenuation divisor. 0 = leave the shipped value (1, i.e. no
                          ;     attenuation) alone -- and that is not merely a convention here: it is
                          ;     a SIGNED IDIV divisor, so writing a real 0 would fault the game.
mouse_accel=0             ; DirectInput acceleration threshold; |delta| past it is DOUBLED. 0 = leave
                          ;     the shipped value (100) alone.
mouse_trace=0             ; 1 = per-present mouse ring + camera-latch telemetry into mh_mtrace.log, which
                          ;     FOLLOWS THE MATCH (the session folder while a match is open, the process
                          ;     folder otherwise) and also carries focus / DI-keyboard transitions.
                          ;     With [uitest] enable=1 the rows are ALSO written to mh_uidrive.log (the
                          ;     rig's cam-trace checker reads them there). Diagnostic only. Not
                          ;     size-capped: each match's file is written whole (the bug-report
                          ;     packager budgets the compressed zip instead).
; mp:F3. The codepage that decides WHICH CHARACTER a typed byte denotes --
;     in the menu/lobby text fields, in the in-game chat, and in the
;     ANSI->UTF-16 widen every piece of game text is drawn through.
;     `acp` (the default) = GetACP(), i.e. exactly retail behaviour: the
;     ambient process codepage, whatever this machine happens to be
;     localised to. A NUMBER pins it -- 1251 Cyrillic, 1250 Polish/Central
;     European, 1252 Western.
;     WHY PINNING IS NEEDED AT ALL: the game translated keystrokes with
;     ToAscii, which converts the keyboard layout's UTF-16 result through
;     the PROCESS codepage and not the layout's -- so a Russian layout on a
;     CP1252 box stored '?' for every Cyrillic letter (measured: ToAsciiEx
;     under the layout returned 0xCF where ToAscii returned 0x3F). The seam
;     resolves the character from the ACTIVE LAYOUT and encodes it with the
;     codepage named here. The in-game chat additionally had no codec at
;     all: it drained raw scancodes through a hardcoded US-QWERTY switch.
;     AND IT IS A SESSION PROPERTY, NOT A MACHINE ONE -- THE HOST'S. The
;     value is advertised in SESSION_INFO, and since mp:F3c a JOINER ADOPTS
;     the host's value for the length of the session (mh_net.log: "adopted
;     the host's input codepage N") and gets its own back when the session
;     ends. Two machines localised differently therefore play together with
;     no ini edit on either; the host's codepage decides what a byte means
;     for everyone in that match, and the joiner's typed characters that the
;     host's codepage cannot represent fall back to the game's own key table
;     (counted, never silently '?'). A host still REFUSES a joiner whose
;     codepage differs -- that now only happens when the joiner declared it
;     will not switch (`codepage_adopt=0` below) or Windows there has no
;     such codepage installed -- and the refusal REACHES the joiner: it is
;     bounced back to the browser with "Refused: codepage <host>/<yours>".
;     STORING A CHARACTER AND DRAWING IT ARE DIFFERENT QUESTIONS, and this
;     key answers only the first. The stock English fonts carry no Cyrillic
;     glyph at all, so a correctly stored Cyrillic line still renders as
;     [fonts] glyph_guard's substitute until the glyphs are merged into the
;     local font files (`python src/formats/fnt.py merge` + `... install`).
codepage=acp
codepage_adopt=1          ; mp:F3c. 1 (default) = when joining, adopt the host's codepage for the
                          ;     session (see above). 0 = keep the value pinned here whatever the host
                          ;     advertises; a host with a different codepage then refuses this peer,
                          ;     by name, on its screen. Nothing on the host reads this key.
cheat_gate=1              ; mp:CH1. 1 (default) = in a NETWORK game the hidden single-player cheat
                          ;     console (Shift+Enter on the same text line the chat uses; the 47-entry
                          ;     obfuscated command table of the retail build) REFUSES any command except
                          ;     `_NETDELAY` (the read-only delay/ping print): the line is dropped, the
                          ;     refusal is logged (mh_net.log "; CH1: cheat '<cmd>' (idx 0x..) refused
                          ;     in a network game") and the player sees "cheats are single player".
                          ;     Retail runs the cheat: the order cheats (`_NUCLEAR BOMB` kills every
                          ;     unit and building of one other player per line) go out on the lockstep
                          ;     order stream to every peer, the local ones (`_SPY`, `_NETDELAY UP/DOWN/
                          ;     SYNC`) diverge this peer alone. 0 = retail behaviour -- THE
                          ;     REPRODUCTION ARM of the ch1_cheat scenario, nothing else.


; -------------------------------------------------------------------------------------------------
; [compat] -- host-environment bug fixes that are not about the game's own logic.
; -------------------------------------------------------------------------------------------------
[compat]
devchange_guard=1         ; U21. 1 = ignore a WM_DEVICECHANGE with a NULL lParam instead of following
                          ;     it. ON by default because it is a strict bug fix -- a message with no
                          ;     header describes no volume, so the original had nothing to do with it
                          ;     either -- and the crash it prevents kills the process silently on a
                          ;     box with Windows Error Reporting off.
devchange_probe_ms=0      ; >0 = post ONE malformed broadcast to our own window that many ms after
                          ;     init. THE REPRODUCTION: with devchange_guard=0 it crashes on demand,
                          ;     which is how the guard was shown to guard something.


; -------------------------------------------------------------------------------------------------
; [tombstone] -- trap the dead remainder of a promoted body (hook/tomb_install).
;
; When a translated body is installed over an original, the original's code is still in the image and
; still reachable by any call site the promotion did not redirect. A tombstone JMPs those entries to a
; trap that terminates the run and names the function, so "nothing calls this any more" is proven by
; the process rather than asserted by a reader.
; -------------------------------------------------------------------------------------------------
[tombstone]
enable=1                  ; 1 = arm the PROMOTED-body remainder (the airtight claim: the entry is
                          ;     provably jumped away from). Ships on.
arm_dead=0                ; 1 = ALSO arm the migration ledger's `dead` set. An AUDIT arm, off by
                          ;     default, because `dead` means "unreached within THAT domain's measured
                          ;     closure", not "never executes": arming it by default terminated four
                          ;     single-player strategic scenarios on bodies that really do run.
; comma-separated function names to tombstone regardless of the sets above -- the NEGATIVE arm
; (a trap that has never fired proves nothing). String values: keep both lines below bare, by
; convention -- a same-line comment used to be read as part of the name list; TL-HARN4
; (2026-09-21) routed both through mh::config::read_ini_string, which trims one first.
force_arm=
; the same sweep addressed BY DOMAIN ("sim,tact"). The by-name list is parsed through a bounded
; buffer and one domain's names run to kilobytes, so a hand-written sweep would truncate and
; report itself armed over a fraction of what you asked for.
force_arm_domain=


; -------------------------------------------------------------------------------------------------
; [save] -- the in-call A/B oracle for the save-block walkers. DIAGNOSTIC, inert at ship.
;
; Inert BY CONSTRUCTION, not by default value: every key here is read INSIDE an install that
; mh::config::save_walkers_ours() already gated, and that gate is false in every configuration today
; (the save closure is not ours yet -- see mh/config/config.h kSaveClosureOwned). These are the
; instrument that would earn that closure its evidence.
; -------------------------------------------------------------------------------------------------
[save]
verify=0                  ; 1 = install through a trampoline so the ORIGINAL walker stays callable,
                          ;     run both, and compare. One verify level for the whole save side: a run
                          ;     is either verifying or it is not.
verify_poke=0             ; THE MUTATION for the save half -- a byte offset to corrupt so the compare
                          ;     MUST go red. A comparison that has never been driven red is not
                          ;     evidence that it could be.
load_verify_poke=0        ; the same mutation for the load half.
container_verify_poke=0   ; ...for the container save half.
container_load_verify_poke=0     ; ...for the container load half.
container_load_member_poke=0     ; ...for one member inside a loaded container.


; -------------------------------------------------------------------------------------------------
; [bisect] -- a build-gated diagnostic, kept out of [config] on purpose.
;
; It LOOKS like one of the per-key promotion ladders fork F2E deleted, and the difference is the line
; the drop was drawn along: those changed which bodies a SHIPPING run executed, behind the selector's
; back. This cannot change a shipping run at all -- outside MH_INTERNAL_EDGES_ENTRY_ROUTED (a build
; nothing ships) it is REFUSED BY NAME, loudly. So it survived as what it always was, a diagnostic,
; and moved into a section named for that.
; -------------------------------------------------------------------------------------------------
; -------------------------------------------------------------------------------------------------
; [st0] -- the ST0 sin/cos GOLDEN SWEEP (seams/reimpl_probe.cpp, LIB-REF-SPLIT).
;
; A MEASUREMENT, not a check: it calls the ORIGINAL sin/cos bodies in the game image at both x87
; precision settings and prints their raw bit patterns beside mh::crt's vendored ones, so
; tools/gen_st0_goldens.py can lift the offline fixture straight out of a rig log. Ships off; 96
; lines of noise on every launch would be the alternative.
;
; IT WAS `[harness] st0_goldens` UNTIL FORK F4E, and it moved because the harness became a separate
; DLL. This probe is mh.dll's (ruling Q3: the thirteen oracle seams stay, each self-gated on its own
; ini section), so a key named for another module would have meant nothing to the one it names. A
; surviving `[harness] st0_goldens=1` is REFUSED BY NAME rather than ignored -- that fragment is an
; author who believes a measurement will run, and the only other symptom would be gen_st0_goldens.py
; finding no sweep in a log nobody knew was wrong.
; -------------------------------------------------------------------------------------------------
[st0]
goldens=0                 ; 1 = run the sweep once at install time, before anything is patched (the
                          ;     arms must reach the ORIGINAL bodies). Output: `; [st0] ...` lines in
                          ;     mh_net.log, ending with `; [st0] SWEEP END`.

[bisect]
; comma-separated seam subset for an entry-routed bisect build. Refused with a named reason in any
; other build, rather than silently describing a configuration that is not the one running.
; (String value -- keep the line below bare, by convention; a same-line comment used to be read as
; part of the seam list and REFUSE the whole diagnostic run. TL-HARN4 (2026-09-21) routed this
; through mh::config::read_ini_string, which trims one first.)
lockstep_seams=


; -------------------------------------------------------------------------------------------------
; [harness] -- the determinism & replay harness (the replay-harness notes).
;
; MERGED IN AT FORK F2G. This was mh_harness.example.ini / mh_harness.ini, a SEPARATE file, and two
; things about that separation had bitten us:
;
;   1. The DLL read [harness] from that file ONLY. A [harness] block placed in mh_net.ini was
;      silently ignored -- which is exactly how an "800-step" determinism gate ended up comparing
;      200 steps (2026-07-25). That half is now impossible: this IS the file.
;   2. The harness armed off the file's mere EXISTENCE. There was no enable key. A configuration
;      written in the filesystem cannot be read out of the config file, and a stale copy on a test
;      machine decided the real stop_step of somebody else's run. `enable` below replaces it, and a
;      surviving mh_harness.ini beside the exe is REFUSED rather than ignored.
;
; Every value below is the DLL's own default (harness.cpp `struct Config`), so a block containing only
; `enable=1` behaves like a plain armed harness. Output: mh_harness.log in the run log dir, consumed
; by tools/mp_analyze.py. Omit the section entirely (the shipping case) and none of this installs.
;
; Docs: the replay-harness notes . src/mh_dll/README.md ("The gate")
; -------------------------------------------------------------------------------------------------
[harness]
enable=0                  ; THE ARM, and the only one. 1 = install the sim/console trampolines and
                          ;     hash every step. 0, or an absent key, or an absent section = the
                          ;     harness does not install at all, which is what every ordinary run and
                          ;     every shipping install wants. Nothing else in this section is read
                          ;     when it is 0.

; --- run bounds ------------------------------------------------------------------------------------
stop_step=0               ; step at which to write the final report. 0 = RUN FOREVER. The determinism
                          ;     runner sets this from --steps; if it reads back different in the log
                          ;     banner than you asked for, a stale file is winning.
exit_on_stop=0            ; 1 = ExitProcess once the final report is written.

; --- determinism pinning ---------------------------------------------------------------------------
fixed_step=1              ; 1 = pin TOTAL_GAME_TIME = GAME_CLOCK + interval each sim_tick, so replay
                          ;     does not inherit wall-clock jitter.
pin_fpu=1                 ; 1 = pin the x87 control word (round-nearest, 53-bit) at init. Without this
                          ;     two machines can diverge purely on FP rounding mode.

; --- seed blob (cross-machine reproduction) ----------------------------------------------------------
seed_step=1               ; step at which to dump/inject mh_harness_seed.bin. 0 = never.
seed_mode=0               ; 0 = dump the seed at seed_step, 1 = inject it, 2 = off.
                          ;     MP runs use 2 in spirit via the runner's seed_mode=2 -> both peers
                          ;     reseed identically at sim step 0, so any divergence is a REAL desync.

; --- state hashing ----------------------------------------------------------------------------------
region_hash_step=0        ; emit a per-region "R <step> <h0>..<hN>" line every N steps. 0 = off.
                          ;     Set 1 for any MP run where a desync might appear: it lets
                          ;     mp_analyze.py pinpoint the exact (step, region) WITHOUT a re-run.
                          ;     Note rng_state and the ai_econ regions are deliberately EXCLUDED from
                          ;     the state-only verdict (proven non-durable drift) -- they still show
                          ;     in the per-region lines.
domain_hash_step=0        ; mp:X3 -- emit a per-SUB-DOMAIN "RD <step> units=.. buildings=.. .." line
                          ;     every N steps. 0 = off; 1 is the setting it was built for.
                          ;     THE COMPLEMENT OF region_hash_step, NOT A DUPLICATE. The R row is 61
                          ;     columns and over a kilobyte, so it is sampled; the RD row is nine
                          ;     folds (~260 B) over each domain's UNEXCLUDED members and is
                          ;     affordable every step. R is fine in space and coarse in time; RD is
                          ;     the other way round, so the pair says WHICH subsystem and on exactly
                          ;     WHICH step -- neither answers that alone. The partition itself is
                          ;     printed once as "; [subdomain]" lines and mp_analyze reads it from
                          ;     there rather than holding a second copy of it.

; --- live world snapshots (mp:X1b / mp:X3) -----------------------------------------------------------
snapshot_at=0             ; SENDER: capture the world at this sim step and hand it to
                          ;     MH_Net_SnapshotSend. 0 = never. Host-only in every registered
                          ;     scenario -- two peers each pushing 8 MB at the other tests nothing.
snapshot_to=1             ; which player id the capture is sent to (the host's client is 1).
snapshot_import=1         ; RECEIVER, and SYMMETRIC on purpose: a peer nothing is sent to polls an
                          ;     empty lane, gets MH_SNAP_IDLE and allocates nothing, so arming it on
                          ;     both peers costs one call per step and saves a second knob.
snapshot_log=0            ; log a "; SNAPSHOT RX" progress line every N steps while a transfer is in
                          ;     flight. 0 = off. A 30-60 s transfer is otherwise silent, and a silent
                          ;     minute is indistinguishable from a stalled one.
snapshot_hold=0           ; mp:X3 -- 1 = FREEZE THE SIM on a successful import: the importing step's
                          ;     own body is skipped and the clock is pinned, so no further step is
                          ;     funded, while the frame loop, the renderer and the transport keep
                          ;     running. It is the instrument that separated X1b's two candidate
                          ;     causes for the post-import fault, and the answer was that the peer
                          ;     dies with the sim held -- i.e. NOT the rewind. Note a held peer's
                          ;     game clock stops, so a script must not wait on `gameclock` after it.

; --- order record / replay (Phase 2) -----------------------------------------------------------------
order_mode=0              ; 0 = off, 1 = RECORD dispatched orders -> mh_orders.bin,
                          ;     2 = REPLAY mh_orders.bin into the queue each step.
replay_ai_off=0           ; replay only: 1 = zero every player's ai_enabled once at start, so ONLY the
                          ;     recorded orders drive the sim (otherwise the deterministic AI re-issues
                          ;     its own and you get doubles).
replay_suppress_enqueue=0 ; replay only: 1 = neuter llm_strat_order_enqueue so the live order source
                          ;     cannot add to the queue, while the AI keeps running its non-order tick.
                          ;     The faithful-substitute test: AI-on record vs this should be identical.
match_segment=1           ; mp:SES7. 1 = while a MATCH is open, ALSO write that match's own copy of
                          ;     the recording into its session folder: mh_match_harness.log (this
                          ;     log's lines for the match), and with order_mode=1 mh_match_orders.bin,
                          ;     mh_match_clock.bin and mh_match_seed.bin (the seed taken at the match's
                          ;     first step) -- the replay inputs, renumbered to the match's own steps.
                          ;     The process-folder files above are unchanged. 0 = process files only.
                          ;     The match files are not size-capped: each is written whole.
                          ;     mp:SES7b: tools/replay_match_segment.py <match folder> replays them.
verdict_snap_every=0      ; mp:SES7b. N > 0 = at every step divisible by N, write the desync watch's
                          ;     full-state snapshot (mh_desync_snap_<step>.bin, the VERDICT stream
                          ;     tools/mp_desync_snap_diff.py reads) into the run folder, after the
                          ;     step's hash. A match replay arms it at the recorded snapshots' steps,
                          ;     so the two can be byte-diffed region by region. 0 = off.
verdict_snap_max=8        ; mp:SES7b. At most this many verdict_snap_every dumps per run.
order_log=0              ; 1 = dump the contents of ORDER_PENDING / ORDER_QUEUE as ";ord" lines each
                          ;     step they are non-empty. This is how the benign one-step
                          ;     `order_pending` cross-peer skew at match start was settled: identical
                          ;     orders at a one-step phase offset, not a divergence.
