  - name: shim_seq
    budget_s: 115
    budget_evidence: "measured 83 s, 83 s solo and 86 s with six rows concurrent (--jobs 6) on the local rig 2026-10-16 (shim_udp 30 s + p6_loser_gap 52 s); x 1.3 = 112, rounded to 115; the two rows it replaced were 33 s + 52 s with budgets 45 + 75"
    kind: multi
