    budget_s: 90  # gate diet: max measured (b2 64s, n2 67s, n6 69s) x 1.3
    kind: multi
    no_hash_why: 'P9 resync family: forced resyncs re-import the world; harness step numbering is not realigned'
    share_lanes: resync_storm_repro
    host: mp_host_p9_proof.txt
    clients: [mp_client_p9_proof.txt]
