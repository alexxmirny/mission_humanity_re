  - name: cam_latch
    # tooling:TL-SUITE-SPLICE-CAM -- replaces cam_edge_scroll + cam_key_hold (one boot, two probes).
    # budget_evidence: last-green suite times were 17.5s (cam_edge_scroll) + 15.0s (cam_key_hold) =
    # 32.5s; both scripts ran the SAME menu->lobby->launch walk plus near-identical unthrottled
    # in-game probe work (780 presents + a 2000ms gameclock wait each), so almost the whole measured
    # time was that one walk, paid twice. Subtracting one boot (~15s, the smaller of the two totals,
    # since probe time itself is a small unthrottled fraction) leaves ~17.5s; x1.3 margin ~= 23s,
    # FLOORED at 30 (BUDGET_FLOOR_S) -- so the floor decides regardless of the exact boot estimate.
    budget_s: 30
    budget_evidence: "sum 17.5s+15.0s minus one shared boot (~15s) x1.3 margin ~=23s, floored at 30"
    kind: solo
    script: cam_latch.txt
    # mp:SES3/SES3c: the only row with [input] mouse_trace=1 -- the only rows that assert anything
    # about the trace.
    extra_ini: tools/uiscripts/ini/cam_trace.ini
    # TWO named verdicts off the one run, split by the script's `log` boundary line (SPLICE-CAM):
    # segment 1 is the mouse-edge probe, segment 2 the keyboard-hold probe. --expect-pinned needs
    # --expect-rise-fall too, else a latch that's never cleared would pass.
    post_check: [
      [tools/check_cam_trace.py, --segment, '1', --boundary, 'cam_latch: probe2', --label,
        'edge latch', --expect-pinned, '3', --expect-rise-fall, --max-lines-per-frame, '1.0',
        --expect-di],
      [tools/check_cam_trace.py, --segment, '2', --boundary, 'cam_latch: probe2', --label,
        'key latch', --expect-held, L, --expect-held-min, '3', --max-lines-per-frame, '1.0'],
    ]
    desc: 'SES3+SES3c in one boot: mouse pinned at the left screen edge (edge latch: holds while the
      camera scrolls and the cursor does not move, clears on release), then LEFT arrow held via
      `keyhold` (key latch: CAM_SCROLL_LEFT_HELD tracks it the same way, clears on release)'
  - name: type_ascii
    # gate diet: max measured (gate 11s, n2 5s, n6 9s) x 1.3 = 15, FLOORED at 30 (BUDGET_FLOOR_S)
    budget_s: 30
    kind: solo
    script: type_ascii.txt
    tol: 0.0  # tol 0: text is ~0.1% of frame; a looser tol would hide the whole regression. (mp:F4)
    desc: 'F4: `type ho1` == `key 0x23 0x18 0x02` byte for byte; and shifted `type ABC`'
  - name: type_cyrillic
