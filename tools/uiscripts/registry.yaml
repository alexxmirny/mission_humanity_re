  # sim-rate row -- ONE MATCH PER STEP on the row's two lanes (multi_steps; see shim_seq). Replaced rows, in this order:
  #   resync_gate_proof              (mp:P9 b: gate ON, count_init OFF -- 0 barriers to gameclock 30 s)
