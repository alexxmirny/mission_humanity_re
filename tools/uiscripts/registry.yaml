    budget_evidence: "measured 58 s solo and 64 s with five rows concurrent (--jobs 4) on the local rig 2026-10-15; x 1.3 = 83, rounded to 85; the three rows it replaced summed ~152 s solo (their budgets 55+75+80)"
    kind: multi
