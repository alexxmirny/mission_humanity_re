    timeout_frames: 57600
    timeout: 480
    post_check: [tools/check_resync_storm.py, --expect, countinit, --min-fires, '2']
    post_check_peers: true
    post_check_session: true
    desc: 'P9 proof (c): the storm''s shape with the gate OFF and count_init ON -- threshold 200 from
      step 0, every barrier fires AT 200 (one per ~15 s, not per 2 s; the row ends on the second fire),
      desync watch IDENTICAL'
  # Drops the gameclock-6000 capture: under this storm's slow rate it's reached only after the match
  # ends. Real check is the receiver_deadline log line. (mp:P9W)
  - name: resync_receiver_deadline_proof
    budget_s: 95  # gate diet: max measured (b2 71s, gate 73s, n2 72s, n6 73s) x 1.3
    kind: multi
    no_hash_why: 'P9 resync family: forced resyncs re-import the world; harness step numbering is not realigned'
    share_lanes: resync_storm_repro
    host: mp_host_p9w_deadline.txt
    clients: [mp_client_p9w_deadline.txt]
    omit_satellite: [libmh.dll]
    # Client override 6000ms (host stays 60000) clears 2 barrier cycles so GS2 can't misfire on a
    # barrier's freeze; a tried 500ms did misfire.
    net_extra: transport=udp;resync_trigger_gate=0;resync_count_init=0;lockstep_step_ms=100;data_timeout_ms=60000
    net_extra_client: lockstep_step_ms=60;data_timeout_ms=6000
    shim: true
    shim_delay: 100
    # TL-P9W-TRIGGER: cut the link the instant the CLIENT itself samples RESYNC_IN_PROGRESS 0->1
    # (net.resync_barrier_begin is written on BOTH peers -- see log_formats.json), instead of
    # guessing a wall-clock offset that lands inside one ~97% of the time. The client is the
    # non-leader/receiver here (short data_timeout_ms override below), so this is the exact
    # leaderless-barrier condition the checker proves. p9w_deadline_repro.txt stays as the
    # fallback bound (its own never-firing is itself a finding).
    shim_triggers:
    - cmd: blackhole on
      when:
      - [c1, mh_net.log, '\[resync\] barrier #\d+ BEGIN']
    shim_timeline: tools/uiscripts/shim/p9w_deadline_repro.txt
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/desync_verbose.ini]
    timeout_frames: 21600
    timeout: 180
    post_check: [tools/check_resync_receiver_deadline.py]
    post_check_peers: true
    post_check_session: true
    desc: 'P9W: a leaderless barrier (blackhole gated on the CLIENT''s own barrier BEGIN, by
      construction) -- the CLIENT''s own receiver-side deadline (not the leader''s, not the
      transport watchdog) must have left the wait screen and removed the dead leader'
