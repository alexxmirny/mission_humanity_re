    post_check_peers: true
    desc: 'U40/RM1/U41b: a match ENDS, the host re-creates in the same instance, the client re-discovers + re-joins (no ghost slot); the SECOND match enters as clean as the first and stays in lockstep past 12 s; ending it too gives a second queue rollup with its own high-water'
  # map_xfer_twice (mp:X2j, 2026-10-19): the joiner downloads the map in TWO lobbies of ONE process. host_rematch's walk with
