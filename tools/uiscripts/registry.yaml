  # overlay_seq (tooling:TL-SUITE-FOLD step 8, user 2026-10-15): the overlay / renderer / font solo rows, one PROCESS per step on one
  # lane (solo_steps; each step is the old row with its own ini, script, tol and baseline label, so a red names its step).
  # Replaced rows: debug_overlay, gx1_overlay_residue, imgui_swallow, imgui_hover, win_resize, font_guard. They could not be one
  # process (a renderer / window / overlay ini cannot coexist with the next one's), and the first five already ran serially on
  # debug_overlay's lane via share_lanes -- the fold is the row count, plus one runner start and one lane setup instead of six.
  - name: overlay_seq
    budget_s: 55
    budget_evidence: "42 s solo, two green runs (2026-10-15) x1.3; the 6 replaced rows had 30 s floors each (180 s of budget)"
    kind: solo
    solo_steps:
      # P0 debug overlay: installed-hidden, Ctrl+Alt+D shows it on 2 screens, hides it again (the ONLY step that enables [debug]).
      # tol 0: the overlay is only ~0.8% of the frame, so the default 2% tol wouldn't catch it disappearing. Debug builds ship the
      # overlay hidden ([debug] overlay=0); the chord is synthesised since GetAsyncKeyState reads 0 headless.
      - name: debug_overlay
        script: debug_overlay.txt
        extra_ini: tools/uiscripts/ini/debug_overlay.ini
        tol: 0.0
      # mp:GX1: gfx_overlay.cpp leaves no residue when its box shrinks (page switch, same static screen). tol 1.0: not a real
      # pixel-diff gate -- the frame legitimately varies; the real assertion is the post_check (rect verified against real captures
      # to sit inside the WIDE page's title row and outside the NARROW page's box, excluding an unrelated background pixel).
      - name: gx1_overlay_residue
        script: gx1_overlay_residue.txt
        extra_ini: tools/uiscripts/ini/gx1_overlay_residue.ini
        tol: 1.0
        post_check: [tools/check_overlay_residue.py, --before, gx1_wide, --after, gx1_narrow, --rect, '52,10,55,9']
      # PT-GFX4 ImGui overlay (d3d11): a posted click under the open panel is swallowed (menu kept), the same click with it closed
      # reaches the game. PT-INPUT1: the ini pins [input] backend=system -- the suite's one step on the game's own dinput.dll.
      - name: imgui_swallow
        script: imgui_swallow.txt
        extra_ini: tools/uiscripts/ini/imgui_swallow.ini
      # PT-GFX6 ImGui hover follows the GAME cursor in a 1.5x-scaled d3d11 window (DI mouse live) and flips at the panel's drawn edge;
      # PT-INPUT1 owned DirectInput (absolute packets exact at both corners, relative carried, E0 keys released on focus loss, a click
      # withheld by the overlay's DI filter, a raw click activates NETWORK GAME). The ini pins [input] backend=own (the raw* verbs).
      - name: imgui_hover
        script: imgui_hover.txt
        extra_ini: tools/uiscripts/ini/imgui_hover.ini
      # PT-GFX3 resizable windowed mode: a player-style resize to 960x800 is kept, the frame scales into it, and a posted click at
      # NETWORK GAME's scaled position is mapped client -> game and activates it.
      - name: win_resize
        script: win_resize.txt
        extra_ini: tools/uiscripts/ini/win_resize.ini
      # F2: unmappable code points render a substitute glyph and do not crash the layout pass. The only step that arms [fonts]; guards
      # the OOB bug where unmapped code points read past the 257-entry charmap as a glyph-pointer index (mp:F2). tol 0.
      - name: font_guard
        script: font_guard.txt
        extra_ini: tools/uiscripts/ini/font_guard.ini
        tol: 0.0
    desc: 'overlay / renderer / font steps (one process each): P0 debug overlay, mp:GX1 overlay residue, PT-GFX4 ImGui click swallow, PT-GFX6/PT-INPUT1 ImGui hover + owned DirectInput, PT-GFX3 window resize, F2 font guard'
  # mp:GX1: net-indicator half (draws only in a live MP match); tol 1.0 since the colour-match
  # post_check is the assertion.
  - name: gx1_netind_residue
    budget_s: 60  # gate diet: max measured (gate 44s, n2 43s, n6 44s) x 1.3
    kind: multi
