    budget_s: 30
    kind: solo
    script: type_polish.txt
    extra_ini: tools/uiscripts/ini/input_cp1250.ini
    tol: 0.0  # Pins codepage 1250 (differs above 0x80): catches a silent ACP fallback. (mp:F3)
    desc: 'F3: `type` 4 Polish chars on the PL layout (AltGr) -- 4 CP1250 bytes stored'
  - name: font_guard
    budget_s: 30  # gate diet: max measured (gate 5s, n2 5s, n6 5s) x 1.3 = 10, FLOORED at 30 (BUDGET_FLOOR_S)
    kind: solo
    script: font_guard.txt
    extra_ini: tools/uiscripts/ini/font_guard.ini
    # Only test that arms [fonts]. Guards the OOB bug: unmapped code points used to read past
    # the 257-entry charmap as a glyph-pointer index. (mp:F2)
    tol: 0.0
    desc: 'F2: unmappable code points render a substitute glyph and do not crash the layout pass'
  - name: font_merged
    budget_s: 30  # gate diet: max measured (gate 5s, n2 5s, n6 5s) x 1.3 = 10, FLOORED at 30 (BUDGET_FLOOR_S)
    kind: solo
    script: font_merged.txt
    extra_ini: tools/uiscripts/ini/font_merged.ini
    # requires runs before provisioning; no merged install SKIPS by name, not fail/abort. (mp:F2b)
    requires: !ref font_merge_precondition
    # Lane uses its own font pack, not the shared polygon: font_guard's baseline needs it stock.
    lane_src: !ref FONT_MERGE_DIR
    tol: 0.0
    desc: 'F2b: with a merged install, Cyrillic + Polish probe text renders real glyphs (SKIPS by name
      without one)'
  - name: chat_glyphs
    budget_s: 45  # gate diet: max measured (gate 32s, n2 32s, n6 32s) x 1.3
    # transport=tcp pinned: [net] transport now defaults to udp; keeps this row's TCP coverage
    # TCP instead of becoming a second UDP run.
    net_extra: transport=tcp
    kind: multi
    host: mp_host_chat_glyphs.txt
    clients: [mp_client_chat_glyphs.txt]
    # End-to-end of F3 (codec) + F2b (font): neither alone proves a chat line draws Cyrillic. (mp:F3b)
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/input_cp1251.ini]
    # Reuses font_merge_precondition() -- same opt-in tier as font_merged, not a second precondition.
    requires: !ref font_merge_precondition
    # Lane uses its own font pack, not the shared polygon: font_guard's baseline needs it stock.
    lane_src: !ref FONT_MERGE_DIR
    tol: 0.0
    desc: 'F3b: with a merged install, a 2-peer Cyrillic chat line the host types renders as real glyphs
      on the client that receives it (SKIPS by name without one)'
  - name: tact_panel
    budget_s: 30  # gate diet: max measured (gate 5s, n2 5s, n6 5s) x 1.3 = 10, FLOORED at 30 (BUDGET_FLOOR_S)
    kind: solo
    script: tact_panel.txt
    # Only scenario rendering tactical: the HUD could stop drawing and the suite stay green.
    extra_ini: tools/uiscripts/ini/tact_panel.ini
    # Mission entry isn't reachable from a menu; driven via the DLL's --tactical verb over save 11.
    launch_args: --tactical 11
    deploy_save: '11'
    # tact_hash_step pins the tactical wall clock; without it the clock freezes in the wrong mode,
    # not jitters, so no tol would rescue an unpinned run either. Pinned gate only (ROOTS-LIVE).
    harness_extra: tact_hash_step=1;pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;pin_rand=1;rand_seed=12345
    tol: 0.0  # tol 0: the readout is ~0.1% of frame; the default 2% tol would let it vanish and still pass.
    desc: 'LIFT-TACT: tactical mission running -- selection panel + active-count HUD on a real frame'
  - name: boot_snapshot
    budget_s: 30  # gate diet: max measured (gate 5s, n2 6s, n6 5s) x 1.3 = 10, FLOORED at 30 (BUDGET_FLOOR_S)
    kind: solo
    script: boot_snapshot_capture.txt
    # Only catches the capture faulting/aborting (as a timeout); a silently wrong blob is caught
    # offline instead, by gen_boot_snapshot.py --check/--selftest.
    harness_extra: boot_snapshot=1
    desc: 'LIB-BOOT: the post-cfg snapshot capture path is armed and the process still reaches the menu'
  - name: net_hud
    budget_s: 65  # gate diet: max measured (b2 46s, n2 46s, n6 47s) x 1.3
    kind: multi
    no_hash_why: 'a deliberate s2c blackhole stalls the client (the stall under test); a link drop would read FAIL: ENVIRONMENTAL'
    host: mp_host_hud.txt
    clients: [mp_client_hud.txt]
    share_lanes: shim_udp  # Borrows shim_udp's lanes: a shim row can only share a shim row's lanes. (mp:P9)
    # transport=udp is load-bearing: TCP reports lat_supported=0, so a tcp run passes showing nothing.
    net_extra: transport=udp
    # Pins resolution: in-game frame size follows the persisted setup.dat preference.
    extra_ini: tools/uiscripts/ini/video_1024.ini
    # Runs through the shim on the clean-link half too (needed later for n1_stall); shim_delay:0 keeps
    # it a plain relay. (mp:TL-UISTALL)
    shim: true
    shim_delay: 0
    shim_timeline: tools/uiscripts/shim/net_hud_stall.txt
    # Blackholes s2c right after both captures log, instead of the timeline's looser t+300s guess.
    shim_triggers:
    - cmd: blackhole s2c
      when:
      - [host, mh_uidrive.log, 'LOG: HOST captured the net indicator']
      - [c1, mh_uidrive.log, 'LOG: CLIENT captured the net indicator']
    # _only rect covers the fixed label+bar at tol 0 (vanishing = FAIL). Digits are excluded (vary
    # every run) and asserted via post_check instead. Rect moved by L1d (right-aligned).
    tol: 0.0
    # post_check_peers checks both logs: only the client ever gets a -1 placeholder id. (mp:L1c)
    post_check: [tools/check_net_indicator.py, --reject-placeholder-name, --expect-stall]
    post_check_peers: true
    # Needs ~20s for the RFC 6298 estimator to print a ping; then waits the shim's 300s blackhole.
    timeout: 900
    desc: 'L1/L1c/L1d/TL-UISTALL: the player-visible connection indicator on a live 2-peer udp match --
      ping, stability bar, command latency, peer naming, and the WAITING FOR frame under a blackhole'
  - name: mp_snapshot
    budget_s: 140  # gate diet: max measured (rerun 107s) x 1.3
    long_why: 'opt-in X1b row: a live match captured at a sim step, moved over channel C and imported
      -- measured 107 s alone (2026-09-24)'
    kind: multi
    no_hash_why: 'its own post_check runs mp_analyze --snapshot-verify; snapshot_hold freezes the importer''s sim on purpose'
    host: mp_host_snapshot.txt
    clients: [mp_client_snapshot.txt]
    # udp is load-bearing: TCP answers snapshot rows 'unsupported', so a tcp run proves nothing.
    net_extra: transport=udp
    # In-game captures -> the display mode must be pinned (it is a persisted setup.dat setting).
    extra_ini: tools/uiscripts/ini/video_1024.ini
    # Both peers arm the receiver (cheap, avoids an asymmetric knob). snapshot_hold=1 stops the
    # client's sim at import time -- without it the client crashes within ~1 step. (mp:X3)
    harness_extra: snapshot_import=1;snapshot_log=200;region_hash_step=200;synth_move=0;snapshot_hold=1;domain_hash_step=1
    # Only the host captures/sends; both peers pushing 8MB at each other would test nothing.
    harness_extra_host: snapshot_at=120;snapshot_to=1
    # post_check needs both peers' logs (capture in one, import in the other, not either alone).
    post_check: [tools/mp_analyze.py, --snapshot-verify]
    post_check_peers: true
    # Opt-in: importer crashes ~1 step after import (rewinds world while turn engine feeds live
    # inputs). Tracked as mp:X3 (needs a resync, not a rewind). Delete optin when X3 lands.
    optin: true
    timeout: 420  # Transfer takes 30-60s at channel C's rate limit, so timeout must outlast it. (mp:X1)
    timeout_frames: 200000
    desc: 'mp:X1b: the host captures a live world at a sim step, channel C moves it to the client, and
      the client imports it -- every per-region hash identical, rng_state included'
  # Three starting states (no map / wrong-named file / already has it) need three scenarios.
  # transport=udp is load-bearing (channel C); TCP would prove nothing. Knob lives in the DLL,
  # not a real file move: peers share one Maps symlink. (mp:X2)
  - name: map_absent
    budget_s: 35  # gate diet: max measured (gate 25s, n2 26s, n6 26s) x 1.3
    kind: multi
    host: mp_host_map.txt
    clients: [mp_client_map.txt]
    net_extra: transport=udp;map_test_pretend=none
    extra_ini: tools/uiscripts/ini/video_1024.ini
    # expect-gate is the non-vacuity check: a host that never claimed/downloaded/refused still passes.
    post_check: [tools/check_map_transfer.py, --expect-gate]
    post_check_peers: true
    timeout: 300  # Transfer is seconds, but timeout must also cover the host's wait on enabled Start.
    desc: 'X2: the client does NOT have the host''s map -- Start is HELD, the map crosses channel C, and
      both peers enter the match'
  - name: map_conflict
    budget_s: 35  # gate diet: max measured (gate 26s, n2 26s, n6 26s) x 1.3
    kind: multi
    host: mp_host_map.txt
    clients: [mp_client_map.txt]
    # Same-name-wrong-bytes case: before X2 this silently desynced with nothing naming the cause.
    net_extra: transport=udp;map_test_pretend=other
    extra_ini: tools/uiscripts/ini/video_1024.ini
    post_check: [tools/check_map_transfer.py, --expect-gate]
    post_check_peers: true
    timeout: 300
    desc: 'X2: the client holds a DIFFERENT file of the same name -- it receives the host''s content,
      plays, and its own file is byte-unchanged afterwards'
  - name: map_have
    budget_s: 40  # gate diet: max measured (gate 29s, n2 28s, n6 29s) x 1.3
    kind: multi
    # Uses the ordinary scripts on purpose: a peer already holding the map plays exactly as before X2.
    host: mp_host_start.txt
    clients: [mp_client_start.txt]
    net_extra: transport=udp
    extra_ini: tools/uiscripts/ini/video_1024.ini
    # expect-nothing is only accepted alongside the positive 'holds the map' line, never alone.
    post_check: [tools/check_map_transfer.py, --expect-nothing]
    post_check_peers: true
    desc: 'X2: a joiner that already holds the map content transfers NOTHING and the host''s Start is
      never held'
  # mp:X2b: same decision over TCP (no channel C). Shares a sibling's lanes at the 81/81 ceiling.
  - name: map_refuse_tcp
    budget_s: 60  # gate diet: max measured (gate 43s, n2 19s, n6 19s) x 1.3
    kind: multi
    no_hash_why: 'lobby-only: Start is refused (map mismatch over TCP), no match runs'
    host: mp_host_map_refuse.txt
    clients: [mp_client_map_refuse.txt]
    # Not map_conflict's lanes: its client stores the map in mh_dl\, resolving and passing wrongly.
    # tooling:TL-SUITE-FOLD-ML: was match_launch, folded into shim_udp (removed from TESTS);
    # re-anchored to host_clicks (same 2-peer topology).
    share_lanes: host_clicks
    # Refusal is enforced in on_begin_map_load, not the greyed-out look alone (dead-ends G291).
    net_extra: transport=tcp;map_test_pretend=other
    extra_ini: tools/uiscripts/ini/video_1024.ini
    post_check: [tools/check_map_transfer.py, --expect-refused]
    post_check_peers: true
    desc: 'X2b: over TCP a joiner holding a DIFFERENT copy of the map is refused at Start, by name --
      a refusal instead of a desync'
  - name: map_have_tcp
    budget_s: 40  # gate diet: max measured (gate 29s, n2 28s, n6 29s) x 1.3
    kind: multi
    # Negative case: a TCP pair with the matching map must start unchanged, no refusal.
    # NEVER --update-baselines this row: it shares shim_udp's (mp_host_start/mp_client_start) baselines.
    host: mp_host_start.txt
    clients: [mp_client_start.txt]
    share_lanes: map_have
    net_extra: transport=tcp
    extra_ini: tools/uiscripts/ini/video_1024.ini
    post_check: [tools/check_map_transfer.py, --expect-nothing]
    post_check_peers: true
    desc: 'X2b: a TCP pair holding the same map starts normally -- the TCP claim refuses nobody and arms
      nothing'
  # Needs a UI-path scenario: mp_run's force-entry stops both peers at the host's step, leaving
  # the loser no frames past it to measure a gap over.
  - name: p6_loser_gap
    budget_s: 75  # budget_s 75 = ~54s measured wall x1.3 margin.
    kind: multi
    no_hash_why: 'ends by elimination under a host-only conquest workload; D26 truncation on this row is unproven (follow-up)'
    host: mp_host_p6_gap.txt
    clients: [mp_client_p6_gap.txt]
    # Lane pool is at its ceiling (81); a shim row can only share another shim row's lanes. (fork F4H)
    share_lanes: shim_udp
    # synth_move=0 required on every peer: the default D6 workload reorders the mothership and
    # overwrites the deploy, so conq=1 refuses to arm under synth_move=1.
    harness_extra: synth_move=0
    harness_extra_host: conq=1;conq_seed=1;conq_probe_every=50;synth_move=0
    # Shim required to see the freeze: unshimmed VM-to-VM peers are too close in wall-clock for
    # HB_ENDGAME_GRACE_MS to ever get exercised. 180ms matches the suite's validated shim delay.
    shim: true
    shim_delay: 180
    # Without ship_pacing, the rig's 30ms lookahead makes every step wait ~1 RTT through the shim.
    ship_pacing: true
    # Pins resolution: lane is shared with net_hud, which runs first and pins video_1024.
    extra_ini: tools/uiscripts/ini/video_640.ini
    # Captures mask the area around the outcome dialog: end step and mothership drift vary by run.
    timeout: 300
    timeout_frames: 200000
    # expect fixed asserts the measured ~0ms gap as a floor, well under the 500ms bound. (mp:P6)
    post_check: [tools/check_p6_gap.py, --expect, fixed]
    post_check_peers: true
    post_check_session: true
    desc: 'P6: the conquest workload plays a real host-win/client-loss match; post_check asserts the client''s
      (loser''s) longest present-to-present gap between the host''s own outcome and its own is < 500 ms
      -- measured 0 ms on this rig''s own conditions'
