      host: mp_host_start.txt
      clients: [mp_client_start.txt]
      # tooling:TL-SHIMUDP-C: needed because link_death's shim arms 'stall' (blackhole), which the udp shim refuses -- nothing else
      # covers the plain-delay path.
      net_extra: transport=udp
      # One-way delay (round-trip ~80ms): a plain latency value, comfortably clear of near-zero (bypass) and check_shim_rtt.py's 20ms floor.
      shim_delay: 40
      # Subject is the shim's plain-delay path, not the rig's pinned 30ms lookahead (which made every step wait ~1 RTT, 0.41-0.47x game/wall).
      ship_pacing: true
      extra_ini: tools/uiscripts/ini/video_1024.ini
      # Assertion is the post_check, not the pixels: a bypassed shim renders an identical frame; check_shim_rtt fails when srtt0_ms
      # reads near-zero. tooling:TL-SUITE-FOLD-ML: this step is the only one exercising the mp_host_start/mp_client_start reachability
      # walk, plus the shim + hash.
      post_check: [tools/check_shim_rtt.py]
