  # lobby_seq (tooling:TL-SUITE-FOLD step 4, user 2026-10-15): SIX lobby-only TCP rows in ONE host session. The host (mp_host_lobby.txt)
  # opens its lobby once and stays; six client processes join one after another, each with its own configuration, and the RUNNER ends
  # each one (the player quitting) before the next launches (`client_sequence`). Segments, in order, and the rows they replace:
  #   1 client_join      plain join + the Cancel negative (U23); default tol, no checker
  #   2 codepage_adopt   client pinned cp1251 against the cp1252 host; check_codepage_adopt --expect agree
  #   3 name_forged      the JOIN carries a forged non-Latin name; --expect forged
  #   4 codepage_refused a pre-MP-LANG (8-bit chat) client is refused AND told; --expect refused, tol 0
  #   5 build_refused    a forged release version is refused AND told; --expect build, tol 0
  #   6 ip_retry         dead IP -> corrected from the MRU in-session -> join (S8); the script now ends with a Cancel so it leaves
  # The host is pinned cp1252 for the whole session (what the two codepage rows had; the plain join segments are indifferent to it).
  # Each checker is handed the host + every client dir and judges ONE client (--client N) against only the host log lines written
  # during that client's process lifetime. Captures keep their old scripts' baselines (the same script label), so no frame moved.
  # Not folded: codepage_refused_ru (the RU pack would change every other segment's strings), leave_frees_slot and s7_occ_cap (folded
  # into lobby_host_seq in step 6, whose own host script walks them).
  - name: lobby_seq
    budget_s: 90
    budget_evidence: "measured 67 s solo on the local rig 2026-10-15 (four green runs, 67 s each) x 1.3 = 87, rounded to 90; the six rows it replaced summed ~145 s solo (19+20+19+41+20+25)"
    kind: multi
    no_hash_why: 'lobby-only: no match starts, so no sim step is hashed'
    net_extra: transport=tcp
    host: mp_host_lobby.txt
    clients: [mp_client_join.txt, mp_client_join.txt, mp_client_join.txt, mp_client_join_refused.txt, mp_client_build_refused.txt, mp_client_ipretry.txt]
    client_sequence: true
    extra_ini_host: tools/uiscripts/ini/input_cp1252.ini
    client_cfg:
      2: {extra_ini: tools/uiscripts/ini/input_cp1251.ini}
      3: {extra_ini: tools/uiscripts/ini/name_forged.ini}
      4: {extra_ini: tools/uiscripts/ini/input_cp1251_legacy.ini, tol: 0.0}
      # RL11: the client's JOIN states a forged release version ([net] test_build_version, TEST ONLY); the real-build host refuses it
      # by name and the joiner reads "Host runs X, you run 0.0.1: update". The host stays in its lobby.
      5: {net_extra: test_build_version=0.0.1, tol: 0.0}
      6: {dead_ip: true}
    client_dead_ip: !ref machine.DEAD_PEER_IP
    timeout: 300
    post_check: [
      [tools/check_codepage_adopt.py, --expect, agree, --client, '2'],
      [tools/check_codepage_adopt.py, --expect, forged, --client, '3'],
      [tools/check_codepage_adopt.py, --expect, refused, --client, '4'],
      [tools/check_codepage_adopt.py, --expect, build, --client, '5'],
    ]
    post_check_peers: true
    desc: 'lobby-only TCP joins in one host session, one client after another: plain join + Cancel, cp1251 client admitted, forged name normalized, old-codepage client refused AND told, wrong-build client refused AND told, dead IP corrected in-session'
