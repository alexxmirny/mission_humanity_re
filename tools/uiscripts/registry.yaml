  # link_death_seq (tooling:TL-SUITE-FOLD step 7, 2026-10-15): ONE TCP host session, two clients one after another (`client_sequence`), behind the
  # udp-less shim. Replaces
  #   link_death      (R-live: a lobby link stalled 8 s must NOT drop, then blackholed MUST drop -- client 1, shim delay 100 ms one-way)
  #   txdeath_ingame  (U19f/G270: an in-game transport death is retired by the fast-drop route -- client 2, delay 0, cut on a SIM moment)
  # Segment 1's trigger lifts the blackhole and drops the shim delay to 0 on the host's `link death segment done` marker, before client 2 is
  # launched; the cut that ends segment 2 is the LAST thing the row does. Captures keep their old baselines under `<old row>__<name>`.
  - name: link_death_seq
    budget_s: 270
    budget_evidence: "measured 208 s, 208 s, 209 s solo on the local rig 2026-10-15 (three green runs; the first of them a seeded-flip run's twin); x 1.3 = 270; the two rows it replaced summed ~214 s solo (link_death 91 s + txdeath_ingame 123 s; budgets 125 + 170) -- wall-neutral, the saving is one row, its two boots and two lane sets"
    long_why: "segment 1's timeline IS the proof (an 8 s stall that must NOT drop the link, then a blackhole at t+60 s that must, then the ~10 s rx watchdog) and segment 2 needs a live match to reach gameclock 45000 before the cut plus the fast-drop and the dialog: measured 208 s (2026-10-15)"
    # transport=tcp pinned: [net] transport now defaults to udp; keeps both old rows' TCP coverage TCP.
    net_extra: transport=tcp
    kind: multi
    no_hash_why: 'segment 1 is lobby-only (no match starts); segment 2 cuts the link mid-match on purpose (transport death under test)'
    host: mp_host_link_death_seq.txt
    clients: [mp_client_link_death_seq_a.txt, mp_client_link_death_seq_b.txt]
    client_sequence: true
    shim: true
    shim_delay: 100  # ONE-WAY -> 200 ms rtt, the conditions the R-live bug was reported at (segment 1); dropped to 0 for segment 2
    shim_timeline: tools/uiscripts/shim/link_death_seq.txt
    shim_triggers:
    # segment 1 -> 2: lift the blackhole, then drop the delay (client 2 is launched when client 1's script ends, a few seconds later)
    - cmd: blackhole off
      fast: true
      when:
      - [host, mh_uidrive.log, 'LOG: HOST link_death_seq: link death segment done']
    - cmd: set delay 0
      fast: true
      when:
      - [host, mh_uidrive.log, 'LOG: HOST link_death_seq: link death segment done']
    # segment 2: cuts on a SIM moment, not wall-clock: the dialog frame drifts with sim time, so a wall-clock cut is load-dependent.
    - cmd: cut
      when:
      - [host, mh_uidrive.log, 'LOG: HOST past gameclock 45000']
      - [c2, mh_uidrive.log, 'LOG: CLIENT past gameclock 45000']
    extra_ini: tools/uiscripts/ini/video_640.ini
    # Frame budget can't bound wall time (the shim blackholes at 60 s); set clear of it so --timeout is the real cap.
    timeout_frames: 1200000
    timeout: 900
    # post_check, not pixels: a frame can't say which route the outcome dialog took, only that one is showing. Judged on the host + client 2 only.
    post_check: [tools/check_transport_death.py, --client, '2']
    post_check_peers: true
    desc: 'R-live then U19f in one TCP host session: client 1 joins the lobby, an 8 s stall must NOT drop the link and a blackhole must (client leaves the lobby, host frees the slot and greys Start); client 2 then joins the same lobby, a match starts, and a mid-match transport cut is retired by the fast-drop route with the below-quorum dialog on both peers'
