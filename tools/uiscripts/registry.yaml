      # exercised. 180ms matches the suite's validated shim delay.
      shim_delay: 180
      # Without ship_pacing, the rig's 30ms lookahead makes every step wait ~1 RTT through the shim.
      ship_pacing: true
      # Pins resolution (the lane's persisted video preference is whatever the step before left).
      extra_ini: tools/uiscripts/ini/video_640.ini
      # Captures mask the area around the outcome dialog: end step and mothership drift vary by run.
      timeout: 300
      timeout_frames: 200000
      # expect fixed asserts the measured ~0ms gap as a floor, well under the 500ms bound. (mp:P6)
      post_check: [tools/check_p6_gap.py, --expect, fixed]
      post_check_peers: true
      post_check_session: true
