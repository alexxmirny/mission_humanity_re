# The UI-suite scenario registries, loaded + schema-checked by tools/ui_registry.py (TL-SUITE-REGDATA).
# Unknown keys, wrong types and missing required keys refuse the load by row name; the schema is
# SCHEMA in ui_registry.py. `!ref NAME` / `!frames [SECONDS, FLOOR]` resolve against names
# test_ui.py passes in. Comments here are one-line whys; the rows' dated history (formerly
# test_ui.py comments) is archived verbatim in the private session notes of 2026-09-25.
# Every multi row runs the lockstep hash compare (ui_registry.hash_plan + mp_analyze) unless it
# declares `no_hash_why: '<reason>'`; the load refuses a row whose config would void the compare.

anchors:
  # mp:GX1 net-indicator residue probe, shared by its positive row and its planted negative. The
  # rect is the PING/CMD text block at 640x480; colour is the default net_indicator_color (white).
  gx1_netind_check: &gx1_netind_check [tools/check_overlay_residue.py, --before, n1_shown, --after, n2_hidden, --rect, '340,6,60,22', --color, ffffff]

# Strategic-sim fixtures (SIM1-P clause 9): what the sim gate runs; coverage.py --domain sim
# reports their union. A floor, not a target -- add a row only after a run proves it reaches
# something the others do not. test_ui.SIM_RESID_SCENARIOS is an alias of this list.
sim_scenarios:
  - name: soak_default
    desc: '8-way all-AI soak from the default start -- the broad strategic sweep, and the one scenario
      that rewards DEPTH: 185 rows at 600 steps, 281 at 3000, 388 at 10000'
    # steps=10000: coverage curve flattens here (30000 costs 3x for +8 rows);
    # re-derive with coverage.py before changing.
    steps: 10000
    speed: 1000
  - name: soak_saved
    desc: 'developed save loaded at step 120 -- reaches the economy/production/research branches an empty
      default start cannot, and reaches them AT ONCE: 294 rows at 600 steps and 296 at 30000, so depth
      buys it nothing'
    # load_at=120: a budget below ~300 never loads the save (silently re-measures
    # the default start twice).
    steps: 1500
    speed: 1000
    save: ayy30
    load_at: 120
    # Not all-AI after step 120: LOADGAME replaces the world with the save's own 2-player/1-AI roster.

# UI-REC game-start journals (SPCAMP-AB); `--ui-replay` / `--ui-equiv` take a name from here.
# Not in the default suite: an arm costs minutes of rig time.
uirec_scenarios:
  - name: spcamp_newgame
    journal: tools/uiscripts/journals/spcamp-newgame.journal
    desc: 'human session: menu -> NEW GAME -> race -> campaign start -> play -> planet transition -> second
      planet (36,068 records / 33,819 steps)'
    # 10000 rung fails from a present-vs-sim-step cadence drift, not a real bug;
    # needs re-recording (SPCAMP-REC).
    rungs: [200, 2000, 10000]
    proven_rung: 2000
  - name: spcamp_mission
    journal: tools/uiscripts/journals/spcamp-mission.journal
    desc: 'human session: menu -> NEW GAME -> race -> campaign start -> enemy eliminated -> planet transition
      -> second planet (28,574 records / 24,873 steps)'
    rungs: [200, 2000, 10000, 24000]
    proven_rung: 0
  - name: spcamp_solo
    # Only fixture coverage.py walks: the other two predate TJ P barriers and
    # don't replay to the end (measures a prefix).
    coverage: true
    journal: tools/uiscripts/journals/spcamp-solo.journal
    oracle: tools/uiscripts/journals/spcamp-solo.oracle.gz
    desc: 'human session recorded ALL-ORIGINAL: menu -> NEW GAME -> race -> campaign start -> play (incl.
      3 squad merges by shift+click) -> planet transition -> second planet (37,383 records / 30,043 steps)'
    # Recorded on the UNPROMOTED build deliberately -- a ship recording would
    # bake promotion bugs into the reference.
    orders: {0A: 4954, 0B: 363, 1A: 19, 1C: 506, '33': 11, '34': 139, '35': 126, '36': 32, 6D: 15, 7E: 3,
      7F: 3, D4: 1, DB: 1, DD: 9, E6: 11, EA: 10, EC: 2}
    # Tracked separately: pre-transition steps dominate the full histogram
    # (~98%), hiding a dead second planet.
    orders_post: {0B: 351, '35': 1}
  - name: tutorial_solo
    journal: tools/uiscripts/journals/tutorial-solo.journal
    oracle: tools/uiscripts/journals/tutorial-solo.oracle.gz
    # Tutorial lands SESSION_MODE=2 once (LOCAL branch); verdict clauses must
    # not hardcode spcamp's SESSION_MODE=1-twice shape.
    land_mode: '2'
    landings: 1
    desc: 'human session recorded ALL-ORIGINAL: menu -> TUTORIAL -> the full scripted tutorial played
      to the end (13,053 records / 18,317 steps)'
    # Recorded on the UNPROMOTED build: the two bodies under test are already
    # promoted, so a ship recording would compare them against themselves.
    orders: {0A: 498, 0B: 59, '20': 1, '33': 49, '34': 19, '35': 12, '36': 13, 6D: 10, 7E: 48, E6: 4,
      EA: 5}

# Tactical journal scenarios: replay a recorded human session and compare the simulation, not
# frames. Their `equiv` arm runs in the default suite; verify/replay stay behind --tact-suite.
tact_scenarios:
  - name: poz_stand_exit
    journal: tools/uiscripts/journals/poz-stand-exit.journal
    desc: POZ11, 5,335-frame human session -- STAND/KNEEL + 88 attacks, exits by the building route
    # Only fixture covering STAND: poz1_combat has zero STANDs and passed with
    # the G115 stand_tick inversion live.
    arms: [verify, replay]
  - name: poz1_combat
    journal: tools/uiscripts/journals/poz1-combat.journal
    desc: POZ1L, 4.4 min human session -- 14,106 input records, 211 orders, 10 units lost
    # equiv is the gate arm (runs by default); verify/replay are diagnostics only, under --tact-suite.
    arms: [verify, replay]
  - name: poz1_quiet
    journal: tools/uiscripts/journals/poz1-quiet-patrol.journal
    desc: POZ1L, 3,518-frame human session -- patrol only, no shot fired, ZERO casualties
    # Quiet arm required by the equiv clause: a body diverging only after damage is invisible
    # otherwise; the scripted --tact-determinism arm alone supplies no input (dead-ends G117).
    arms: [replay]
  - name: poz3_teleport
    journal: tools/uiscripts/journals/poz3-teleport.journal
    desc: POZ3L, 8,882-frame human session -- the ONLY mission with teleports; 59-unit roster
    # --tact-equiv used to ignore the journal's own roster and replay against CLI defaults (24 vs 59
    # units), passing wrongly on both arms -- now guarded by tact_journal_roster_guard.
    arms: [replay]

# The capture suite (test_ui.TESTS). Script names resolve under tools/uiscripts/; the baseline
# label is the script basename, so every script needs tools/uiscripts/baselines/<label>/.
# budget_s is a gate verdict (TL gate diet): raise it only on measured evidence; >120 s needs long_why.
tests:
  - name: tutorial_enter
    # gate diet: max measured (gate 16s, n2 8s, n6 14s) x 1.3 = 25, FLOORED at 30 (BUDGET_FLOOR_S)
    budget_s: 30
    kind: solo
    script: tutorial_enter.txt
    # PINNED: t3 is an IN-GAME capture, so its size follows the persisted setup.dat resolution.
    extra_ini: tools/uiscripts/ini/video_1024.ini
    # tol 0.0 + pin_wallclock=1 pinned after run-to-run drift hit 2.7% under concurrent gate load;
    # do not raise tol -- pin what varies instead.
    harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
    tol: 0.0
    desc: TUTORIAL from the main menu -> welcome dialog -> Start -> the step driver ticking
  - name: menu_walk
    # gate diet: max measured (gate 12s, n2 15s, n6 16s) x 1.3 = 25, FLOORED at 30 (BUDGET_FLOOR_S)
    budget_s: 30
    kind: solo
    script: mp_menu_walk.txt
    # Asserts crossings>0 & absent-calls=0: pixels alone can't tell a bound-but-uncalled lane
    # from a working one (closed miss: LIB-SPINE-API).
    post_check:
    - [tools/check_module_bind.py, --libmh, --expect, bound]
    - [tools/check_module_bind.py, --module, mh_harness, --expect, bound]
    desc: main menu -> NETWORK GAME -> ... -> host lobby (single-peer, host-only on the first VM)
  - name: libmh_absent
    budget_s: 30  # gate diet: max measured (gate 6s, n2 5s, n6 5s) x 1.3 = 10, FLOORED at 30 (BUDGET_FLOOR_S)
    kind: solo
    script: libmh_absent.txt
    # Configuration (1): missing libmh.dll is a legitimate shipped config invisible to the
    # player (ruling Q10), unlike a missing mh_net.dll (a visible degradation).
    omit_satellite: [libmh.dll]
    # Both satellite checks required: without the second this could silently pass module_absent's
    # lane instead, so configuration (1) itself never gets tested.
    post_check:
    - [tools/check_module_bind.py, --libmh, --expect, absent]
    - [tools/check_module_bind.py, --expect, bound]
    # tol 0.0: stock menu drawn by original code in every configuration -- the 2% default
    # would pass a different menu.
    tol: 0.0
    desc: 'F4D: boot with libmh.dll MISSING -- configuration (1), the menu renders, nothing crosses'
  - name: harness_absent
    budget_s: 30  # gate diet: max measured (gate 7s, n2 5s, n6 5s) x 1.3 = 10, FLOORED at 30 (BUDGET_FLOOR_S)
    kind: solo
    script: harness_absent.txt
    # Missing mh_harness.dll is invisible to any pixel; needed so such a lane can't pass every
    # other scenario while --determinism has no log to read.
    omit_satellite: [mh_harness.dll]
    # All three satellite checks required: without them this could pass on a lane that lost
    # the transport or spine instead, re-running the other absent scenarios.
    post_check:
    - [tools/check_module_bind.py, --module, mh_harness, --expect, absent]
    - [tools/check_module_bind.py, --expect, bound]
    - [tools/check_module_bind.py, --module, libmh, --expect, bound]
    # tol 0.0: stock menu drawn by original code in every configuration -- the 2% default
    # would pass a different menu.
    tol: 0.0
    desc: 'F4E: boot with mh_harness.dll MISSING -- uninstrumented, the menu renders unchanged'
  - name: module_absent
    budget_s: 30  # gate diet: max measured (gate 7s, n2 5s, n6 6s) x 1.3 = 10, FLOORED at 30 (BUDGET_FLOOR_S)
    kind: solo
    script: module_absent.txt
    # Must omit mh_net_udp.dll specifically (default transport since the ruling); omitting
    # mh_net.dll instead leaves the bind intact and the lane quietly reads bound.
    omit_satellite: [mh_net_udp.dll]
    # check_module_bind requires 'absent' specifically, not 'declined' (which a lane that
    # stopped deploying satellites would also produce).
    post_check: [tools/check_module_bind.py, --expect, absent]
    tol: 0.0  # tol 0.0: stock main menu, nothing in this config draws differently -- any diff is real.
    desc: 'F4B: boot with mh_net.dll MISSING -- menu renders, the bind refuses loudly, the arm finishes'
  - name: no_net_boot
    # gate diet: max measured (gate 11s, n2 8s, n6 8s) x 1.3 = 15, FLOORED at 30 (BUDGET_FLOOR_S)
    budget_s: 30
    kind: solo
    script: no_net_boot.txt
    # module=none is a separate axis from [net] enable (enable=0 declines a present transport;
    # module=none means none exists) -- first boot of this configuration.
    net_extra: module=none
    # tol 0.0: notice is one line of text on a 640x480 frame -- at the 2% default it could
    # render the wrong sentence and still pass.
    tol: 0.0
    desc: 'F3F: boot with NO network module -- menu reached, NETWORK GAME armed, browser explains its
      empty list'
  - name: no_net_lobby
    # gate diet: max measured (gate 17s, n2 11s, n6 11s) x 1.3 = 25, FLOORED at 30 (BUDGET_FLOOR_S)
    budget_s: 30
    kind: solo
    script: no_net_lobby.txt
    # U43 fix: on_host_advertise() must install unconditionally (was wrongly grouped with
    # wire-touching stubs), or the host silently takes the CLIENT branch on module=none.
    net_extra: module=none
    # Pinned since mp:RM1 (rematch zeros sim clocks at entry): old byte-identity was accidental;
    # pin_wallclock is now required for tol 0.0 to hold.
    harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
    # tol 0.0: the notice and lobby/HUD states pinned here are each a small fraction of a
    # 640x480 frame, far under the 2% default.
    tol: 0.0
    desc: 'U42/U43/Q8: module=none HOST reaches Network players, seats an AI, and Start launches the match
      with no transport'
  - name: ip_cancel
    # gate diet: max measured (gate 14s, n2 8s, n6 11s) x 1.3 = 20, FLOORED at 30 (BUDGET_FLOOR_S)
    budget_s: 30
    kind: solo
    script: mp_ip_cancel.txt
    desc: 'U38: browser -> Internet server -> Cancel comes back to a LIVE local browser (the de-duplicated
      slide-in)'
  # tooling:TL-SUITE-SPLICE-HOSTCLICK -- replaces d25_buildclick, u39_diplomacy and d28_canceltask
  # (one boot each) with one match: diplomacy (mp:U39), canceltask (mp:D28), buildclick (mp:D25),
  # three named verdicts. Each segment's pre-splice fix history is in its negative row / tracker item.
  - name: host_clicks
    budget_s: 80
    budget_evidence: "the three rows measured 82.7 + 95.5 + 66.9 = 245.1 s (last_green _suite_scenarios); host_clicks measured 60-64 s over 11 standalone rig runs 2026-09-26 (72 s with --update-baselines) -> 61 x 1.3 = 80"
    kind: multi
    # transport=tcp kept from d25_buildclick (its TCP coverage); the two negative rows stay on udp.
    net_extra: transport=tcp
    host: mp_host_clicks.txt
    clients: [mp_client_idle.txt]
    # cheat_gate_off.ini: staging for the canceltask segment's `_DESTROY` (not a test of CH1's gate).
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/cheat_gate_off.ini]
    timeout: 420
    # One verdict per segment (sim window between the script's `log hc <seg>` fences); the default
    # whole-match hash compare stays the determinism verdict. Session dir: D28's `routed as order`
    # line is match-time mh_net.log content.
    post_check: [
      [tools/check_host_clicks.py, --segment, diplomacy, --label, 'U39 diplomacy'],
      [tools/check_host_clicks.py, --segment, canceltask, --label, 'D28 cancel task'],
      [tools/check_host_clicks.py, --segment, buildclick, --label, 'D25 build click'],
    ]
    post_check_peers: true
    post_check_session: true
    desc: 'U39+D28+D25 in one match: host ticks allied in the diplomacy dialog, cancels the mother''s
      repair through the status dialog''s &Yes, then clicks the Academy build icon; client idles --
      each segment''s hash window must stay IDENTICAL'
  # region_hash_step=1 required: the divergence window is only ~4 steps wide, so a 50-step
  # cadence would miss it entirely (mp:U39).
  - name: u39_diplomacy_echo
    budget_s: 80  # gate diet: max measured (gate 59s, n2 52s, n6 55s) x 1.3
    kind: multi
    no_hash_why: 'negative arm: the local echo diverges by design (check_u39_echo reads the mismatch)'
    host: mp_host_diplomacy.txt
    clients: [mp_client_idle.txt]
    # tooling:TL-SUITE-FOLD-ML: was match_launch; re-anchored to host_clicks (see u39_diplomacy).
    share_lanes: host_clicks
    net_extra: diplo_echo_nop=0
    extra_ini: tools/uiscripts/ini/video_1024.ini
    harness_extra: region_hash_step=1;synth_move=0
    timeout: 420  # the match runs to gameclock 30000+; 200 s overran under the gate's load
    post_check: [tools/check_u39_echo.py]
    post_check_peers: true
    desc: 'U39 negative arm: retail echo kept -- `players` must still differ for a bounded window and
      heal'
  # Reproduction arm: [net] cancel_task_order=0 IS the repro knob (this seam has no
  # mode=original fork); hash diverges at the click and never heals.
  - name: d28_canceltask_local
    budget_s: 85  # gate diet: max measured (gate 65s, n2 63s, n6 64s) x 1.3
    kind: multi
    no_hash_why: 'negative arm: the local cancel diverges by design (check_cancel_task --expect diverge)'
    host: mp_host_canceltask.txt
    clients: [mp_client_idle.txt]
    # tooling:TL-SUITE-FOLD-ML: was match_launch; re-anchored to host_clicks
    # (same host/client scripts already -- this was always the more natural pair).
    share_lanes: host_clicks
    net_extra: cancel_task_order=0
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/cheat_gate_off.ini]
    harness_extra: region_hash_step=1;synth_move=0
    timeout: 900  # region_hash_step=1 hashes every step: 424 s at the first gate (the ship arm takes 65 s)
    post_check: [tools/check_cancel_task.py, --expect, diverge]
    post_check_peers: true
    post_check_session: true  # see host_clicks' row -- same match-time log content
    desc: 'D28 negative arm: `[net] cancel_task_order=0` (retail local call kept) -- `buildings` must
      diverge from the click and stay diverged'
  # mp:D35: D25's build click in CONFIGURATION (1) -- no libmh.dll, as the player zips ship -- where
  # the fix is the mh.dll seam (seams/ui_bldg_build_probe.cpp), not libmh's promoted body. host_clicks'
  # buildclick segment is the same click in configuration (2).
  - name: d35_buildclick_c1
    budget_s: 70
    budget_evidence: "standalone 54 s (2026-09-26, beside the retail arm) x 1.3 = 70; the first gate run read 98 s while the whole gate ran +39% under memory pressure (gx1 +171%, map_have_tcp +161%)"
    kind: multi
    host: mp_host_buildclick.txt
    clients: [mp_client_idle.txt]
    omit_satellite: [libmh.dll]
    net_extra: transport=udp
    extra_ini: tools/uiscripts/ini/video_1024.ini
    timeout: 420
    post_check: [tools/check_build_probe.py, --expect, identical]
    post_check_peers: true
    post_check_session: true  # the probe + [desync] lines are match-time (session dir)
    desc: 'D35: configuration (1) host lands, opens the build tab and clicks the Academy; client idles --
      the mh.dll seam probes charge-free, the pair stays IDENTICAL and the in-band desync watch is clean'
  # Reproduction arm: [net] build_probe_free=0 IS the repro knob (the retail pay + re-grant); the
  # hash diverges in p0_ai_econ at the click and never heals -- the rc3 match's symptom.
  - name: d35_buildclick_c1_retail
    budget_s: 65
    budget_evidence: "standalone 50 s (2026-09-26) x 1.3 = 65"
    kind: multi
    no_hash_why: 'negative arm: the retail probe diverges by design (check_build_probe --expect diverge)'
    host: mp_host_buildclick.txt
    clients: [mp_client_idle.txt]
    share_lanes: d35_buildclick_c1
    omit_satellite: [libmh.dll]
    net_extra: transport=udp;build_probe_free=0
    extra_ini: tools/uiscripts/ini/video_1024.ini
    harness_extra: region_hash_step=50;synth_move=0
    timeout: 420
    post_check: [tools/check_build_probe.py, --expect, diverge]
    post_check_peers: true
    post_check_session: true
    desc: 'D35 negative arm: `[net] build_probe_free=0` (retail pay + re-grant kept) -- p0_ai_econ must
      diverge from the click, stay diverged, and the in-band watch must say DESYNC'
  - name: shim_udp
    # Measured 32s under ship_pacing (was 33-44s under the pinned 30ms lookahead);
    # x1.3 margin rounds to 45.
    budget_s: 45
    kind: multi
    host: mp_host_start.txt
    clients: [mp_client_start.txt]
    # tooling:TL-SHIMUDP-C: needed because link_death's shim arms 'stall' (blackhole), which
    # the udp shim refuses -- nothing else covers the plain-delay path.
    net_extra: transport=udp
    shim: true
    # One-way delay (round-trip ~80ms): a plain latency value, comfortably clear of near-zero
    # (bypass) and check_shim_rtt.py's 20ms floor.
    shim_delay: 40
    # Subject is the shim's plain-delay path, not the rig's pinned 30ms lookahead (which made
    # every step wait ~1 RTT, 0.41-0.47x game/wall).
    ship_pacing: true
    extra_ini: tools/uiscripts/ini/video_1024.ini
    # Assertion is the post_check, not the pixels: a bypassed shim renders an identical frame;
    # check_shim_rtt fails when srtt0_ms reads near-zero.
    post_check: [tools/check_shim_rtt.py]
    # tooling:TL-SUITE-FOLD-ML: match_launch (mp_host_start/mp_client_start, no shim) is gone from
    # TESTS -- this row is now the only one exercising that reachability walk, plus the shim + hash.
    desc: 'TL-SHIMUDP-C: the mp_host_start/mp_client_start walk through the udp shim -- srtt0_ms must
      show the delay was measured, not bypassed'
  # mp:P9: determinism harness can't arm without libmh (ruling Q4) -- uses the in-band
  # desync watch instead; the fix lives only in the promoted body.
  - name: match_launch_net
    budget_s: 65  # gate diet: max measured (gate 46s, n2 37s, n6 50s) x 1.3
    kind: multi
    host: mp_host_start_net.txt
    clients: [mp_client_start_net.txt]
    omit_satellite: [libmh.dll]
    net_extra: transport=udp
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/desync_verbose.ini]
    # dist:V022 folded in (TL-SUITE-FOLD-DETC1): record orders; synthetic moves start at step 700,
    # after the m3 capture at gameclock 6000, so the frames stay baseline-clean.
    harness_extra: order_mode=1;synth_move=1;synth_at=700
    timeout: 420
    # mp:L1b: only row exercising lobby_ping.cpp -- match_launch is TCP-pinned and
    # net.lobbyping only fires with lat_supported, which TCP never sets.
    post_check:
    - [tools/check_resync_storm.py, --expect, carried]
    - [tools/check_lobby_ping.py]
    - [tools/check_orders_agree.py]
    post_check_peers: true
    # [resync]/[desync] lines are match-time (session dir); the checker follows session.json
    # to the process dir for the boot-time half.
    post_check_session: true
    desc: 'P9: configuration (1) (no libmh.dll) on the shipped udp transport -- the resync gate is CARRIED
      by the byte patches, 0 FIRED over 1000+ steps, desync watch clean; dist:V022: both peers RECORD
      their order stream and agree on every common step (tooling:TL-SUITE-FOLD-DETC1, folded from
      run_gate.py''s retired det_c1 unit)'
  # mp:EL2: an unlanded ship's 'eliminated' log was actually self-removal from an ESC-quit
  # (on_quit_to_menu, U17), not the real elimination path.
  - name: el2_mother_deploy
    budget_s: 60  # gate diet: max measured (gate 37s, n2 40s, n6 43s) x 1.3
    kind: multi
    no_hash_why: 'a peer quits/drops mid-match: the survivor applies a removal the leaver never hashes (D26 covers game-over, not a leave)'
    host: mp_host_el2.txt
    clients: [mp_client_el2.txt]
    share_lanes: match_launch_net
    omit_satellite: [libmh.dll]
    net_extra: transport=udp;defang_overlay=0;graceful_leave=1
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/desync_verbose.ini]
    timeout: 420
    post_check: [tools/check_el2_mother.py]
    post_check_peers: true
    # Presence/desync lines are match-time (session dir); quit-time lines land in the process
    # dir, reached via session.json.
    post_check_session: true
    desc: 'EL2: the joiner''s mother is placed by its own deploy in lockstep on both peers; the field''s
      ''eliminated at 6 s'' line is the joiner''s ESC-quit, reproduced'
  # Requires defang_overlay=0: defang=1 NOPs the mode-8 store that hid this storm for 2
  # months (dead-ends G274) -- a --defang 1 run will not reproduce it.
  - name: resync_storm_repro
    budget_s: 120  # gate diet: max measured (b2 87s, n2 88s, n6 90s) x 1.3
    expect_red: mp:P9
    kind: multi
    no_hash_why: 'expect_red reproduction (mp:P9) under forced resync barriers; its XFAIL would absorb a hash red'
    host: mp_host_p9_soak.txt
    clients: [mp_client_p9_soak.txt]
    omit_satellite: [libmh.dll]
    net_extra: transport=udp;resync_trigger_gate=0;resync_count_init=0;lockstep_step_ms=100
    net_extra_client: lockstep_step_ms=60
    shim: true
    shim_delay: 100  # ONE-WAY -> ~200 ms rtt, the field link
    shim_timeline: tools/uiscripts/shim/p9_soak_5min.txt
    # Evidence-bounded: blackhole fires once both captures are logged and the leader began
    # >=5 barriers; the 340s timeline stays as a fallback bound.
    shim_triggers:
    - cmd: blackhole on
      when:
      - [host, mh_net.log, '\[resync\] barrier #5 BEGIN']
      - [host, mh_uidrive.log, 'LOG: HOST is in the configuration-\(1\) match']
      - [c1, mh_uidrive.log, 'LOG: CLIENT is in the configuration-\(1\) match']
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/desync_verbose.ini]
    # 480s x 60fps x 2 margin: the DLL's watchdog counts PRESENTS (capped at 60fps for multi
    # lanes), so this is the honest cap, not a wall-clock timeout (TL-HARN17).
    timeout_frames: 57600
    timeout: 480
    post_check: [tools/check_resync_storm.py, --expect, storm]
    post_check_peers: true
    post_check_session: true
    desc: 'P9 reproduction (kept red): configuration (1), gate OFF, count_init OFF, defang 0, host 100
      / joiner 60 through a 100 ms shim until the leader has BEGUN >= 5 barriers (a shim trigger ends
      it then; the 5-min timeline is the fallback)'
