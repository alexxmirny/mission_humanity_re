  # step of screen_seq (tooling:TL-SUITE-FOLD step 8); the default carrier is solo_walk's cfg_newgame_restore segment.
  # mods:G17, 2-peer: the JOINER loaded cfgmod.sav before joining; the host is a fresh process. Both peers' last `; G17:`
  # line must end on the boot parse (host 0/0, joiner N/0); the lockstep hash compare is the multi-row default.
  # cfg_newgame_mp_seq (steps cfg_newgame_mp / cfg_newgame_mp_ship; step 6 folded the hosts, step 10 the two configurations): ONE three-peer match per configuration. Replaces
  #   cfg_newgame_mp + cfg_newgame_mp_ship            (a joiner that LOADED a save first -- client A)
  #   cfg_newgame_mp_host + cfg_newgame_mp_host_ship  (a HOST that loaded a save first -- the host)
  # The host and client A both loaded cfgmod.sav; client B is fresh and is the control. All three must start the match from the boot
  # parse of the cfg tables (--fresh-idx 2: only B reads 0/0 before the restore) and the lockstep hashes must agree on match steps.
