  - name: resync_seq
    budget_s: 305
    budget_evidence: "measured 233 s, 227 s solo and 232 s with six rows concurrent on the local rig 2026-10-16 (gate 65 + countinit 46 + receiver_deadline 42 + p13 74); x 1.3 = 302, rounded to 305; the four rows it replaced were 68 + 47 + 47 + 74 s (budgets 90 + 100 + 95 + 120)"
    long_why: "four matches in sequence on one pair of lanes (each step is a whole 2-peer match behind a 100-180 ms shim: 65 + 46 + 42 + 74 s measured); the old rows ran concurrently on four lane pairs (74 s wall) at the same total process time"
    kind: multi
    omit_satellite: [libmh.dll]
    shim: true
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/desync_verbose.ini]
    post_check_peers: true
    post_check_session: true
    timeout: 1440
    multi_steps:
    - name: resync_gate_proof
      # Gate alone zeroes barriers: a nag counts only past 4s of silence, unreachable at 100ms RTT. (mp:P9)
      host: mp_host_p9_proof.txt
      clients: [mp_client_p9_proof.txt]
      no_hash_why: 'P9 resync family: forced resyncs re-import the world; harness step numbering is not realigned'
      net_extra: transport=udp;resync_count_init=0;lockstep_step_ms=100
      net_extra_client: lockstep_step_ms=60
      shim_delay: 100
      timeout_frames: 57600
      timeout: 480
      post_check: [tools/check_resync_storm.py, --expect, carried]
    - name: resync_countinit_proof
      # count_init=1 sets threshold=200 from step 0, killing the threshold-0 fire -- an 8x cut alone, not zero; the gate is what
      # zeroes it. (mp:P9) Ends on the leader's 2nd FIRED signal, not a fixed gameclock: nag rate is frame-rate dependent, so a fixed
      # window isn't a stable bound.
      host: mp_host_p9_countinit.txt
      clients: [mp_client_p9_countinit.txt]
      no_hash_why: 'P9 resync family: forced resyncs re-import the world; harness step numbering is not realigned'
      shim_triggers:
      - cmd: signal countinit_done
        when:
        - [host, mh_net.log, '\[resync\] force_resync FIRED #2:']
      net_extra: transport=udp;resync_trigger_gate=0;lockstep_step_ms=100
      net_extra_client: lockstep_step_ms=60
      shim_delay: 100
      timeout_frames: 57600
      timeout: 480
      post_check: [tools/check_resync_storm.py, --expect, countinit, --min-fires, '2']
    - name: resync_receiver_deadline_proof
      # Drops the gameclock-6000 capture: under this storm's slow rate it's reached only after the match ends. Real check is the
      # receiver_deadline log line. (mp:P9W)
      host: mp_host_p9w_deadline.txt
      clients: [mp_client_p9w_deadline.txt]
      no_hash_why: 'P9 resync family: forced resyncs re-import the world; harness step numbering is not realigned'
      # Client override 6000ms (host stays 60000) clears 2 barrier cycles so GS2 can't misfire on a barrier's freeze; a tried 500ms did
      # misfire.
      net_extra: transport=udp;resync_trigger_gate=0;resync_count_init=0;lockstep_step_ms=100;data_timeout_ms=60000
      net_extra_client: lockstep_step_ms=60;data_timeout_ms=6000
      shim_delay: 100
      # TL-P9W-TRIGGER: cut the link the instant the CLIENT itself samples RESYNC_IN_PROGRESS 0->1 (net.resync_barrier_begin is written
      # on BOTH peers -- see log_formats.json), instead of guessing a wall-clock offset that lands inside one ~97% of the time. The
      # client is the non-leader/receiver here (short data_timeout_ms override above), so this is the exact leaderless-barrier condition
      # the checker proves. p9w_deadline_repro.txt stays as the fallback bound (its own never-firing is itself a finding).
      shim_triggers:
      - cmd: blackhole on
        fast: true  # poll every 0.25 s: the barrier lasts ~2 s, a 3 s poll cuts after its RESUME
        when:
        - [c1, mh_net.log, '\[resync\] barrier #\d+ BEGIN']
      shim_timeline: tools/uiscripts/shim/p9w_deadline_repro.txt
      timeout_frames: 21600
      timeout: 180
      post_check: [tools/check_resync_receiver_deadline.py]
    - name: p13_rate_180
      host: mp_host_p13_rate.txt
      clients: [mp_client_p13_rate.txt]
      no_hash_why: 'measures the sim rate (check_sim_rate): the harness''s every-step manifest walk is load on that quantity'
      net_extra: transport=udp
      ship_pacing: true
      shim_delay: 180
      timeout_frames: 57600
      timeout: 300
      # 6% tol, not 2%: ship pacing's 20ms sim step lands the frame on a different sub-step run to run (~3.5% variance) vs the pinned
      # baseline.
      tol: 0.06
      post_check:
      - [tools/check_sim_rate.py]
      - [tools/check_resync_storm.py, --expect, carried, --min-steps, '1500']
    desc: 'the libmh-absent udp-shim rows, one match per step: the P9 resync-barrier proofs (gate only, count_init only, the receiver-side deadline of a leaderless barrier) and the P13 sim-rate row (180 ms shim, 2500 steps)'
