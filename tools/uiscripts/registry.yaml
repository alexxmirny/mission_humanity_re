  # shim_seq (tooling:TL-SUITE-FOLD step 9, 2026-10-16): the udp-shim rows whose subject is the link's own conditions, ONE MATCH PER
  # STEP on the row's two lanes (multi_steps: both peers relaunch with that step's [net]/shim/harness settings; each step is the old
  # row -- own scripts and baselines, own post_check, own hash compare -- a red names its step and does not stop the rest). Replaced rows:
  #   shim_udp      (TL-SHIMUDP-C: the mp_host_start walk through an 80 ms-RTT shim; srtt0_ms must show the delay was measured)
  #   p6_loser_gap  (mp:P6: a real host-win/client-loss match behind a 180 ms shim; the loser's present gap)
