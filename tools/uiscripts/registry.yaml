  - name: freeze_watchdog
    tier: release  # gate-cost valve (2026-10-01): skipped by a bare run; test_ui.py --release-tier / run_gate.py --release
    # mp:P17 -- seeded from scroll_stall (same walk + shim-less udp match); re-measure and fill budget_evidence.
    budget_s: 52
    budget_evidence: "measured 2026-10-01 (lane P17): 38-39 s wall x1.3 = 50, rounded up"
    kind: multi
    no_hash_why: 'the host Sleeps 1500 ms once on purpose (the freeze under test); determinism is python tools/test_ui.py --determinism, not this row'
    host: mp_host_p17_freeze.txt
    clients: [mp_client_p17.txt]
    # BOTH peers carry the arm (no host-only [net] channel): each Sleeps once, 3 s into its own match, and each
