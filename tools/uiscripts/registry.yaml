  - name: graceful_quit
    budget_s: 40  # gate diet: max measured (gate 29s, n2 29s, n6 30s) x 1.3
    kind: multi
    no_hash_why: 'a peer quits/drops mid-match: the survivor applies a removal the leaver never hashes (D26 covers game-over, not a leave)'
    host: mp_host_gquit.txt
    clients: [mp_client_gquit.txt]
