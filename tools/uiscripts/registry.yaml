  # net_hud_scroll (tooling:TL-SUITE-FOLD step 7, 2026-10-15): ONE udp match through a plain-relay (delay 0) shim, three segments in order
  # (mp_host_net_hud_scroll.txt explains each). Replaces
  #   net_hud       (L1/L1c/L1d/TL-UISTALL: the connection indicator on a clean link, then its WAITING-FOR frame under an s2c blackhole)
  #   scroll_stall  (mp:U48: LEFT released inside a forced stall -- the scroll latch clears)
  # Every old capture is kept as `<old row>__<name>`. dialog_stall (+ its release-tier twins) is NOT folded in: see the host script's header.
  - name: net_hud_scroll
    budget_s: 95
    budget_evidence: "measured 71 s, 71 s, 71 s solo (+ the baseline-writing run) on the local rig 2026-10-15; x 1.3 = 92, rounded to 95; the two rows it replaced were net_hud 46 s + scroll_stall 46 s solo (budgets 65 + 90)"
    kind: multi
    no_hash_why: 'deliberate blackholes stall the client (net_hud) and the host (scroll_stall) -- the stalls under test; the U48 determinism clause is python tools/test_ui.py --determinism, not this row'
    host: mp_host_net_hud_scroll.txt
    clients: [mp_client_net_hud_scroll.txt]
    share_lanes: shim_seq  # a shim row can only share a shim row's lanes (mp:P9)
    # transport=udp is load-bearing: TCP reports lat_supported=0, so the indicator would print nothing.
    # rx_timeout_ms / data_timeout_ms = 60000: the forced c2s stall of the scroll segment holds the host for the 600-present keyhold (10 s at the
    # 60 fps cap) PLUS the trigger lag, which is exactly the transport's 10 s link timeout (`rx_timeout_ms`) and not far under the 15 s GS2
    # data-silence watchdog (`data_timeout_ms`). Under suite load the lag moved and one of them dropped the client (2026-10-15 full suite:
    # `GS2: peer 1 data-silent for 15000 ms > 15000 -> dropped`; with the triggers made fast, `udp conn 0 silent 10000 ms` instead -- both
    # peers then froze and the walk stalled for 361 s). Neither watchdog is what this row tests (gs2_data_timeout owns them), so the
    # stall is given room (a stall row must outlast both watchdogs, not race them).
    net_extra: transport=udp;rx_timeout_ms=60000;data_timeout_ms=60000
    # video_1024: the in-game frame size follows the persisted setup.dat preference. scroll_stall.ini turns the `; [mtrace]` line on (the
    # scroll latches the U48 checker reads).
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/scroll_stall.ini]
    # tol 0.0 is net_hud's (its `_only` rect compares the fixed label+bar at tol 0); the scroll frames keep their old 1.0 as per-capture `_tol`
    # entries in the baselines' _ignore.json.
    tol: 0.0
    shim: true
    shim_delay: 0
    shim_timeline: tools/uiscripts/shim/net_hud_scroll.txt
    shim_triggers:
    # TL-UISTALL: s2c blocks only the CLIENT's incoming traffic, so only the client's sim stalls. Lifted once the client has captured its frame.
    - cmd: blackhole s2c
      fast: true  # poll every 0.25 s: the stall's length is the walk's, not the poll's
      when:
      - [host, mh_uidrive.log, 'LOG: HOST net_hud_scroll: net_hud cut']
    - cmd: blackhole off
      fast: true
      when:
      - [host, mh_uidrive.log, 'LOG: HOST net_hud_scroll: net_hud lift']
    # U48: c2s, so the HOST stalls at the horizon while it holds LEFT
    - cmd: blackhole c2s
      fast: true
      when:
      - [host, mh_uidrive.log, 'LOG: HOST scroll_stall: hold start']
    - cmd: blackhole off
      fast: true
      when:
      - [host, mh_uidrive.log, 'LOG: HOST scroll_stall: released in stall']
    timeout: 400
    post_check: [
      # net_hud: names resolved on both peers on the clean link, samples sane, and the CLIENT's FIRST stall (the s2c one) names the host
      [tools/check_net_indicator.py, --reject-placeholder-name, --names-before-first-stall, --expect-first-stall, '1'],
      # U48: judged on the HOST's trace between the scroll segment's own markers, so nothing else's samples can reach it
      [tools/check_cam_trace.py, --peer, '0', --from-text, 'scroll_stall: begin', --to-text, 'scroll_stall: resumed', --expect-held, L, --expect-held-min, '3', --label, 'key-up in stall'],
    ]
    post_check_peers: true
    desc: 'one udp match, three segments: the connection indicator on a clean link (L1), the client''s WAITING FOR host frame under an s2c blackhole (TL-UISTALL), the scroll key-up released inside a host stall (U48)'
