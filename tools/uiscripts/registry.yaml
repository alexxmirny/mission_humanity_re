      30 s (the stock start begins its 5th by ~+10 s), desync watch IDENTICAL'
  # count_init=1 sets threshold=200 from step 0, killing the threshold-0 fire -- an 8x cut alone,
  # not zero; the gate is what zeroes it. (mp:P9)
  - name: resync_countinit_proof
    budget_s: 100  # gate diet: max measured (b2 72s, n2 69s, n6 75s) x 1.3
    kind: multi
    no_hash_why: 'P9 resync family: forced resyncs re-import the world; harness step numbering is not realigned'
    share_lanes: resync_storm_repro
    # Ends on the leader's 2nd FIRED signal, not a fixed gameclock: nag rate is frame-rate dependent,
    # so a fixed window isn't a stable bound.
    host: mp_host_p9_countinit.txt
    clients: [mp_client_p9_countinit.txt]
    shim_triggers:
    - cmd: signal countinit_done
      when:
      - [host, mh_net.log, '\[resync\] force_resync FIRED #2:']
    omit_satellite: [libmh.dll]
    net_extra: transport=udp;resync_trigger_gate=0;lockstep_step_ms=100
