    # RL15: plus both peers' session.json must agree on WHO PLAYED (a client used to list itself twice).
    post_check:
      - [tools/check_graceful_quit.py, --expect-graceful, --expect-same-end-clock, --expect-no-network-error,
        --max-drop-steps, '2']
      - [tools/check_session_players.py]
