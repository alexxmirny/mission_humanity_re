# The UI-suite scenario registries, loaded + schema-checked by tools/ui_registry.py (TL-SUITE-REGDATA).
# Unknown keys, wrong types and missing required keys refuse the load by row name; the schema is
# SCHEMA in ui_registry.py. `!ref NAME` / `!frames [SECONDS, FLOOR]` resolve against names
# test_ui.py passes in. Comments here are one-line whys; the rows' dated history (formerly
# test_ui.py comments) is archived verbatim in the private session notes of 2026-09-25.
# Every multi row runs the lockstep hash compare (ui_registry.hash_plan + mp_analyze) unless it
# declares `no_hash_why: '<reason>'`; the load refuses a row whose config would void the compare.

anchors:
  # mp:GX1 net-indicator residue probe, shared by its positive row and its planted negative. The
  # rect is the PING/CMD text block at 640x480; colour is the default net_indicator_color (white).
  gx1_netind_check: &gx1_netind_check [tools/check_overlay_residue.py, --before, n1_shown, --after, n2_hidden, --rect, '340,6,60,22', --color, ffffff]

# Strategic-sim fixtures (SIM1-P clause 9): what the sim gate runs; coverage.py --domain sim
# reports their union. A floor, not a target -- add a row only after a run proves it reaches
# something the others do not. test_ui.SIM_RESID_SCENARIOS is an alias of this list.
sim_scenarios:
  - name: soak_default
    desc: '8-way all-AI soak from the default start -- the broad strategic sweep, and the one scenario
      that rewards DEPTH: 185 rows at 600 steps, 281 at 3000, 388 at 10000'
    # steps=10000: coverage curve flattens here (30000 costs 3x for +8 rows);
    # re-derive with coverage.py before changing.
    steps: 10000
    speed: 1000
  - name: soak_saved
    desc: 'developed save loaded at step 120 -- reaches the economy/production/research branches an empty
      default start cannot, and reaches them AT ONCE: 294 rows at 600 steps and 296 at 30000, so depth
      buys it nothing'
    # load_at=120: a budget below ~300 never loads the save (silently re-measures
    # the default start twice).
    steps: 1500
    speed: 1000
    save: ayy30
    load_at: 120
    # Not all-AI after step 120: LOADGAME replaces the world with the save's own 2-player/1-AI roster.

# UI-REC game-start journals (SPCAMP-AB); `--ui-replay` / `--ui-equiv` take a name from here.
# Not in the default suite: an arm costs minutes of rig time.
uirec_scenarios:
  - name: spcamp_newgame
    journal: tools/uiscripts/journals/spcamp-newgame.journal
    desc: 'human session: menu -> NEW GAME -> race -> campaign start -> play -> planet transition -> second
      planet (36,068 records / 33,819 steps)'
    # 10000 rung fails from a present-vs-sim-step cadence drift, not a real bug;
    # needs re-recording (SPCAMP-REC).
    rungs: [200, 2000, 10000]
    proven_rung: 2000
  - name: spcamp_mission
    journal: tools/uiscripts/journals/spcamp-mission.journal
    desc: 'human session: menu -> NEW GAME -> race -> campaign start -> enemy eliminated -> planet transition
      -> second planet (28,574 records / 24,873 steps)'
    rungs: [200, 2000, 10000, 24000]
    proven_rung: 0
  - name: spcamp_solo
    # Only fixture coverage.py walks: the other two predate TJ P barriers and
    # don't replay to the end (measures a prefix).
    coverage: true
    journal: tools/uiscripts/journals/spcamp-solo.journal
    oracle: tools/uiscripts/journals/spcamp-solo.oracle.gz
    desc: 'human session recorded ALL-ORIGINAL: menu -> NEW GAME -> race -> campaign start -> play (incl.
      3 squad merges by shift+click) -> planet transition -> second planet (37,383 records / 30,043 steps)'
    # Recorded on the UNPROMOTED build deliberately -- a ship recording would
    # bake promotion bugs into the reference.
    orders: {0A: 4954, 0B: 363, 1A: 19, 1C: 506, '33': 11, '34': 139, '35': 126, '36': 32, 6D: 15, 7E: 3,
      7F: 3, D4: 1, DB: 1, DD: 9, E6: 11, EA: 10, EC: 2}
    # Tracked separately: pre-transition steps dominate the full histogram
    # (~98%), hiding a dead second planet.
    orders_post: {0B: 351, '35': 1}
  - name: tutorial_solo
    journal: tools/uiscripts/journals/tutorial-solo.journal
    oracle: tools/uiscripts/journals/tutorial-solo.oracle.gz
    # Tutorial lands SESSION_MODE=2 once (LOCAL branch); verdict clauses must
    # not hardcode spcamp's SESSION_MODE=1-twice shape.
    land_mode: '2'
    landings: 1
    desc: 'human session recorded ALL-ORIGINAL: menu -> TUTORIAL -> the full scripted tutorial played
      to the end (13,053 records / 18,317 steps)'
    # Recorded on the UNPROMOTED build: the two bodies under test are already
    # promoted, so a ship recording would compare them against themselves.
    orders: {0A: 498, 0B: 59, '20': 1, '33': 49, '34': 19, '35': 12, '36': 13, 6D: 10, 7E: 48, E6: 4,
      EA: 5}

# Tactical journal scenarios: replay a recorded human session and compare the simulation, not
# frames. Their `equiv` arm runs in the default suite; verify/replay stay behind --tact-suite.
tact_scenarios:
  - name: poz_stand_exit
    journal: tools/uiscripts/journals/poz-stand-exit.journal
    desc: POZ11, 5,335-frame human session -- STAND/KNEEL + 88 attacks, exits by the building route
    # Only fixture covering STAND: poz1_combat has zero STANDs and passed with
    # the G115 stand_tick inversion live.
    arms: [verify, replay]
  - name: poz1_combat
    journal: tools/uiscripts/journals/poz1-combat.journal
    desc: POZ1L, 4.4 min human session -- 14,106 input records, 211 orders, 10 units lost
    # equiv is the gate arm (runs by default); verify/replay are diagnostics only, under --tact-suite.
    arms: [verify, replay]
  - name: poz1_quiet
    journal: tools/uiscripts/journals/poz1-quiet-patrol.journal
    desc: POZ1L, 3,518-frame human session -- patrol only, no shot fired, ZERO casualties
    # Quiet arm required by the equiv clause: a body diverging only after damage is invisible
    # otherwise; the scripted --tact-determinism arm alone supplies no input (dead-ends G117).
    arms: [replay]
  - name: poz3_teleport
    journal: tools/uiscripts/journals/poz3-teleport.journal
    desc: POZ3L, 8,882-frame human session -- the ONLY mission with teleports; 59-unit roster
    # --tact-equiv used to ignore the journal's own roster and replay against CLI defaults (24 vs 59
    # units), passing wrongly on both arms -- now guarded by tact_journal_roster_guard.
    arms: [replay]

# The capture suite (test_ui.TESTS). Script names resolve under tools/uiscripts/; the baseline
# label is the script basename, so every script needs tools/uiscripts/baselines/<label>/.
# budget_s is a gate verdict (TL gate diet): raise it only on measured evidence; >120 s needs long_why.
tests:
  # solo_walk: the default-configuration solo rows (libmh bound, 640x480 menus) folded into one walk (tooling:TL-SUITE-FOLD
  # step 2, user 2026-10-15). Each segment opens with `mark <old row name>`, every capture is named <old row>__<name> (the
  # old baselines reused unchanged), and a red names its segment. Replaced rows: boot_snapshot, cfg_newgame_fresh,
  # menu_walk, ip_cancel, u52_relobby, key_repeat, type_ascii, type_cyrillic_acp, ai_closed_start, stats_panel,
  # pause_hotkey, esc_menu, devchange_guard (esc_menu's segment, run in a process that received the malformed
  # WM_DEVICECHANGE: the walk dying or hanging is the guard's verdict), cam_latch, cfg_newgame_restore,
  # campaign_planet_switch. Not folded (own boot or own ini): libmh_absent / harness_absent / module_absent (a satellite
  # is withheld), no_net_boot / no_net_lobby / status_wrap_ru (net module=none), type_cyrillic / type_polish (a codepage
  # pin the ACP segment must not have), the lang_* rows (a language-pack lane), tutorial_enter (its in-game frames are
  # 1024x768 by size_mode=2), font_guard (a probe text drawn on every frame), debug_overlay / gx1_overlay_residue /
  # imgui_* / win_resize / alttab_* (renderer, window and overlay inis that cannot coexist), tact_panel (launch args),
  # galaxy_bg_picker (a picker video ini), sp_state_record (its own state-record ini and a standing load-red).
  # Step 8 (tooling:TL-SUITE-FOLD) folded all of those except sp_state_record into PROCESS sequences (solo_steps): satellite_seq,
  # lang_seq, screen_seq, overlay_seq, alttab_seq -- one row and one lane each, one process per old row.
  - name: solo_walk
    budget_s: 105
    budget_evidence: "79 s solo, two green runs (2026-10-15) x1.3; the 15 folded rows summed ~275 s of loaded-suite time (campaign_planet_switch 132 s of it)"
    kind: solo
    script: solo_walk.txt
    # cfgmod.sav is 2-almost.sav with one byte flipped in each cfg table: the cfg restore segment loads it, and the planet
    # switch segment loads it again (it sits on Aman, like 2-almost, so the switch off Nortus is the same edge).
    deploy_save: cfgmod
    # pause.ini: size_mode=0 (640x480 in game, the size every folded capture was baselined at) + the P pause key;
    # cam_trace.ini: the [mtrace] camera trace cam_latch reads; devchange_probe_on.ini: one malformed WM_DEVICECHANGE 6 s in.
    extra_ini: [tools/uiscripts/ini/pause.ini, tools/uiscripts/ini/cam_trace.ini, tools/uiscripts/ini/devchange_probe_on.ini]
    harness_extra: skip_intro_avi=1;boot_snapshot=1;pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
    post_check:
      # whole-run: the satellites bound at DllMain, once per process
      - [tools/check_module_bind.py, --libmh, --expect, bound]
      - [tools/check_module_bind.py, --module, mh_harness, --expect, bound]
      # mh_launch.log has no timestamps to slice on, so the G17 lines are judged by their order: the walk starts new games
      # in segments cfg_newgame_fresh (line 1), cfg_newgame_restore (2), campaign_planet_switch (3); the lobby starts of
      # the other segments are multiplayer starts and write none (measured 2026-10-15)
      - [tools/check_cfg_newgame_restore.py, --fresh, --nth, '1']
      - [tools/check_cfg_newgame_restore.py, --nth, '2']
      - [tools/check_presence.py, --not-planet, Nortus]
      # cam_latch's two probes, judged inside its own segment (the `log` lines the script writes at its start and end)
      - [tools/check_cam_trace.py, --from-text, 'cam_latch: segment start', --to-text, 'cam_latch: segment end', --segment, '1', --boundary, 'cam_latch: probe2', --label, edge latch, --expect-pinned, '3', --expect-rise-fall, --max-lines-per-frame, '1.0', --expect-di]
      - [tools/check_cam_trace.py, --from-text, 'cam_latch: segment start', --to-text, 'cam_latch: segment end', --segment, '2', --boundary, 'cam_latch: probe2', --label, key latch, --expect-held, L, --expect-held-min, '3', --max-lines-per-frame, '1.0']
    tol: 0.0
    desc: 'default-configuration solo walk: main menu -> NETWORK GAME -> lobby, IP cancel round trip, re-lobby reset, key repeat, typed text (ASCII, Cyrillic on a CP1252 machine), AI+closed lobby start, stats panel, pause hotkey, ESC menu under a malformed WM_DEVICECHANGE, camera edge/key latches, G17 cfg restore after New Game (fresh and after a Load), the campaign planet switch, the boot snapshot'
  # screen_seq (tooling:TL-SUITE-FOLD step 8, user 2026-10-15): the solo rows of the default configuration (libmh bound, mh.dll +
  # every satellite) that each need their own video / launch ini, one PROCESS per step on one lane (solo_steps). Replaced rows:
  # tutorial_enter, galaxy_bg_picker, tact_panel, wheel_hud_lists_lib, cfg_newgame_restore_orig. The runner sweeps the saves
  # any step deploys out of the lane between steps, so each step sees the Load list its old row did. wheel_hud_lists_lib's script
  # had been deleted by step 2 (the row was dangling); wheel_hud_lists_lib.txt is the ship_walk segment re-created for libmh bound.
  - name: screen_seq
    budget_s: 135
    long_why: "thirteen single-process steps on one lane (a process start is ~4 s each), replacing twelve separate rows that summed well over 135 s; the two newest, bigmap_orders and bigmap_orders_off, are 34 s of it"
    budget_evidence: "37 s solo for the five old steps (three green runs 2026-10-15), 50 s with the three 4 s bigmap steps (2026-10-16, one run), 66 s with the three bigmap_click steps (2026-10-17, one run, steps of 4-5 s each) x1.3 = 85; mods:MM4C added two steps, bigmap_orders (26 s: eight overlay right clicks, units walking 8 and 3 s of game time between them) and bigmap_orders_off (8 s): 102-113 s for the whole sequence on two runs 2026-10-17, so 135 (x1.2 of the slower); the 5 replaced rows had 210 s of budget between them"
    kind: solo
    solo_steps:
      # TUTORIAL from the main menu -> welcome dialog -> Start -> the step driver ticking. PINNED: t3 is an IN-GAME capture, so its
      # size follows the persisted setup.dat resolution (video_1024). tol 0.0 + pin_wallclock=1 pinned after run-to-run drift hit
      # 2.7% under concurrent gate load; do not raise tol -- pin what varies instead.
      - name: tutorial_enter
        script: tutorial_enter.txt
        extra_ini: tools/uiscripts/ini/video_1024.ini
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        tol: 0.0
      # D13 mode guards, galaxy_native=0 (the RES6 fix-off twin): the galaxy screen stays at the picker mode larger than the art
      # (1280x768) and renders with the background SCALED to fill, no crash. post_check, not pixels: the SCALED-background line in
      # mh_video.log proves the copy took the header-aware path, and the three arm lines prove the guards were installed. tol 0.05%,
      # not the 2% default: a frame without the Nortus planet differs from the baseline by 0.113% of pixels (measured repeat diff over
      # 4 runs of the 6000-present dwell: 0.000%). The committed campaign save is the lane's only entry (2-almost).
      - name: galaxy_bg_picker
        script: galaxy_bg_picker.txt
        deploy_save: 2-almost
        extra_ini: tools/uiscripts/ini/video_picker_galaxy.ini
        post_check: [tools/check_mode_guards.py, --scaled]
        tol: 0.0005
      # LIFT-TACT: tactical mission running -- selection panel + active-count HUD on a real frame. Only step rendering tactical.
      # Mission entry isn't reachable from a menu; driven via the DLL's --tactical verb over save 11. tact_hash_step pins the
      # tactical wall clock (without it the clock freezes in the wrong mode). tol 0: the readout is ~0.1% of the frame.
      - name: tact_panel
        script: tact_panel.txt
        extra_ini: tools/uiscripts/ini/tact_panel.ini
        launch_args: --tactical 11
        deploy_save: '11'
        harness_extra: tact_hash_step=1;pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;pin_rand=1;rand_seed=12345
        tol: 0.0
      # D15: wheel_hud_lists with libmh.dll present (the spine bound, promotions live) -- the draw wrapper and the pre-input pump
      # coexist with the promoted bodies. tol 0.003: the burning units animate (the map area is masked anyway).
      - name: wheel_hud_lists_lib
        script: wheel_hud_lists_lib.txt
        deploy_save: ayy30
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/wheel_lists.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        tol: 0.003
      # mods:G17: a New Game after a Load plays on the SAVE's seven cfg tables. cfgmod.sav = 2-almost.sav with one byte flipped in
      # each table (tools/make_cfgmod_sav.py). Under [config] mode=original: the retail-detour carrier with libmh bound but nothing
      # promoted. check_cfg_newgame_restore.py reads the `; G17:` line.
      - name: cfg_newgame_restore_orig
        script: cfg_newgame.txt
        deploy_save: cfgmod
        extra_ini: tools/uiscripts/ini/rollback_original.ini
        harness_extra: skip_intro_avi=1
        post_check: [tools/check_cfg_newgame_restore.py]
        tol: 1.0
      # mods:MM4: the big map, centre on the local landing spot (the start position), marked with a ring. 2-almost at 1024x768 with libmh bound, camera pinned (camto), Tab held through the harness chord table.
      - name: bigmap_start
        script: bigmap_start.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_start.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        tol: 0.0
      # mods:MM4: the big map, centre on the true map middle (w/2, h/2), no wrap. 2-almost at 1024x768 with libmh bound, camera pinned (camto), Tab held through the harness chord table.
      - name: bigmap_map
        script: bigmap_map.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_map.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        tol: 0.0
      # mods:MM4B: the big map clicked (camera centre): the stock cursor is drawn over it, a left click centres the camera on the tile, a right click is swallowed, neither reaches the world. 2-almost at 1024x768 with libmh bound.
      - name: bigmap_click
        script: bigmap_click.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_click.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        post_check: [tools/check_bigmap.py, --click]
        tol: 0.0
      # mods:MM4B: the same click with the overlay centred on the landing spot / on the middle of the map (it stays put, the camera box and the world move).
      - name: bigmap_click_start
        script: bigmap_click_start.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_start.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        post_check: [tools/check_bigmap.py, --click]
        tol: 0.0
      - name: bigmap_click_map
        script: bigmap_click_map.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_map.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        post_check: [tools/check_bigmap.py, --click]
        tol: 0.0
      # mods:MM4C: a right click on the big map gives the selected units the side minimap's order.
      - name: bigmap_orders
        script: bigmap_orders.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_orders.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        # a pixel test of the big-map right click; pinned to retail movement so the arrived frames do not follow the movement defaults (mods:M1H, user 2026-10-17)
        net_extra: improved_movement=0;group_movement=0;improved_combat=0
        post_check: [tools/check_bigmap.py, --orders]
        tol: 0.0
      # mods:MM4C: the same with [ui] bigmap_orders=0: the right click on the big map is swallowed and does nothing.
      - name: bigmap_orders_off
        script: bigmap_orders_off.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_orders_off.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        # a pixel test of the swallowed right click; pinned to retail movement so the frame does not follow the movement defaults (mods:M1H, user 2026-10-17)
        net_extra: improved_movement=0;group_movement=0;improved_combat=0
        post_check: [tools/check_bigmap.py, --orders-off]
        tol: 0.0
      # mods:MM4: the big map, [ui] bigmap=0: Tab held draws nothing (the frame is the stock one). 2-almost at 1024x768 with libmh bound, camera pinned (camto), Tab held through the harness chord table.
      - name: bigmap_off
        script: bigmap_off.txt
        deploy_save: 2-almost
        extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/bigmap_off.ini]
        harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
        tol: 0.0
    desc: 'default-configuration solo steps (one process each): TUTORIAL entry, D13 galaxy picker background scaling, LIFT-TACT tactical HUD, D15 wheel HUD lists with libmh bound, G17 cfg restore under [config] mode=original, mods:MM4 big map centred on the start position / the map middle / switched off'
  # ship_walk: the solo rows of the SHIPPED configuration (mh.dll without libmh.dll) folded into one walk (tooling:TL-SUITE-FOLD
  # step 2, user 2026-10-15). Segments open with `mark <old row name>`, captures are <old row>__<name>, a red names its
  # segment. Replaced rows: libmh_absent (this walk's own configuration: the bind check below asserts libmh absent for the
  # whole process), wheel_menu_lists, wheel_lobby_log, wheel_hud_lists, wheel_info_pages. Not folded: wheel_hud_lists_lib
  # (libmh bound: a step of screen_seq), cfg_newgame_restore_ship and res_drag_stock (steps of satellite_seq, a process each: they
  # need cfgmod as the only highlighted save / wrap_window=0 as a boot key), the harness-fixture rows.
  - name: ship_walk
    budget_s: 35
    budget_evidence: "26 s solo, two green runs (2026-10-15) x1.3; the 8 folded rows summed ~120 s of loaded-suite time"
    kind: solo
    script: ship_walk.txt
    omit_satellite: [libmh.dll]
    # 2-almost*11,ayy30: a 12-entry Load list (wheel_menu_lists scrolls it), ayy30 the oldest and last row (the HUD segments pick it)
    deploy_save: 2-almost*11,ayy30
    extra_ini: tools/uiscripts/ini/ship_walk.ini
    harness_extra: pin_wallclock=1;pin_clock_dt_us=16667;pin_clock_base_s=1000;synth_move=0;region_hash_step=0
    # a UI/resolution walk whose frames and drag-box order oracle record retail movement; pinned off, not re-recorded (mods:M1H, user 2026-10-17)
    net_extra: improved_movement=0;group_movement=0;improved_combat=0
    post_check:
      # configuration (1): libmh.dll is missing for the whole process and nothing crosses; the other satellite binds
      - [tools/check_module_bind.py, --libmh, --expect, absent]
      - [tools/check_module_bind.py, --expect, bound]
      # the Shift re-arm and the two drag-select segments, each judged on its own segment's log lines and its own game's order
      # record: the walk starts one game per segment (--session counts the sessions that recorded orders, in walk order:
      # shift_rearm_build 1, res_drag_box 2, res_drag_wide 3, wheel_hud_lists 4, wheel_info_pages 5)
      - [tools/check_shift_rearm.py, --segment, shift_rearm_build, --session, '1']
      - [tools/check_drag_box.py, --segment, res_drag_box, --session, '2']
      - [tools/check_drag_box.py, --wide, --segment, res_drag_wide, --session, '3']
      # the big map: the world under it is masked in the frames (_ignore.json), so this reads the before / held / after / chat frames themselves
      - [tools/check_bigmap.py, --ship, --segment, bigmap]
    tol: 0.0
    desc: 'shipped configuration (no libmh): boot with libmh.dll missing, the wheel scrolling the Load list, the lobby chat log, the strategic side-panel lists and the info-screen pages, Shift keeping a building type armed, the drag-select box at 1920x1056 (eight drags and the wider-than-half-the-map ones)'
  # ship_orig_walk: ship_walk's original-configuration twin ([config] mode=original, mh.dll without libmh.dll), folded from
  # shift_rearm_build_orig, res_drag_box_orig, res_drag_wide_orig and wheel_hud_lists_orig (tooling:TL-SUITE-FOLD step 2). The
  # segments run the same scripts as ship_walk's and diff against the same frames. cfg_newgame_restore_orig and
  # a2_project_gate_original keep libmh bound, a different configuration, and stay separate rows.
  - name: ship_orig_walk
    budget_s: 30
    budget_evidence: "13 s solo, two green runs (2026-10-15), floored at 30 (BUDGET_FLOOR_S); the 4 folded rows were 30 s each at their budgets"
    kind: solo
    script: ship_orig_walk.txt
    omit_satellite: [libmh.dll]
    deploy_save: 2-almost*11,ayy30
    extra_ini: [tools/uiscripts/ini/ship_walk.ini, tools/uiscripts/ini/rollback_original.ini]
