    net_extra: 'transport=udp;frame_watchdog_inject_ms=1500'
    extra_ini: [tools/uiscripts/ini/video_640.ini]
    tol: 1.0  # the assertion is the post_check (the [freeze] line set), not pixels
    timeout: 400
    post_check_session: true
