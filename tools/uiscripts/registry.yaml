  - name: mp_snapshot
    # mp:X3c slice 4 (2026-09-30): REPURPOSED from the mp:X1b hold-and-verify shape into the FORCED-DESYNC arm of
    # the world resync. It runs in the FULL gate only: not in run_gate's SMOKE_ROWS, and no LIGHT_RULES entry
    # pulls it in (user, 2026-09-30) -- the light gate's UI half is that smoke set plus the rows a change names.
    budget_s: 120
    budget_evidence: "standalone rig runs 2026-09-30: 91 s, 91 s, 91 s (test_ui.py mp_snapshot, base 52352bd1 + slice 4) x 1.3 = 118; the wall is a real resync (~20 s channel-C transfer) plus ~5800 sim steps to game clock 55000"
    kind: multi
    no_hash_why: 'the client is poked on purpose (region_poke_at), so the plain per-step compare reds by design; its own post_check runs mp_analyze --resync-verify, which compares what a resync must make equal'
    host: mp_host_resync.txt
    clients: [mp_client_resync.txt]
    # udp is load-bearing: TCP answers snapshot rows 'unsupported', so a tcp run proves nothing. NO
    # data_timeout_ms raise any more: lockstep stays alive through the whole resync (the client keeps playing
    # live and the host never blocks on it), so the default GS2 timeout is the proof, not an obstacle.
    net_extra: transport=udp
    # video_1024 pins the persisted display mode; worldsync.ini is `[desync] action=1` (the ship default stays 0).
    extra_ini: [tools/uiscripts/ini/video_1024.ini, tools/uiscripts/ini/worldsync.ini]
    # symmetric: the per-region trail the verdict names the poked region from (RD every step, R every 50) and
    # the default synthetic move workload (orders keep flowing, so the admission log has something to replay).
    harness_extra: domain_hash_step=1;region_hash_step=50
    # The forced desync: flip byte 16 of hashed region 55 on the CLIENT at sim step 300. The host's
    # world is the authoritative one and stays untouched.
    harness_extra_client: region_poke_at=300;region_poke_only=55;region_poke_off=16
    # post_check needs both peers' logs (the decision and the capture on the host, the import on the client).
    post_check: [tools/mp_analyze.py, --resync-verify, --resync-within-steps, '2830']
    post_check_peers: true
    # the `; [worldsync]` lines are match-time mh_net.log content: the SESSION directory, not the process one
    post_check_session: true
    timeout: 420
    timeout_frames: 200000
    desc: 'mp:X3c: a forced desync on the client (region_poke) with [desync] action=1 -- the host decides, captures
      at S and ships its world, the client imports and catches up LIVE, and every step after is identical'
  - name: mp_snapshot_relay
    budget_s: 110  # mp:X3a: measured 84 s (x1.3); the host's `stalled 35000` must outlast the importer's >= 30 s hold
    kind: multi
    no_hash_why: 'its own post_check runs mp_analyze --snapshot-verify; snapshot_hold freezes the importer''s sim on purpose'
    host: mp_host_snapshot.txt
    clients: [mp_client_snapshot.txt]
    # udp is load-bearing: TCP answers snapshot rows 'unsupported', so a tcp run proves nothing.
    # data_timeout_ms (mp:X3a): the held importer stops advancing its lockstep horizon, so the host is
    # lockstep-blocked on it; the default 15 s GS2 timeout then DROPS the "silent" client, the host wins
    # and its gameover ends the client's match 15 s after the import (measured 2026-09-29). Raised so the
    # host's `stalled 35000` can outlast the >= 30 s the importer must survive.
    net_extra: transport=udp;force_relay=1;data_timeout_ms=120000
    relay: true
    # In-game captures -> the display mode must be pinned (it is a persisted setting).
    extra_ini: tools/uiscripts/ini/video_1024.ini
    # Both peers arm the receiver (cheap, avoids an asymmetric knob). snapshot_hold=1 stops the
    # client's sim at import time -- without it the client crashes within ~1 step. (mp:X3)
    harness_extra: snapshot_import=1;snapshot_log=200;region_hash_step=200;synth_move=0;snapshot_hold=1;domain_hash_step=1
    # Only the host captures/sends; both peers pushing 8MB at each other would test nothing.
    harness_extra_host: snapshot_at=120;snapshot_to=1
    # post_check needs both peers' logs (capture in one, import in the other, not either alone).
    # mp:X3a: --hold-survival-ms 30000 also requires a `SIM HELD alive ms>=30000` frame-path heartbeat,
    # the importer's `[import] fixup trailer v1:` population line and no crash marker.
    post_check: [tools/mp_analyze.py, --snapshot-verify, --hold-survival-ms, '30000']
    post_check_peers: true
    # Opt-in: importer crashes ~1 step after import (rewinds world while turn engine feeds live
    # inputs). Tracked as mp:X3 (needs a resync, not a rewind). Delete optin when X3 lands.
    optin: true
    timeout: 420  # Transfer takes 30-60s at channel C's rate limit, so timeout must outlast it. (mp:X1)
    timeout_frames: 200000
    desc: 'mp:X3d (relayed mp_snapshot): the host captures a live world at a sim step, channel C moves it to the client, and
      the client imports it -- every per-region hash identical, rng_state included'
