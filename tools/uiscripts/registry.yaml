    budget_s: 30
    kind: solo
    script: type_cyrillic.txt
    # Pins codepage (acp/CP1252 has no Cyrillic bytes): the pin is the feature under test. (mp:F3)
    extra_ini: tools/uiscripts/ini/input_cp1251.ini
    tol: 0.0  # Asserts the field buffer, not pixels: stock EN fonts have no Cyrillic glyphs to diff. (mp:F3)
    # desc omits literal Cyrillic: it prints to the console in the operator's own encoding.
    desc: 'F3/F4: `type` 6 Cyrillic chars on a Russian layout -- 6 scancodes, 6 CP1251 bytes stored'
  - name: type_polish
