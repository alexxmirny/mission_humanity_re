      omit_satellite: [libmh.dll]
    desc: 'G17/D47: a HOST and a JOINER that each loaded a save first start the match from the boot parse of the cfg tables, as a fresh joiner does -- all three peers 7-table clean, hashes identical; step 1 default configuration, step 2 the shipped one (libmh.dll absent)'
