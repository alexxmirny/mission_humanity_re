  # lang_seq (tooling:TL-SUITE-FOLD step 8, user 2026-10-15): the language-pack and typed-text solo rows, one PROCESS per step on one
  # lane built from LANG_PACK_GAME (solo_steps). Replaced rows: type_cyrillic, type_polish, lang_ru, lang_pl, lang_ru_noart,
  # lang_strings_fallback, status_wrap_ru. A step whose pack is missing SKIPS by name (the row is a SKIP only when every step is);
  # the type_* steps need no pack. They differ by ini ([lang] pack= / codepage pin) so they cannot share a process; the lane's
  # `lang/` folder holds every pack, `[lang] pack=` selects (it does not change the stock mh_ex the type_* steps see).
  - name: lang_seq
    budget_s: 40
    budget_evidence: "13 s solo here with the 4 pack steps SKIPPED (no PL / no-art / strings-clean RU pack on this box), two green runs; those 4 steps run ~4 s each on a full pack machine -> ~30 s x1.3"
    kind: solo
    lane_src: !ref LANG_PACK_GAME
    solo_steps:
      # F3/F4: `type` 6 Cyrillic chars on a Russian layout -- 6 scancodes, 6 CP1251 bytes stored. Pins codepage (acp/CP1252 has no
      # Cyrillic bytes): the pin is the feature under test. Asserts the field buffer, not pixels: stock EN fonts have no Cyrillic glyphs.
      - name: type_cyrillic
        script: type_cyrillic.txt
        extra_ini: tools/uiscripts/ini/input_cp1251.ini
        tol: 0.0
      # F3: `type` 4 Polish chars on the PL layout (AltGr) -- 4 CP1250 bytes stored. Pins codepage 1250 (differs above 0x80): catches a
      # silent ACP fallback.
      - name: type_polish
        script: type_polish.txt
        extra_ini: tools/uiscripts/ini/input_cp1250.ini
        tol: 0.0
      # LANG1-3: EN exe + the per-machine RU pack -- Russian 7-button menu, every hotspot on its painted label, built NETWORK GAME
      # hover art, merged-font probe (the F2b probe string renders through the RU pack's merged fonts).
      - name: lang_ru
        script: lang_ru.txt
        extra_ini: [tools/uiscripts/ini/font_merged.ini, tools/uiscripts/ini/lang_ru.ini]
        requires: lang_pack_precondition
        tol: 0.0
      # RL18: the Polish pack (built from the Extermination install). Baselines are composed art awaiting the user's sign-off --
      # re-baseline only with it.
      - name: lang_pl
        script: lang_pl.txt
        extra_ini: tools/uiscripts/ini/lang_pl.ini
        requires: lang_pack_pl_precondition
        tol: 0.0
      # LANG2 fallback: a RU pack WITHOUT the built 7-button art (`langpack.py build --id ru_noart --no-art`) -- the six stock buttons
      # stay where the art paints them and the network button draws itself in row 7 (mods:LANG4 string table).
      - name: lang_ru_noart
        script: lang_ru_noart.txt
        extra_ini: tools/uiscripts/ini/lang_ru_noart.ini
        requires: lang_pack_noart_precondition
        tol: 0.0
      # LANG4 fallback: lang_ru_noart's pack with menu.network_game dropped at load ([lang] test_drop_string) -- the row-7 button
      # reads NETWORK GAME on the Russian menu.
      - name: lang_strings_fallback
        script: lang_strings_fallback.txt
        extra_ini: tools/uiscripts/ini/lang_ru_noart_drop.ini
        requires: lang_pack_noart_precondition
        tol: 0.0
      # The lobby status field's word wrap (ui/lobby_notice.cpp status_draw) on a RU-pack line ~1.5x the field: no_net_boot's walk
      # (module=none) with [lang] pack=ru. EN side: no_net_walk's no_net_boot segment.
      - name: status_wrap_ru
        script: status_wrap_ru.txt
        net_extra: module=none
        extra_ini: tools/uiscripts/ini/lang_ru.ini
        requires: lang_pack_strings_precondition
        tol: 0.0
    # desc omits literal Cyrillic: it prints to the console in the operator's own encoding.
    desc: 'language and typed-text steps (one process each): F3/F4 typing on Russian and Polish layouts (field buffers), LANG1-3 RU pack menu, RL18 PL pack menu, LANG2 no-art fallback, LANG4 per-key English fallback, status field wrap on the RU pack (a step SKIPS by name without its pack)'
