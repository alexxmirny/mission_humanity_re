; Row res_walk: ONE process walks the resolution / HUD / panel-row / zoom segments on the committed saves. An EXPLICIT
; picker list (the engine's [0] 640x480 and [1] 800x576 are always prepended):
;   [2] 1024x768 [3] 1280x768 [4] 1280x960 [5] 1280x1024 [6] 1920x1080 (renders 1920x1056) [7] 1920x1440 [8] 2048x1152
;   [9] 2560x1440
; size_mode=2 boots at the stock 1024x768; the segments change size in game (ESC > Options > Screen size) the way a
; player does. 2560x1440 is the tallest entry, so the panel row tables are built for 1440 px. wheel_zoom=1 for the
; zoom segments. mouse_clip=0: a lane never confines a pointer.
[video]
backend=d3d11
picker=1
modes=1024x768,1280x768,1280x960,1280x1024,1920x1080,1920x1440,2048x1152,2560x1440
size_mode=2
filter=area
mouse_clip=0
[input]
backend=own
wheel_zoom=1
