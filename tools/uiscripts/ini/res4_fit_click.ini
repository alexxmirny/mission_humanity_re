; Row res4_fit_click (mods:RES17): the pointer half of the fit. An EXPLICIT resolution=1024x768 with ui_scale=175 in a real 1280x1000 window (the rig's
; desktop cannot hold a 2560 px one): the 1024x768 frame is smaller than the room the screen leaves, so the map is enlarged (k > 1) and the pointer
; must map back through the enlarged map quad and the scaled side panel (owned DirectInput, absolute packets at client pixels).
[video]
no_present=0
no_window=0
backend=gdi
window=windowed
resolution=1024x768
desktop=2560x1440
display_scale=100
mouse_clip=0
ui_scale=175
[input]
backend=own
wheel_zoom=0
