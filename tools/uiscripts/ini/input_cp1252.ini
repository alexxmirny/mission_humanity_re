; mp:F3c -- appended to the HOST's mh_net.ini by `ui_test.py --extra-ini-host` for the codepage_adopt /
; codepage_refused scenarios.
;
; PINNED, NOT `acp`, so the scenario means the same thing on every rig: the host advertises 1252 in
; SESSION_INFO whatever the machine's ANSI codepage is, and the client lane (pinned to 1251 by
; input_cp1251.ini) therefore DIFFERS from it by construction. Before F3c that pair was refused
; outright ("input codepage mismatch"); since F3c the joiner adopts 1252 from the advert at its JOIN.
[input]
codepage=1252
