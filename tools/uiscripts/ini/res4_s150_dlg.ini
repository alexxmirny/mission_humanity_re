; Rows res4_dlg_* (mods:RES4 stage 6b): res4_s150.ini plus the dev key ui_scale_dialog_check=1, which diffs each recovered translucent dialog
; layer against the stock draw over the true background and logs the max error (tools/check_res4_dialog.py demands <= 1). Was: res4_s150 (mods:RES4 stages 3-4): [video] ui_scale=150 with an automatic size on a pinned 1280x800 desktop
; (resolution=auto + the dev key desktop=): the session frame is the ideal one, 1216x800 (map 1040x752 + the 160-wide panel + the
; 32-high strip, hiding 16 map columns). A MAPPED windowed window on the rig's isolated desktop that the script resizes to
; 1280x800, so the presenter's screen is a real client area and the mouse is mapped through the quad list. The mouse is the owned
; DirectInput ([input] backend=own): rawmouse sabs/rel are what a tablet / VM pointer and a hand deliver.
[video]
no_present=0
no_window=0
backend=gdi
window=windowed
resolution=auto
desktop=1280x800
display_scale=100
mouse_clip=0
ui_scale=150
ui_scale_dialog_check=1
[input]
backend=own
wheel_zoom=0
