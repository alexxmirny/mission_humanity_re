; Appended to the peer's mh_net.ini by `ui_test.py --extra-ini` for the mp:GX1 overlay-residue
; regression test (tools/uiscripts/gx1_overlay_residue.txt). Proves mh/seams/gfx_overlay.cpp does
; not smear when its box shrinks: two pages of deliberately very different box size, captured IN A
; LIVE STRATEGIC MATCH (menu -> lobby -> launch, gamemode 2) -- NOT the main menu. The main menu
; fully recomposites every frame on its own (no dirty-tile bookkeeping at risk there at all, so a
; menu-only version of this test silently proves nothing: the main menu fully recomposites
; every frame regardless of any dirty-tile bookkeeping, so it was never at risk); a live
; strategic frame is the real risk surface, since only the ground-tile damage map can repaint what
; the overlay vacates.
;
; `page.wide`'s title line is 30 characters (180px) wide; `page.narrow` is a single "X" title plus
; one item (~40px). The WIDE title row's tail sits entirely outside the NARROW page's own box, so a
; working fix must have erased it by the second capture -- either the ground-tile stamp (strategic
; mode 2 has a ground pass) or gfx_overlay.cpp's own `clear_rect` hard reset. Both fire here; either
; alone would pass. tools/check_overlay_residue.py's post_check reads exactly that vacated region.
;
; overlay=1 (starts VISIBLE, unlike the shipped-shape debug_overlay.ini): this ini is test-only, not
; a shipped default, so there is no reason to spend a script step on the show/hide toggle -- see
; debug_overlay_net.ini / debug_overlay_sim.ini for the same starts-visible convention on a
; dev-verification-only [debug] block.
[debug]
overlay=1
rect=8,8
anchor=tl
color=ffff80
box=1
pages=wide,narrow
page.wide.title=GX1 RESIDUE CHECK WIDE HEADER
page.wide.items=mode,session,res
page.narrow.title=X
page.narrow.items=mode
next_page_key=Ctrl+Alt+PgDn
