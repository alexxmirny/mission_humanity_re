; Appended to the lane's mh_net.ini by `ui_test.py --extra-ini` for the win_resize scenario (PT-GFX3
; resize clause). The window geometry, the resize handling and the mouse mapping all live in the owned
; device's window code (src/mh_dll/mh/gfx/ddraw_own.cpp), which stands aside under [video] no_window --
; so this row turns no_window OFF and maps the window. The lane runs on the rig's isolated desktop, so a
; mapped window is still invisible to the operator. no_present=0: the presenter is what scales.
; mouse_clip=0: the lane must never confine a pointer (visible lanes write it too, make_lane.video_lines).
; mouse_absolute=1 drops the DirectInput mouse, so the posted messages `wmclick` sends are the game's
; only mouse producer -- the path whose coordinates the subclass maps client -> game.
[video]
no_present=0
no_window=0
backend=own
window=windowed
mouse_clip=0
[input]
mouse_absolute=1
mouse_trace=1
