; Row res19_user_gdi (mods:RES23-S0): the user's rc3 setup (see res19_user_d3d11.ini) on the OWNED gdi presenter: a BORDERLESS window,
; an EXPLICIT 1280x960 frame, Interface size 200, a 2560x1440 screen at display scale 125% (dev keys), a window that really presents.
[video]
no_present=0
no_window=0
backend=gdi
window=borderless
borderless_size=2560x1440
resolution=1280x960
filter=area
desktop=2560x1440
display_scale=125
mouse_clip=0
ui_scale=200
[input]
backend=own
wheel_zoom=0
