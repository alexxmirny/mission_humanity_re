; THE IN-MEMORY STATIC PATCHER, ARMED ON A FULL BOOT (fork F1E's spike, F3G's arm point, F4C-GATE's
; shipped set).
;
; `[patch] inmem` is DEFAULT OFF and this is the fragment that turns it on for a rig lane. It exists
; because the two ways the mechanism is otherwise exercised both stop short of a booting game: the
; parity oracle (tools/check_inmem_patch_parity.py --run) sets `dump_exit=1` and terminates one
; instruction after the apply, and patchtest drives the applier off the rig against a fake host. Both
; are deliberate -- see the file headers -- but neither says what a REAL run looks like with the
; manifest applied, and "the arm log the gate reads" is exactly that question.
;
; PAIR IT WITH tools/uiscripts/ini/rollback_original.ini, AND THAT IS A MEASUREMENT RATHER THAN A
; STYLE (fork F4C-GATE, 2026-09-13). Since Q7 the compiled-in set is the EN caphike/relocate family,
; and that family patches bodies this tree PROMOTES: 4 of projectile_pool_relocate_EN's 8 containing
; bodies are in `promotable_ranges`, 117 of grand_all_caphike_storagecap_EN's 530. Under the shipped
; `brokered` configuration the C1 interlock therefore REFUSES the manifest -- correctly, because
; those bytes never execute -- and the lane's arm log reads
;   `; [inmem] <name> REFUSED: site <N> (<X>) is inside llm_strat_sim_step, which is PROMOTED ...`
;   `; [inmem] 0 body(ies) registered with the interlock -- no in-memory manifest holds bytes ...`
; `[config] mode=original` is the configuration in which a shipped manifest actually applies, and
; both shapes are committed in the arm-order baselines (brokered.json carries the refusal pair,
; original.json the applied trio).
;
; ALSO PAIR IT WITH `--net-extra "enable=0"` for the F3G proof: a static patch is not a networking
; question, and since F3B the patcher arms from MH_Core_Arm rather than from behind `[net] enable`.
;
; WHAT IT COSTS THE ARM LOG, because this is not free and check_arm_order gates that log: an armed
; run in mode=original inserts exactly THREE structural lines at the patcher's arm point -- the
; baked-cave-VA line (always: that VA is an OS MEM_MAPPED region in every live process,
; docs/inmem-patching.md), the APPLIED line, and the F4C-COMP registration line naming every body --
; plus a fourth when `dump=` is set. MEASURED 2026-09-13 on the local parity lane:
; `--compare original_off original_inmem` = 1 structural edit / 0 text changes / 44 -> 47 lines,
; those three insertions and nothing else; `--compare brokered_off brokered_inmem` = 1 structural
; edit / 0 text changes / 70 -> 72, the refusal pair and nothing else.
;
; WHICH MANIFEST. mh.dll compiles in three alternatives and picks NONE by default -- they each bake a
; cave at the image's next-free VA, so there is no sensible default and the DLL refuses and lists
; them. This fragment names the gate manifest: projectile_pool_relocate_EN, the corpus's smallest
; live subject (75 sites, 8 bodies) and a same-size relocation, i.e. a behavioural no-op whose only
; visible effect is that the projectile pool now lives in a VirtualAlloc'd block. Swap the name for
; grand_all_caphike_storagecap_EN to arm the full 7,770-site limit raise.
[patch]
inmem=1
manifest=projectile_pool_relocate_EN
