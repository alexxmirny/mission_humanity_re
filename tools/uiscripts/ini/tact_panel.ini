; tact_panel: the [tactical] force-entry knobs for the tactical HUD capture scenario.
;
; WHY A SCENARIO NEEDS THIS AT ALL. A tactical mission is entered from a PLAYED strategic game --
; llm_strat_try_enter_tactical_mission wants control group 0 non-empty, a member whose proto carries
; soldiers, an enemy MAIN BASE within a wrapped tile distance of 15, and under 0x41 total soldiers.
; Those are properties of a game somebody played, not of a menu walk, so no script can reach one.
; The DLL's --tactical verb synthesises the squad blackboard instead (seams/launch.cpp
; enter_tactical) and the values below are what it synthesises FROM.
;
; Every value here is the DLL's own default, written out rather than inherited. The point is that
; the capture's content -- eight squad members at full health -- is then a property of this file
; that a reader can check, instead of a default someone could change under the baseline without
; the diff ever pointing here.
[tactical]
squad=8
hp_pct=100
commando=0
target_owner=1
target_building=0
