; mp:Q2/Q3 -- the SHIP default log level, on a rig lane (make_lane pins the rig to `normal`). At debug
; the level table turns on the observers, among them [desync] order_record (mh.dll's own order
; recording, mh_rec_orders.bin + mh_rec_clock.bin). Since mp:Q4 it does NOT turn on [desync]
; state_record (the whole-session state record): that is a player setting of its own -- pair this
; fragment with state_record.ini for both, as sp_state_record does.
[log]
level=debug
