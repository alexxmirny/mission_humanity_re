; Row ship_walk: ONE process in the shipped configuration walks the wheel / panel-list / drag-select / Shift-rearm segments.
; The union of the old rows' inis: wheel_lists.ini (own input backend, the wheel scrolls lists and zooms the map) for the wheel
; segments; the res_drag_* picker list (the engine's [0] 640x480 and [1] 800x576 are always prepended:
;   [2] 1024x768 [3] 1280x768 [4] 1280x960 [5] 1280x1024 [6] 1920x1080 (renders 1920x1056) [7] 1920x1440 [8] 2048x1152 [9] 2560x1440)
; for the two drag segments, which change the size IN GAME (ESC > Options > Screen size). size_mode=2 boots at the stock
; 1024x768, the size the wheel HUD segments and shift_rearm_build were baselined at. mouse_clip=0: a lane never confines a
; pointer. log level=debug: the drag and shift segments read the recorded orders (mh_rec_orders.bin).
[video]
backend=d3d11
picker=1
modes=1024x768,1280x768,1280x960,1280x1024,1920x1080,1920x1440,2048x1152,2560x1440
size_mode=2
filter=area
mouse_clip=0
[input]
backend=own
wheel_lists=1
wheel_zoom=1
[log]
level=debug
