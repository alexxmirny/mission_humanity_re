; mp:F2b -- appended to the lane's mh_net.ini by `ui_test.py --extra-ini` for the font_merged test.
; Arms the SAME [fonts] probe_text render probe font_guard.ini uses
; (src/mh_dll/mh/seams/gfx_font_guard.cpp) -- this fragment's probe_text differs: characters the
; STOCK fonts do not carry but the F2 merge does.
;
; THE PROBE TEXT IS 7-BIT, AND ITS NON-ASCII CHARACTERS ARE BACKSLASH-u ESCAPES, NOT RAW UTF-8 --
; see font_guard.ini for why: ui_test.py re-emits this fragment into the lane's mh_net.ini through
; Python's default text encoding (cp1252 on this rig), and a literal non-ASCII code point raises
; UnicodeEncodeError in the RUNNER before the game ever launches. The seam unescapes them itself --
; unescape_unicode() in src/mh_dll/mh/seams/gfx_font_guard.cpp.
;
; One probe character per F2 derivation family (the fonts page, "What the merge produces"):
;   U+041F U+0440 U+0438 U+0432 U+0435 U+0442  Privet, Cyrillic -- LIFTED byte-for-byte from the RU
;                                               override at its own FONTLAY ordinal
;   U+041A U+042A U+042E U+0401 U+0451          Cyrillic K/hard-sign/YU/IO/io -- DRAWN; the RU
;                                               override ships none of these five at all
;   U+0141 U+00F3 (+ ascii d) U+017A            Polish "Lodz" -- DRAWN: L-stroke, an acute-lift,
;                                               another acute-lift
;   U+0104 U+0119 U+017B U+0144 U+015A U+0107   the remaining two Polish derivation families:
;                                               ogonek x2, dot-above, three more acute-lifts
;   U+FFFD                                      the guard's own box, probed here as a REAL mapped
;                                               glyph (the substitute path is font_guard's, not this
;                                               scenario's)
; Every code point above is confirmed absent from every shipped retail FONTLAY on the fonts page
; ("Verdict: RU vs EN coverage") -- so this string can only render real glyphs (not the guard's '?'
; or box fallback) on an install this merge has actually reached.
[fonts]
glyph_guard=1
probe_text=F2b MERGED \u041F\u0440\u0438\u0432\u0435\u0442 \u041A\u042A\u042E\u0401\u0451 \u0141\u00F3d\u017A \u0104\u0119\u017B\u0144\u015A\u0107 [\uFFFD]
probe_xy=24,24
probe_font=4
probe_color=ffff
