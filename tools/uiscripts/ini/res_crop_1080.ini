; Row res_crop_1080 (mods:RES18): resolution=1920x1080 on a pinned 1920x1080 desktop. 1080 is not a multiple of the 32 px tile, so the game
; renders 1920x1088 and the presenter shows only 1920x1080 of it: no bars, the bottom strip on the screen's last row, the cropped map rows
; (frame rows 1048..1055) never visible or reachable by the pointer. The rig's window cannot be 1920x1080, so the dev key ui_screen pins the presenter's screen at 1920x1080 (the layout, the pointer map and pcapture
; use it, as in res4_fit_explicit); the pointer is the owned DirectInput's absolute packet at a CLIENT pixel = a screen pixel.
[video]
no_present=0
no_window=0
backend=gdi
window=windowed
resolution=1920x1080
desktop=1920x1080
display_scale=100
mouse_clip=0
ui_screen=1920x1080
[input]
backend=own
wheel_zoom=0
