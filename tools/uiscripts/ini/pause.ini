; D19 -- the big-map (game mode 5) hotkey scenario. Pins BOTH knobs the run depends on:
;
;   [video] size_mode -- the in-game capture's resolution is a PERSISTED setup.dat preference, so an
;                        unpinned in-game baseline silently inherits whatever the rig last saved
;                        (the same trap that broke esc_menu / res_hud; see tools/uiscripts/ini/video_640.ini).
;   [pause] key      -- the seam defaults to this scancode anyway, but a test must not depend on a
;                        default it does not state: if the default is ever rebound, the script's
;                        `key 0x19` should keep testing the FEATURE, not the default.
[video]
size_mode=0

[pause]
key=0x19
