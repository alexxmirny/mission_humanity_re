; [debug] block for the P1 net/lockstep + perf verification run.
;
; NOT a suite baseline: almost every value here (packet counters, horizons, frame times) legitimately
; changes run to run, so this page is for READING a live frame, not for pixel-diffing. The committed
; regression test stays tools/uiscripts/ini/debug_overlay.ini with its stable-provider page.
;
; Two pages so the page-cycling keys have something to cycle, and so the panel stays narrow enough to
; sit beside the HUD.
[debug]
overlay=1
rect=8,8
anchor=tl
color=ffff80
box=1
pages=net,perf
page.net.title=LOCKSTEP
page.net.items=net.player,net.peers,net.tx_rx,net.since_rx,net.clock,net.total,net.horizon,net.committed,net.lag,net.peer_ms,net.step_ms,net.stall,net.pcount,net.flags,net.sync
page.perf.title=PERF
page.perf.items=fps,perf.ms,perf.avg,perf.min,perf.max,perf.hitches,mode,session
