; [desync] dirty_probe -- MEASUREMENT ONLY (mh/desync/desync_watch.h "the dirty-block probe").
; Every sim step, diff the raw hash manifest against a shadow copy and count what changed (exact
; bytes + 64 B / 256 B / 1 KB / 4 KB grains, per region). Sizes an incremental keyframe+delta state
; recorder. Output: mh_dirty_probe.csv in the session folder + `; [desync] DIRTY` rollup lines in
; mh_net.log at match end, and the `; [desync] INC HASH` line (the mp:D39 incremental hash checked
; against a from-scratch recompute every 1000 steps; `0 DISAGREEING` is the pass). Since mp:D40 it
; rides the SHARED per-step state tracker, so it combines with state_record=1 (state_record.ini) at
; the cost of one scan. Typical use: replay a field recording with it --
;   python tools/replay_match_segment.py <match dir> --extra-ini tools/uiscripts/ini/dirty_probe.ini
[desync]
dirty_probe=1
