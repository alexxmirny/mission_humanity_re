; D13b: an EXPLICIT resolution list, so the committed baseline means the same thing on every machine.
; Enumeration (picker=1 alone) is per-MACHINE -- the dev box lists 12 modes and the test VM 11, with
; different orderings -- so "entry 4" would name a different size on each. That is the same
; inherited-config trap that left the older in-game baselines silently at 1024x768.
;
; This list yields: [0] 640x480  [1] 800x576  [2] 1024x768  [3] 1152x864  [4] 1280x800
; (the engine-native 0/1 are always prepended). Every entry is a mode BOTH the dev box and the VM
; enumerate, so no `unverified` override is needed and the availability check stays armed.
;
; size_mode=4 pins 1280x800 -- a size the stock 3-entry control cannot express, so a 1280x800 capture
; is the proof the extended index really drives the engine.
[video]
picker=1
modes=1024x768,1152x864,1280x800
size_mode=4
