; U21 -- the NEGATIVE arm: guard OFF, one malformed WM_DEVICECHANGE posted 6 s in.
;
; This is the RELIABLE REPRODUCTION the tracker asked for. Windows sends
; WM_DEVICECHANGE / DBT_DEVNODES_CHANGED (wParam 7, lParam 0) on any device-node change;
; llm_wnd_proc forwards every one of them to llm_wnd_on_devicechange, which dereferences
; lParam at entry+0x26 with no NULL check. With the guard off, this ini kills the game on
; demand -- and the crash it produces is byte-identical to the ones found in the rig's
; Application log (mh.focus.exe + 0x000c39b8, ACCESS_VIOLATION).
;
; Expect: the run dies mid-script, and `python tools/crash_report.py --since-min 5` names
; llm_wnd_on_devicechange+0x26.
[compat]
devchange_guard=0
devchange_probe_ms=6000
