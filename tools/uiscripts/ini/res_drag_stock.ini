; Row res_drag_stock (RES12 parity arm A): the STOCK drag-select box. A stock-sized mode (1024x768, view 864 px < half the
; 2048 px map) with the wrap splice off ([video] wrap_window=0): the game's own corner conversion. drag_box_fix stays on so
; the box logger (the guard is inert here) writes the same `; [drag_box]` lines the wide arm does.
[video]
backend=d3d11
picker=1
modes=1024x768
size_mode=2
filter=area
mouse_clip=0
wrap_window=0
[input]
backend=own
wheel_zoom=0
