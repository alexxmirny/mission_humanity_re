; Appended to the lane's mh_net.ini by `ui_test.py --extra-ini` for the imgui_hover scenario (PT-GFX6,
; plus the owned-DirectInput half folded in from input_own, PT-INPUT1). The ImGui overlay exists only on
; the d3d11 presenter with imgui=1. no_window=0 maps the window (on the rig's isolated desktop, still
; invisible to the operator) so `winsize` can scale it like a player's resize and an absolute packet is
; mapped through the image rect -- the chain a VM / RDP pointer takes; no_present=0: the overlay only
; runs inside the presenter. mouse_clip=0: a lane never confines a pointer. NO [input] mouse_absolute:
; the DirectInput mouse stays, which is the path under test (the overlay's DI filter, ImGui fed from the
; game cursor). [input] backend=own is PINNED, not inherited from the rig default: the script's raw*
; verbs feed the owned devices, so a `--input-backend system` arm must not move this row. key_trace=1
; logs every key-ring event the game receives to mh_input.log; mouse_trace=1 logs every element.
[video]
no_present=0
no_window=0
backend=d3d11
window=windowed
mouse_clip=0
imgui=1
[input]
backend=own
mouse_trace=1
key_trace=1
