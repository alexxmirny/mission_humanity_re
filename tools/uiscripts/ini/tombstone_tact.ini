; TACT1-P C4: force-arm the tombstones over the WHOLE verified tact set (98 rows), not the 11 that
; carry an MH_EXPORT_REPLACE. A row armed here is one we own: if our body is what runs, its original
; is never entered; if the original still runs, the trap names it and the run terminates. That is the
; coverage measurement -- a zero over the eleven proves nothing, which is why this file exists.
;
; AUDIT config, never ship. Run it with:
;   python tools/test_ui.py --extra-ini-all tools/uiscripts/ini/tombstone_tact.ini
[tombstone]
enable=1
force_arm_domain=tact
