; pause_mp_gate's GO-RED ARM (fork F5J) -- pass it as --extra-ini-client, i.e. to the CLIENT ONLY.
;
; WHY THE SCENARIO NEEDS ONE. `simstep 600` gates both in-game captures, and a wait predicate can
; always be wrong in one specific way: it can mask a real divergence by waiting for it to pass. This
; fragment is the measurement that it does not. It flips the CLIENT's strategic PRNG slot at sim step
; 200 -- 400 steps before the fenced capture -- so that peer's sim leaves the host's while both still
; ride the same lockstep session and both still reach step 600.
;
; EXPECTED (measured 2026-09-14, the run this file records):
;   g1_client_ingame  RED at 19.292%  -- the mothership and its fog shadow are somewhere else on the
;                                        map, which is a different WORLD, not a sprite phase out
;   g1_host_ingame    0.000%          -- the untouched peer is unaffected
;   the client's mh_harness.log still says `; [simfence] HELD at step 600`
; i.e. the fence waits for a STEP, not for agreement. If this ever comes back green, the predicate has
; started repairing what it is supposed to expose and the scenario is asserting nothing.
;
; TO RUN IT (the port is the lane's own -- read it off `test_ui.py pause_mp_gate`'s provisioning line):
;   python tools/ui_test.py --host lane=ui_pause_mp_gate_host:mp_host_pause_gate.txt \
;     --client lane=ui_pause_mp_gate_c1:mp_client_pause_gate.txt --connect-ip 127.0.0.1 --port <N> \
;     --extra-ini tools/uiscripts/ini/pause.ini --extra-ini tools/uiscripts/ini/fps60.ini \
;     --harness-extra "synth_move=0;region_hash_step=0" \
;     --extra-ini-client tools/uiscripts/ini/pause_mp_gate_desync_client.ini \
;     --headless --tol 0.0 --timeout 200 --timeout-frames 80000 --desktop mh_rig
;
; NOT registered as a suite entry, deliberately: it is a negative arm, so a green suite must NOT
; contain it. The registry entry's own comment carries the numbers; this file carries the recipe.
[harness]
rng_perturb_slot=0
rng_perturb_step=200
