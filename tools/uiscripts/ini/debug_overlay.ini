; Appended to each peer's mh_net.ini by `ui_test.py --extra-ini` for the debug-overlay regression test
; (P0). The overlay ships OFF, so this is the ONLY test that enables it -- every
; other baseline keeps rendering an overlay-free frame.
;
; The page deliberately lists ONLY run-to-run STABLE providers. `fps`, `frames` and `clock` change every
; run and would make the committed pixel baseline flap; `mode`/`session`/`res` are the same on every replay
; of the same screen.
[debug]
overlay=1
rect=8,8
anchor=tl
color=ffff80
box=1
pages=dbg
page.dbg.title=DEBUG OVERLAY
page.dbg.items=mode,session,res
