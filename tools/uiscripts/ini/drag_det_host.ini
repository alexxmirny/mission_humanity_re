; RES12 determinism: the HOST peer drag-selects at 1920x1056 (the walk changes the size in game, as res_drag_box does) while the
; lockstep match runs. The explicit mode list is the one res_walk / res_drag_box use: [2] 1024x768 [3] 1280x768 [4] 1280x960
; [5] 1280x1024 [6] 1920x1056. wheel_zoom=0, mouse_clip=0: a lane never confines a pointer.
[video]
backend=d3d11
picker=1
modes=1024x768,1280x768,1280x960,1280x1024,1920x1080,1920x1440,2048x1152,2560x1440
size_mode=2
filter=area
mouse_clip=0
[input]
backend=own
wheel_zoom=0
