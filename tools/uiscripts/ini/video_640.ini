; Appended by `ui_test.py --extra-ini` to pin a run to display mode 0 (640x480) -- the resolution the
; whole UI was authored for, and the reference the D13 layout work is measured against. D13;
; seam: src/mh_dll/mh/seams/video.cpp.
;
; Worth pinning EXPLICITLY rather than relying on "no [video] block": the mode is a PERSISTED user
; preference in setup.dat, so an unpinned run inherits whatever the test machine last saved (the rigs
; were found sitting at mode 2). Any resolution-sensitive test should say which mode it means.
[video]
size_mode=0
