; PT-GFX4 determinism evidence: `det_arms.py --determinism --det-local --steps 3000 --extra-ini-host
; tools/uiscripts/ini/imgui_open_host.ini`. The HOST presents through d3d11 with the ImGui overlay OPEN
; for the whole match (imgui_open_at_start opens it on the first present, no key needed); the client
; keeps the lane default. ALL PAIRS IDENTICAL then says the overlay -- its frames, its panel's global
; reads, its input consumption -- never reaches sim state.
; no_present=0 in case the lane was provisioned headless: the overlay only runs inside the presenter.
[video]
no_present=0
backend=d3d11
window=windowed
imgui=1
imgui_open_at_start=1
