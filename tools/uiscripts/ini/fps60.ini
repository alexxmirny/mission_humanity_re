; [video] fps_cap -- bound the headless frame loop (mh/seams/video.cpp, apply_fps_cap).
; Applied to every multi-peer suite test by test_ui.build_argv's kind=="multi" rule: their pace is
; set by the peer or the lockstep clock, so unbounded fps is spin, not speed.
;
; IT LIVES IN [video] SINCE FORK F2G, and the section it left says why it is here: the cap only
; arms when [video] no_present=1 has freed the present site, so the two keys were always one
; decision split across two sections. `[pacing]` is a REFUSED section now -- the DLL kills a run
; that still carries one, so an old copy of this fragment cannot quietly stop capping.
; Merged into the lane ini BY SECTION (ui_test.ini_merge_fragment), so it composes with the
; headless [video] block instead of shadowing it.
[video]
fps_cap=60
