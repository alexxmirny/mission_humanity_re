; [desync] per_step=0 -- this peer speaks desync WIRE_VERSION 1 only (the sampled FNV walk every
; `every` steps), exactly as a pre-mp:D44 build does. Used on ONE peer of a rig run as the stand-in for
; an older build (mp:D44 done_when d): the other peer must log FALLBACK once and still detect a desync.
[desync]
per_step=0
