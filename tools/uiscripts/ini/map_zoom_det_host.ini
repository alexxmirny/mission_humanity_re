; RES2 determinism: the HOST peer drives the map zoom with Raw Input wheel packets (`rawmouse wheel`), which need
; the owned DirectInput. Pinned, not inherited: a `--input-backend system` arm must not move this proof.
; mouse_clip=0: a lane never confines a pointer. D15: wheel_lists=1 (the ship default, pinned) -- the same host also wheels the side panel.
[video]
mouse_clip=0
[input]
backend=own
wheel_zoom=1
wheel_lists=1
