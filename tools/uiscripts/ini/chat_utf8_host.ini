; mp:MP-LANG -- the chat_utf8 HOST (appended by `ui_test.py --extra-ini-host`): the RU language pack AND
; a CP1251 local codepage (its Msgs.dat is CP1251). The client runs the EN pack pinned to 1250, so the
; two peers differ in pack AND codepage -- and the chat, being UTF-8, depends on neither.
[lang]
pack=ru
[input]
codepage=1251
