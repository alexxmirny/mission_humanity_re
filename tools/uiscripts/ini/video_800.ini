; Appended by `ui_test.py --extra-ini` to pin a run to display mode 1 (800x600 window, 800x576 rendered
; -- llm_gfx_set_window_resolution snaps the height down to a multiple of the 32px tile). D13;
; seam: src/mh_dll/mh/seams/video.cpp.
;
; This is the same state the game would be in had the user picked that resolution in the in-game options
; menu on a previous run (the preference lives in setup.dat's LZW-compressed settings block, which is why
; a rig cannot just edit the file).
[video]
size_mode=1
