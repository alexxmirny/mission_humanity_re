; [desync] state_record -- mp:D40, the whole-match state recording (mh/desync/state_recorder.h).
; Writes mh_match_state.bin (docs/state-record.md v1) into the match folder: a keyframe at step 1 and
; every state_keyframe_every steps, every step's changed bytes in between, END at match end; the
; `; [desync] STATE RECORD` lines in mh_net.log name the file, the step axis and the match-end cost.
; Typical use: replay a field recording with it, then read the file --
;   python tools/replay_match_segment.py <match dir> --extra-ini tools/uiscripts/ini/state_record.ini
;   python tools/state_record.py info <run folder>/mh_match_state.bin
[desync]
state_record=1
