; mods:M1WL v3: the imgui_heat row (plan map). The ImGui overlay exists only on the d3d11 presenter with imgui=1; it opens on the first present
; (imgui_open_at_start) with the heat map in mode 1 (imgui_heat_map: 1 last plan, 2 traffic). A mapped windowed window (no_window=0) so the
; presenter's game -> client mapping exists; no_present=0: the overlay runs inside the presenter.
[video]
no_present=0
no_window=0
backend=d3d11
window=windowed
mouse_clip=0
vsync=0
resolution=1280x960
imgui=1
imgui_open_at_start=1
imgui_heat_map=1
[input]
backend=own
