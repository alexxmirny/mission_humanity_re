; D13 mode-change guards: the galaxy (planet-select) screen at a picker mode LARGER than the 1024x768 art.
; An EXPLICIT list so index N means the same size on every machine (see video_picker4.ini for why
; enumeration must never decide it). The engine-native 0/1 are prepended:
;   [0] 640x480  [1] 800x576  [2] 1024x768  [3] 1280x768  [4] 1280x1024  [5] 1920x1440
; galaxy_native=0 keeps the STRETCHED screen (the fix-off twin of the galaxy_native_* rows): this row covers the
; header-aware scaled background guard, which the native 1024x768 screen no longer reaches.
; size_mode=3 pins 1280x768 -- the geometry of the rc8 crash report (galaxy view at 1280x768 read the next
; system's 800x576 background as 1280x768 words and ran off its allocation).
[video]
backend=d3d11
picker=1
modes=1024x768,1280x768,1280x1024,1920x1440
size_mode=3
galaxy_native=0
