; Row res4_quads (mods:RES4 stages 1-2): [video] ui_scale=150 on a pinned 1920x1080 screen (the dev key ui_screen, so the row is
; machine-independent and works on a headless lane that presents nothing). The game runs at 1856x1088 ([video] width/height =
; a custom mode 2), the frame RES4 will ask for on that screen at 150% (ceil32(1920-240)+160 x ceil32(1080-48)+32); `pcapture`
; composes the quad list the presenter draws over the game frame on the CPU. mouse_clip=0: a lane never confines a pointer.
[video]
backend=d3d11
width=1856
height=1088
filter=area
mouse_clip=0
ui_scale=150
ui_screen=1920x1080
[input]
backend=own
wheel_zoom=0
