; THE ROLLBACK ARM (C8-f, 2026-07-30; moved onto the D11 selector by fork F2C, 2026-09-12).
; Run the ORIGINAL engine instead of ours.
;
; Since C8-f, promotion is the SHIPPING DEFAULT, so an ini with no configuration in it at all runs
; our C++. This fragment is how a run asks for the stock implementation back, and C8's own scope
; requires that configuration to stay SUPPORTED AND TESTED -- not merely to exist.
;
; USE IT FOR: an asymmetric determinism run (pass it via --extra-ini-host or to one peer only, so the
; ORIGINAL is the reference oracle on the other side); bisecting a red run to "ours or theirs"; and
; reproducing pre-C8 behaviour when a bug report predates the cutover.
;
; ---- WHY THIS FILE IS NOW ONE LINE ---------------------------------------------------------------
;
; (mp:P9 2026-09-22: the resync_trigger_gate byte-patch carriers are BACK, so an unpromoted run HAS the gate again -- the UNCARRIED FIX lines below are historical.)
; It used to be a hand-listed block of twenty `[promote] <key>=0` lines, and the history it carried
; was a list of the times that went wrong: the 2026-09-01 promotion wave, SIM-HOSTREACH, SIM1-H and
; X-TL-P each shipped a key ON, each left it unnamed here, and each left the BASELINE arm running
; OURS until P0-SPDET failed by name with "both arms are promoted, so the comparison has nothing to
; say". Three of those cost a gate run. A rollback that misses a knob is not a rollback -- it is a
; quieter copy of the configuration it was meant to disprove, and it reads as agreement.
;
; D11 (src/mh_dll/mh/config/config.h) makes the configuration a VALUE instead of a list: `original`
; means every promotion default and the rebind-row default are 0, derived at their one source, so a
; promotion added tomorrow is rolled back here by construction and nobody has to remember this file.
; Measured equivalent to the 47-key + 719-row derived fragment over 8000 steps x 63 region channels,
; with perturbation and wrong-seed controls going red on cue (tracker fork F2A).
;
; ---- WHAT IS DIFFERENT ABOUT THIS ARM, and it is the reason the arm is tested rather than assumed:
; the byte patches that used to carry two fixes here are DELETED (C8-e, archived in
; The retired-patch log). So an unpromoted run does NOT have `resync_trigger_gate` at either site,
; and it says so by name -- expect two lines like
;   ; [net] UNCARRIED FIX: resync_trigger_gate is set, but its byte-patch carrier at 0049C508 was
;     RETIRED (C8) and its owner llm_net_lockstep_dispatch is NOT promoted this run ...
; That is the honest state, not a misconfiguration. Two fixes DO still arm here, deliberately:
; `resync_wait_fix` (its absence is the measured MP permanent-hang -- rule R3 in
; The seam-class taxonomy 4c makes it a permanent keep) and `resync_trigger_reset`.
[config]
mode=original
