; SIM1-P clause 4: force-arm the tombstones over the WHOLE VERIFIED SIM SET (530 rows), not the 84
; that carry an MH_EXPORT_REPLACE and certainly not the 4 note_promoted rows the 2026-09-02 close
; reported as "306 armed / 0 hits". A row armed here is one we own: if OUR body is what runs, the
; original is never entered; if the original still runs, the trap fires by name and the run
; terminates. That is the coverage measurement, and it is the only clause of this item that is
; STRICTLY STRONGER than anything the static census can say -- a census reports what the tree binds,
; a tombstone reports what executed.
;
; WHY force_arm RATHER THAN THE ORDINARY PROMOTED ARM. Rebinding a calls-struct member (clause 2)
; does NOT make its callee note_promoted -- no entry is installed -- so the ordinary arm would still
; cover only the handful of entry-seam rows and clause 4 would be as vacuous as the clause it
; replaces. force_arm keeps the live entry bytes and fills from entry+8, so a row still ENTERED by
; original code traps by name while a row reached through our own binding never touches the fill.
;
; force_arm_domain is the by-DOMAIN form of `[tombstone] force_arm=`, and the by-name key cannot
; express this: its list is parsed through a bounded stack buffer and sim's 530 names run to many
; kilobytes, so a hand-written sweep would TRUNCATE and report itself armed -- an under-armed set
; that reads exactly like a clean one.
;
; READ THE PER-DOMAIN LINE, NOT THE TOTAL: `; [tombstone] domain sim: N armed (...)`. A whole-run
; total reads identically whether sim contributed 530 or 4, which is precisely how the 2026-09-02
; close passed. A per-domain ZERO is a FAILURE.
;
; AUDIT config, never ship. Run it with:
;   python tools/test_ui.py --extra-ini-all tools/uiscripts/ini/tombstone_sim.ini
; Its NEGATIVE ARM (clause 5) is tombstone_negative_arm.ini, which rolls sim_step back to the
; ORIGINAL root so the trapped bodies ARE entered and the run terminates naming one. A force-arm
; sweep that has never been shown to fire is not evidence.
[tombstone]
enable=1
force_arm_domain=sim
