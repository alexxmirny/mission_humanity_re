; mp:F2 -- appended to the peer's mh_net.ini by `ui_test.py --extra-ini` for the font-guard test.
;
; [fonts] ships with no section at all, so this is the ONLY test that arms the render probe; every
; other baseline keeps rendering a probe-free frame. `glyph_guard` itself is ON by default and is
; spelled here so the scenario states what it is testing rather than inheriting it.
;
; THE PROBE TEXT IS 7-BIT, AND ITS NON-ASCII CHARACTERS ARE BACKSLASH-u ESCAPES, NOT RAW UTF-8.
; Raw UTF-8 fails in the RUNNER, not in the game: ui_test.py re-emits this fragment into the peer's
; mh_net.ini through Python's default text encoding (cp1252 on this rig), and a literal U+4E00
; raises UnicodeEncodeError before the game is ever launched (measured 2026-09-17). The seam
; unescapes them itself -- see unescape_unicode() in src/mh_dll/mh/seams/gfx_font_guard.cpp.
;
; The two characters are chosen to be UNMAPPABLE FOREVER: U+4E00 (CJK ideograph "one") and U+05D0
; (HEBREW ALEF). Neither is in any shipped FONTLAY, and neither is added by `src/formats/fnt.py
; merge` -- which matters, because a character the merged fonts DO carry would make this baseline
; depend on whether the operator has run the merge. The ASCII around them is what proves the guard
; substituted a character rather than eating the rest of the string.
[fonts]
glyph_guard=1
probe_text=F2 GUARD [\u4E00\u05D0] ascii intact
probe_xy=24,24
probe_font=4
probe_color=ffff
