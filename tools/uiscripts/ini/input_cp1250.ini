; mp:F3 -- the Polish arm. Same reasoning as input_cp1251.ini, one codepage over: CP1250 (Central
; European) is where the Polish layout's letters have bytes -- L-stroke 0xA3, o-acute 0xF3, z-acute
; 0x9F. CP1251 would encode none of the three and CP1252 only the o-acute, which is why "close enough"
; is not something this field can do: two codepages that agree below 0x80 and differ above it produce
; a chat line that looks fine right up until somebody types a letter with a diacritic.
[input]
codepage=1250
