; Rows res_drag_box / res_drag_box_orig (RES12): the drag-select box on the 64-tile map at the widest render the 1920x1080 entry
; gives (1920x1056, K = 288 horizontal). The process boots at the stock 1024x768 and the script changes the size in game
; (ESC > Options > Screen size, four clicks along this list: [2] 1024x768 [3] 1280x768 [4] 1280x960 [5] 1280x1024 [6] 1920x1056),
; the way res_walk does. wheel_zoom=0, mouse_clip=0: a lane never confines a pointer.
[video]
backend=d3d11
picker=1
modes=1024x768,1280x768,1280x960,1280x1024,1920x1080,1920x1440,2048x1152,2560x1440
size_mode=2
filter=area
mouse_clip=0
[input]
backend=own
wheel_zoom=0
