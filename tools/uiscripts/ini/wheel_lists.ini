; Rows wheel_menu_lists / wheel_hud_lists (D15): the mouse wheel scrolls the list under the pointer. backend=own so `rawmouse wheel` reaches the game
; (the system-backend path, WM_MOUSEWHEEL through the window tap, has no UI row -- the same gap as RES2). mouse_clip=0: a lane never confines a pointer.
[video]
mouse_clip=0
[input]
backend=own
wheel_lists=1
wheel_zoom=1
