; X-SPINE: force-arm the tombstones over the FULL PROMOTED SET -- every migration-ledger row at
; state `verified`, in EVERY domain, plus the promoted-fill the ship config arms by default.
;
; This is the terminal form of the per-domain fragments (tombstone_sim.ini, tombstone_tact.ini,
; tombstone_domains.ini), which each cover their own -P item's set. X-SPINE's claim is the union:
; "every closure we own is the one that executes", so the armed set has to be the whole owned set or
; the zero-hit result is a zero over a subset again -- the exact shape TACT1-P was reopened for (C4)
; and the shape the 2026-09-02 SIM close passed with (306 armed, 4 of them sim).
;
; WHAT THE SEVEN NAMES COVER. `force_arm_domain` sweeps mh::addr::verified_ranges FIRST (934 rows,
; keyed by the LEDGER's domain -- the file stem of tools/data/<domain>_migration.json) and then the
; promotable extent table (keyed by the owning TU's mh/<dir>/ path). Naming all seven ledger domains
; therefore arms every verified row there is; the promoted-fill half (enable=1, the ship default)
; covers the 38 pre-ledger lockstep/orders seams, which are promoted outright at ship and so are
; armed as `promoted-fill` rather than force-armed. 934 + 46 promotable-only = the 980 `done` rows
; tools/_reimpl.py counts. The promotion-reconciliation report closes that arithmetic against a
; real run's own report and names the residue.
;
; WHY `save` AND `seams` ARE NOT IN THE LIST, and this is a reason rather than an omission: those
; four save/load roots and two seam helpers are promotable but DELIBERATELY NOT PROMOTED at ship
; (mh::config::kSaveClosureOwned is false, so the save closure is ours in no configuration). Their
; originals are what runs, correctly, so force-arming them would trap a body the tree does not claim
; dead and terminate any scenario that saves or loads. They are RECONCILED BY NAME instead, which is
; what the reconciliation's residue list is for.
;
; READ THE PER-DOMAIN LINES, NOT THE TOTAL: `; [tombstone] domain <d>: N armed (...)`. A whole-run
; total reads identically whether seven domains contributed or one contributed everything, and a
; domain at ZERO is a failure, not a detail -- the report says so in those words when it happens.
;
; AUDIT config, never ship. Run it with:
;   python tools/test_ui.py --extra-ini-all tools/uiscripts/ini/tombstone_full.ini
;   python tools/test_ui.py --determinism --extra-ini-all tools/uiscripts/ini/tombstone_full.ini
; Its NEGATIVE ARM is tombstone_negative_arm.ini (roots rolled back to the ORIGINAL bodies, which
; then walk into their own traps and terminate the run naming the function). A force-arm sweep that
; has never been shown to fire is not evidence.
[tombstone]
enable=1
force_arm_domain=ai,lib_trans,net_session,orders_issue,sim,sim_resid,tact
