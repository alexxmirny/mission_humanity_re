; [desync] verbose -- log every AGREEING comparison of the D21 in-band desync watch
; (mh/desync/desync_watch.cpp: `; [desync] step=N peer=P MATCH state=...`, one line per judged
; sample at the shipped every=50 cadence). Off by ship default because a clean 20-minute match
; would write ~3000 lines saying nothing happened.
;
; mp:P9 turns it on for the CONFIGURATION-(1) match rows (match_launch_net / resync_storm_repro):
; without libmh.dll the determinism harness REFUSES TO ARM (ruling Q4), so mp_analyze has no R rows
; to compare, and the in-band watch -- whose sim_step trampoline installs in every configuration --
; is the only determinism instrument those runs have. Its rollup (`STATUS:` every 50 samples, the
; `match end:` line) never lands inside a match the runner ends at a gameclock, so the per-sample
; MATCH lines are what tools/check_resync_storm.py counts; a run without one is REFUSED, not passed.
[desync]
verbose=1
