; Row res_walk_auto: the GENERATED resolution list on a pinned 1920x1080 desktop at 100% (dev overrides, so the row is
; machine-independent), resolution=auto -> 1920x1080 at start (RES18: rendered 1920x1088, presented cropped). List order: the three classic sizes, then every 4:3
; size, then every 16:9 size, each ascending by area: [0] 640x480 [1] 800x576 [2] 1024x768 [3] 720x540 [4] 800x600
; [5] 960x720 [6] 1152x864 [7] 1280x960 [8] 1400x1050 [9] 1440x1080 [10] 960x540 [11] 1280x720 [12] 1366x768 [13] 1536x864 [14] 1600x900 [15] 1920x1080 (RES24). (An explicit modes= list would
; override resolution=auto, which is why this walk is separate from res_walk.) A MAPPED borderless window on the rig's
; isolated desktop: the galaxy cursor carry maps through the presented image rects and the menu round trip is about
; the window rect. wheel_zoom=0: the map zoom is off, the launcher's default. mouse_clip=0: a lane never confines a pointer.
[video]
no_present=0
no_window=0
backend=d3d11
window=borderless
resolution=auto
desktop=1920x1080
display_scale=100
mouse_clip=0
[input]
backend=own
wheel_zoom=0
