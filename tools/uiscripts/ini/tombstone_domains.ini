; ROOTS-LIVE's COVERAGE arm: trap every promotable body of the two domain roots' domains, so that
; "no original body is still entered" stops being a claim and becomes a run that either completes or
; terminates naming the function.
;
; force_arm_domain is the by-DOMAIN form of `[tombstone] force_arm=`. The by-name key cannot express
; this: its list is parsed through a bounded buffer and one domain's names run to kilobytes, so a
; hand-written whole-domain sweep would TRUNCATE and report itself armed -- an under-armed set that
; reads exactly like a clean one, which is the failure this instrument exists to expose.
;
; `enable=1` is the ship default and is repeated here only so the fragment is self-contained: the
; promoted-fill half must be on for the force-armed half to mean anything (a force-arm skips rows the
; promoted fill already covers, and the report says how many).
;
; READ THE PER-DOMAIN LINES, not the total. `; [tombstone] domain sim: N armed (...)` and
; `; [tombstone] domain tact: M armed (...)` -- a global total reads identically whether both domains
; contributed or one contributed everything, and a domain at ZERO is a failure, not a detail. The
; report says so in those words when it happens.
;
; THE NEGATIVE ARM is this fragment plus roots_original.ini: with `[promote] sim_step=0` /
; `tact_frame=0` the ORIGINAL roots run, walk into their own trapped bodies, and the run TERMINATES
; naming them. A force-arm sweep that has never been shown to fire is not evidence.
[tombstone]
enable=1
force_arm_domain=sim,tact
