; mp:F3 -- appended to the peer's mh_net.ini by `ui_test.py --extra-ini` for the Cyrillic scenarios.
;
; PINNING IS THE POINT, not a convenience. The ship default is `acp`, i.e. whatever this machine is
; localised to (CP1252 on this rig), and under CP1252 the Cyrillic letters the Russian layout produces
; have no byte at all -- which is exactly the state mp:F4 measured as six '?'. CP1251 gives them one.
;
; The value is also advertised in SESSION_INFO and echoed in JOIN, so a two-peer scenario must set the
; SAME value on BOTH peers or the host refuses the join with "input codepage mismatch" (which is the
; feature working, and net_selftest.exe sessionidtest is where that refusal is asserted offline).
[input]
codepage=1251
