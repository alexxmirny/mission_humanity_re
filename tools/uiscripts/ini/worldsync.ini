; [desync] action=1 -- the world resync (mp:X3c, mh/desync/world_sync.cpp), on for the run that carries this
; fragment. The SHIP DEFAULT STAYS action=0 (report only): this fragment is how a scenario opts in.
;
; What action=1 does: the HOST watches the per-step comparison; a peer that mismatches for
; 50 steps in a row (1 s), with the roster quiet, is sent the host's world over
; channel C (BEGIN -> capture at the host's next step S -> META + blob -> DONE). The diverged peer keeps
; playing live, imports at its own pace and catches up with the engine's own loop, capped per frame.
; The log prefix is `; [worldsync]` (NOT `[resync]`, which is the retail mode-8 barrier's).
;
; Used by:
;   * python tools/test_ui.py --determinism --extra-ini tools/uiscripts/ini/worldsync.ini
;     (action=1 with NO desync: must stay ALL PAIRS IDENTICAL and print no BEGIN/IMPORT line)
;   * the mp_snapshot scenario (the forced-desync arm, slice 4): a client-side region_poke, verified by
;     `mp_analyze --resync-verify`; it runs in the full gate only.
;
; The tuning (confirm 50 steps, roster quiet 250, max 3 resyncs, timeout 180 s, catch-up 20 steps per
; frame) is fixed in world_sync_core.h; `action` is the only [desync] key world sync reads.
[desync]
action=1
