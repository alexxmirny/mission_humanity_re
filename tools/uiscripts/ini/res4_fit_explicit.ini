; Row res4_fit_explicit (mods:RES17): an EXPLICIT resolution=1280x960 with [video] ui_scale=175 on a pinned 2560x1440 desktop (dev key desktop=;
; dev key ui_screen= makes the presenter's screen 2560x1440 whatever size the rig's window is, so the layout and pcapture use it). The game
; renders the 1280x960 frame it was asked for; the presenter must FIT it to the screen (map factor k > 1) rather than show a small 1:1 box in the
; middle (the 0.2.2-rc2 playtest: composition 1355x975 on 2560x1440).
[video]
no_present=0
no_window=0
backend=gdi
window=windowed
resolution=1280x960
desktop=2560x1440
display_scale=100
mouse_clip=0
ui_scale=175
ui_screen=2560x1440
[input]
backend=own
wheel_zoom=0
