; [debug] block for the P1 sim.* verification run. Like debug_overlay_net.ini
; this is a READ-the-frame aid, not a pixel baseline: the RNG words and power accumulators move every
; step. Cross-peer comparison is the point -- sim.rng must MATCH between peers in a healthy lockstep.
[debug]
overlay=1
rect=8,8
anchor=tl
color=ffff80
box=1
pages=sim
page.sim.title=SIM
page.sim.items=net.player,sim.rng,sim.power,sim.orders,sim.cursor,net.clock,net.lag,perf.avg,perf.max
