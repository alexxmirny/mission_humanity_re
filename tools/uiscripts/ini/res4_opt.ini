; Row res4_opt (mods:RES4): the in-game Options screen's Interface size row. [video] ui_scale=100 on a pinned 1920x1080 screen (the dev
; key ui_screen, so a headless lane presents nothing yet `pcapture` composes the presented image), the game at the 1856x1088 frame RES4
; asks for at 150% on that screen (a custom mode 2, like res4_quads). The row writes ui_scale back into this lane's mh_net.ini.
[video]
backend=d3d11
width=1856
height=1088
filter=area
mouse_clip=0
ui_scale=100
ui_screen=1920x1080
[input]
backend=own
wheel_zoom=0
