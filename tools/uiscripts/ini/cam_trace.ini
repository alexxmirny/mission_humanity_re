; Appended to the peer's mh_net.ini by `ui_test.py --extra-ini` for the cam_edge_scroll scenario
; (mp:SES3). The trace ships OFF, so this is the only registered run that turns it on -- every other
; baseline keeps an mh_uidrive.log with no `; [mtrace]` lines in it.
;
; Nothing else belongs in this file. mouse_div / mouse_accel / mouse_absolute would change the
; PRODUCER the scenario is measuring through, and the DI keyboard line (U25) is unconditional by
; design, so it needs no key here.
[input]
mouse_trace=1
