; THE SHIP CONFIGURATION, stated as a file so an A/B arm can NAME it.
;
; It exists because the alternative -- passing no --extra-ini at all -- makes the A/B's two arms
; differ in a way the command line does not record, and a run whose configuration is implicit is a
; run whose configuration nobody checks.
;
; `mode=brokered` overrides nothing: it selects the configuration in which every compiled-in ship
; default stands (mh/config/config.h: brokered is what an ini-less install runs), which is exactly
; what a player runs. Before fork F2C this file said the same thing by carrying an EMPTY `[promote]`
; and an empty `[rebind]` -- correct, but silent: it could not be told apart from a fragment that had
; lost its contents. The selector says it.
;
; Its counterpart is the ALL-ORIGINAL arm, which the promoted-vs-original A/B driver writes (test_ui.py's
; write_all_original_ini) as `[config] mode=original`. Together the pair is SIM1-P clause 3's
; whole-closure A/B: "the game running our closure" against "the game running its own code" -- and
; since D11 that pair really is one key against the other, rather than a value against a list of
; knobs somebody has to keep complete.
;
; DO NOT add pins here. A pin belongs in the harness-extra of the run shape that needs it, or in the
; module fragment under test. Anything added here silently stops being the ship configuration while
; still being called one.
[config]
mode=brokered
