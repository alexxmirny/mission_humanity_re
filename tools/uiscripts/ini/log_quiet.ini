; mp:Q1 -- the quiet log level with the state recorder on. `[log] level=quiet` sets lockstep_log=0,
; which until mp:Q1 also skipped the session_begin_multi hook (net_seams.cpp), so at quiet no MP match
; ever reached mh::desync::session_reset(): no per-step detection, no order digest, no recorder, and
; no manual-menu host player-count fix-up. state_record=1 (explicit, under the rig's dev unlock) makes
; the reset leave a FILE behind -- mh_match_state.bin opens at the first step after the reset -- and
; verbose=1 makes each judged sample a MATCH line, which only a peer in lockstep mode 3 can produce.
; tools/check_quiet_session.py reads both. Used by quiet_level and its fix-off twin.
[log]
level=quiet
[desync]
state_record=1
verbose=1
