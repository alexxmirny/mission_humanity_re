; Appended to the lane's mh_net.ini by `ui_test.py --extra-ini` for the imgui_swallow scenario (PT-GFX4).
; The ImGui overlay exists only on the d3d11 presenter with imgui=1; everything else ships it inert, so
; this is the only row that arms it. Windowed: client pixels are the game's own coordinates 1:1, which
; is what the script's `wmclick` coordinates assume.
; mouse_absolute=1 drops the DirectInput mouse, so posted window messages are the game's only mouse
; producer (the path `wmclick` drives). mouse_trace=1 logs every ring event to mh_mtrace.log -- the
; evidence that the swallowed click produced none.
; no_present=0: a headless lane cuts the per-frame blit (no_present=1), and with it every call into the
; presenter -- the overlay polls its toggle and builds its frames there, so it would never open. The
; window stays unmapped (no_window, the lane's own setting): d3d11 presents into a hidden window.
; [input] backend=system is PINNED (PT-INPUT1, 2026-09-29): the rig default is the owned DirectInput,
; and this is the suite's one row kept on the game's own dinput.dll, so the fallback's loader and DI5
; keyboard stay exercised. The scenario itself is backend-neutral (mouse_absolute=1 takes the DI mouse
; out; the swallow is on the message path). The owned device's DI filter is covered by imgui_hover.
[video]
no_present=0
backend=d3d11
imgui=1
window=windowed
[input]
backend=system
mouse_absolute=1
mouse_trace=1
